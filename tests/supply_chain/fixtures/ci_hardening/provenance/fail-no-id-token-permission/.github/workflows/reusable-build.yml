name: B
on: workflow_call
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write  # push the image
    steps:
      - run: echo build
  sign-attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write  # attach the signature and attestations
      attestations: write  # store the attestations
    steps:
      - name: Sign
        run: cosign sign --yes "${REF}"
      - name: Verify
        run: cosign verify "${REF}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: x
          subject-digest: y
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: x
          push-to-registry: true
