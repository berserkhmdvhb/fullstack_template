name: T
on: [push]
permissions: {}
jobs:
  images:
    permissions:
      contents: read
      packages: write  # push the images
      id-token: write  # keyless signing
      attestations: write  # store the attestations
    uses: ./.github/workflows/reusable-build.yml
  prep:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-prep.yml
