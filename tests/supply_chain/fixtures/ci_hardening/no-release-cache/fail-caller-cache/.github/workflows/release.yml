name: T
on: [push]
permissions: {}
jobs:
  images:
    permissions:
      contents: read
      packages: write  # push the images
      id-token: write  # keyless signing
      attestations: write  # store the attestations
    uses: ./.github/workflows/reusable-build.yml
  extra:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: x
          key: y
