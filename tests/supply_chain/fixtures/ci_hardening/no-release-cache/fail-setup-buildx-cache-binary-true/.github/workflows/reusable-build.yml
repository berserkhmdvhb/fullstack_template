name: B
on: workflow_call
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write  # push the image
    steps:
      - run: echo build
  sign-attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write  # attach the signature and attestations
      id-token: write  # keyless signing
      attestations: write  # store the attestations
    steps:
      - name: Sign
        run: cosign sign --yes "${REF}"
      - name: Verify
        run: cosign verify "${REF}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS_ENABLED == 'true'
        with:
          subject-name: x
          subject-digest: y
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS_ENABLED == 'true'
        with:
          subject-name: x
          push-to-registry: true
  extra:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: true
