# The default store on GKE: Google Secret Manager through Workload Identity, one per namespace of an
# environment (wiki/gke-cluster-setup.md, External Secrets). Applied by an admin with
# `kubectl apply -n <namespace> -f`; the chart's ExternalSecrets name it (secrets.externalSecret.secretStoreRef).
# The ServiceAccount is the store's identity only (no Pod runs as it): IAM grants its principal
# (ns/<namespace>/sa/external-secrets) Secret Accessor on that environment's secrets, by name prefix.
# projectID is left out: on GKE it is the cluster's project, read from the metadata server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secret-manager
spec:
  provider:
    gcpsm:
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: external-secrets
