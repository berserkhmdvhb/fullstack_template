# OpenBao instead of Secret Manager (wiki/security.md, OpenBao): its KV v2 engine at `secret`, Kubernetes
# auth with a role per namespace (the role name below is the namespace's; set yours), bound to that
# namespace only, and a policy that reads only what it needs: an app namespace its environment's path,
# secret/data/<service>/<env>/*, a database namespace only secret/data/<service>/<env>/db-password.
# The chart's values then name this store and the template <service>/<env>/{key}, property value.
# tests/k8s/test_external_secrets.py runs this file on kind, with the server and the role replaced and
# no CA (OpenBao's dev mode serves http).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: secret
      version: v2
      # The CA that signed OpenBao's certificate, in a ConfigMap of the same namespace.
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: your-service-name-dev
          serviceAccountRef:
            name: external-secrets
            audiences: [openbao]
