# Infisical instead of Secret Manager (wiki/security.md, Infisical): one machine identity per environment
# with read access to that environment only, its Universal Auth client in a Secret of the namespace
# (created by hand, never in git). The chart's values then name this store and the template
# /<service>/{key} (the environment is the store's environmentSlug). Set the project and environment slugs,
# and hostAPI for a self-hosted Infisical.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            key: clientSecret
      secretsScope:
        projectSlug: your-infisical-project
        environmentSlug: dev
        secretsPath: /
