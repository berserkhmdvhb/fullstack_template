# Helm values for the External Secrets Operator, from the chart pinned in tools/pins.tsv
# (external-secrets-chart). The GKE guide installs it with these (wiki/gke-cluster-setup.md, External
# Secrets) and tests/k8s/test_external_secrets.py installs it on kind with them too.
# The three images are the chart's own (controller, webhook, cert controller), its appVersion pinned by
# digest. Renovate reads each `# renovate: image=` line and moves the tag and digest below it, with
# the chart pin and the CRD source (charts/your-service-name/ci/crds/sources.tsv) in one pull request.
image:
  # renovate: image=ghcr.io/external-secrets/external-secrets
  tag: "v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31"
webhook:
  image:
    # renovate: image=ghcr.io/external-secrets/external-secrets
    tag: "v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31"
certController:
  image:
    # renovate: image=ghcr.io/external-secrets/external-secrets
    tag: "v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31"
# A store decides what can be read, so only the platform's admins create one: the chart's default
# would add the store kinds to every namespace's `edit` and `admin` roles. Reading them stays in `view`.
rbac:
  aggregateToEdit: false
  aggregateToAdmin: false
