# Offline tests for ../kyverno-verify-images.yaml (run: kyverno test deploy/policies/tests).
#
# What `kyverno test` can evaluate without a registry: whether an image matches the
# matchImageReferences glob. Images outside the glob pass untouched (no verification is attempted).
# A matched image makes the CLI try to resolve and verify it, which needs a registry, so the test
# can only show that the match happened and the evaluation errored.
#
# What it cannot evaluate: the signature, the certificate identity/issuer/repository, the Rekor
# entry and the provenance attestation. Those are checked against a real registry by the live test
# on a kind cluster, with a signed and an unsigned image. The policy's exact shape is pinned by
# tests/supply_chain/test_admission_policy.py.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-your-service-name-images
policies:
  - ../kyverno-verify-images.yaml
resources:
  - resources.yaml
results:
  - policy: verify-your-service-name-images
    resources:
      - foreign-image
    kind: Pod
    result: pass
  - policy: verify-your-service-name-images
    resources:
      - other-owner-image
    kind: Pod
    result: pass
  - policy: verify-your-service-name-images
    resources:
      - matched-image-unverifiable
    kind: Pod
    result: error
