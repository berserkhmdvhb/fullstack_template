# The connector: 2 replicas spread over the nodes, the restricted Pod Security profile, a read-only
# filesystem and no Kubernetes API token. Cloudflare supports each cloudflared release for one year, so
# the image is pinned by digest and moved with each release (renovate does it, or the guide's upgrade step).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloudflared}
  template:
    metadata:
      labels: {app: cloudflared}
    spec:
      priorityClassName: cloudflared
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: cloudflared}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: cloudflared}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: tunnel-token, key: token}
          ports:
            - {name: metrics, containerPort: 2000}
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 8
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
