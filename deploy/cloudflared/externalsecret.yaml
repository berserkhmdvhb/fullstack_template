# The tunnel token from Secret Manager, through the namespace's `secret-manager` SecretStore
# (deploy/external-secrets/secretstore-secret-manager.yaml, applied with `-n cloudflared`). The
# operator writes the Secret `tunnel-token`, key `token`, which the Deployment reads as TUNNEL_TOKEN.
# The Secret Manager secret is `cloudflared-tunnel-token`; the store's identity may read secrets with the
# `cloudflared-` prefix only. The token reaches the Pod as an environment variable, so a rotated token
# needs `kubectl -n cloudflared rollout restart deployment/cloudflared`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tunnel-token
  namespace: cloudflared
spec:
  secretStoreRef:
    name: secret-manager
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: tunnel-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: cloudflared-tunnel-token
