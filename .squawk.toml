# squawk configuration (read by scripts/ci/squawk.sh). squawk's default rules apply; the exceptions are listed
# here, each with its reason.
#
# prefer-text-field: it flags every VARCHAR(n). Two are unavoidable and one is a decision, none can change:
#   - alembic_version.version_num VARCHAR(32) is Alembic's own table, created by Alembic itself.
#   - items.name VARCHAR(255) (revision 0001) is a deliberate length limit that the API also enforces. The
#     revision is applied on every deployed database; changing it now would only make new and old databases differ.
# A new migration that needs a bounded string should use text with a CHECK constraint; review it on its merits.
excluded_rules = ["prefer-text-field"]

# The runtime database is PostgreSQL 16 (charts: postgresql.image).
pg_version = "16"

# No assume_in_transaction: the offline SQL carries its own BEGIN and COMMIT.
