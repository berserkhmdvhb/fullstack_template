# pnpm reads its settings from this file (a project of its own; .npmrc holds only auth and registry settings).
# The same policy as the frontend: wiki/frontend-deployment.md#install-scripts.

# The store and the cache live in the repository's gitignored .tools/, never under $HOME.
storeDir: ../.tools/pnpm/store
cacheDir: ../.tools/pnpm/cache

# Resolve, and accept from the lockfile, only releases at least 7 days old (10080 minutes), transitive ones included.
minimumReleaseAge: 10080

# Only direct dependencies may come from git or a tarball URL.
blockExoticSubdeps: true

# Fail when a package's trust evidence drops (for example from provenance to none) against its earlier releases.
trustPolicy: no-downgrade

# Never download another pnpm, and keep pnpm's own record out of pnpm-lock.yaml: a lock with that record is two YAML
# documents, which GitHub's dependency graph (and so Dependabot's alerts) cannot read. The version is enforced by
# scripts/check-pnpm-version.mjs, which every CI job and the image build run before they install (a local install
# is not checked; make tools links only the pinned pnpm).
pmOnFail: ignore

# No dependency build script runs: every package that declares one is denied here, and an install fails on one not listed.
strictDepBuilds: true
allowBuilds:
  fsevents: false
