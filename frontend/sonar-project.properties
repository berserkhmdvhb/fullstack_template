# SonarQube integration for frontend static analysis.
#
# This file configures SonarQube to analyze the frontend codebase.
# It is read by the SonarQube scanner during CI.
#
# Key settings:
# - Project identification (key, name, version)
# - Source directories and exclusions
# - Coverage report locations
# - ESLint report locations

# Project identification
sonar.projectKey=service-template-frontend
sonar.projectName=Service Template Frontend
sonar.projectVersion=0.1.0

# Source configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions
sonar.exclusions=**/node_modules/**,\
                 **/.next/**,\
                 **/dist/**,\
                 **/build/**,\
                 **/*.test.ts,\
                 **/*.test.tsx,\
                 **/*.spec.ts,\
                 **/*.spec.tsx,\
                 **/__tests__/**,\
                 **/e2e/**,\
                 lib/api/types.gen.d.ts

# Test coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ESLint reports (uncomment when ESLint JSON output is configured in CI)
# sonar.eslint.reportPaths=eslint-report.json

# Coverage thresholds (optional, enforced in CI via vitest.config.ts)
# sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx
