# lychee: the offline link check over the public docs (`make docs-links`, which the repo job in
# .github/workflows/ci.yml runs). The inputs are the tracked Markdown files (git ls-files), so untracked
# and ignored files are never read. Only file links and in-repo #anchors are checked: no network, no cache.

# No network: every http(s) link is skipped, so the check is hermetic and never flaky.
offline = true
# A #anchor must name a heading of the target page.
include_fragments = "anchor-only"
cache = false
no_progress = true
