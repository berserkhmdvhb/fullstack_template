# Defaults for every environment; values.<env>.yaml overrides only what differs.

# The Helm release name of the app (SERVICE_NAME in CI). The app namespace is <release>-<environment>.
release: your-service-name
# The app chart's fullnameOverride and nameOverride, when the release sets them (they name the app's
# Role and RoleBinding, which this bootstrap renders from the chart). "" lets the chart derive the
# name as it always does; an override in the chart's values.<env>.yaml is read too.
fullname: ""
nameOverride: ""
# The app's ServiceAccount, the subject of its RoleBinding: set it when the release overrides the
# chart's serviceAccount.name anywhere but the chart's values.<env>.yaml. "" uses the chart's own.
serviceAccountName: ""
environment: dev
# "" => <release>-<environment>. The database namespace is <namespace>-<dbSuffix>, as the chart derives it.
namespace: ""
dbSuffix: db
# The app namespace's `tier` label, which the chart's database NetworkPolicy admits: the chart's
# namespaces.appTier for this environment (a test keeps the two equal).
appTier: app-ns
# true: also create the app's ServiceAccount, rendered from the chart's templates/serviceaccount.yaml
# (the preview namespace: its releases share one, and the chart there runs with serviceAccount.create false).
sharedServiceAccount: false
# The Kubernetes version of the Pod Security rules the namespaces enforce (restricted): the chart's
# kubeVersion floor (a test keeps them equal).
podSecurityVersion: v1.34
# monitoring.flavour gmp (Google Managed Prometheus) only: also render the chart's cluster-scoped
# ClusterRules (the kube-state-metrics and cAdvisor alerts). A namespaced Rules object cannot see
# those series, and the deployer has no cluster rights, so the admin applies this once. Set it with
# the chart's monitoring.flavour: gmp in the chart's values.<env>.yaml (the selectors there, such as
# monitoring.gmp.objectNamespaceLabel, are read from the same file). The bootstrap refuses it when
# that environment's flavour is not gmp, rather than running the kube alerts twice.
gmpClusterRules: false
database:
  # true: the chart's in-cluster PostgreSQL is used, so the database namespace is created too.
  inCluster: true

# The identity the deploy runs as, bound in each namespace. kind: User, Group or ServiceAccount
# (a ServiceAccount also needs its namespace). The default is a placeholder. On GKE the user name is
# the deployer's Google service account email, for example
#   kind: User
#   name: gh-deployer-dev@<PROJECT_ID>.iam.gserviceaccount.com
deployer:
  kind: User
  name: your-deployer
  namespace: ""

# The app namespace's ResourceQuota, sized from the chart's worst case by a test
# (tests/backend/test_chart_quota.py): every Deployment at its HPA maximum plus the rollout surge
# and a wave of terminating Pods, the WAF, the Cloud SQL proxy sidecars, the migration Job and the helm test Jobs, with
# 20% headroom. Raising a replica count, an HPA maximum or a request needs a quota bump here, or
# that test fails. The database namespace has none. There is no limits.cpu: CPU limits are off by default (they throttle),
# and a CPU-limit quota would refuse every Pod without one. The memory request and limit of each
# container are equal (the chart enforces it), so the two memory caps track each other.
# quotaReleases: how many releases of the chart the quota is sized for (the test multiplies the worst
# case by it); 1 but in the preview namespace, which holds one release per pull request.
quotaReleases: 1
quota:
  hard:
    requests.cpu: "6"
    requests.memory: 27Gi
    limits.memory: 27Gi
    pods: "30"
    services: "10"
    persistentvolumeclaims: "5"
    configmaps: "10"
    # Helm's release history (the deploy keeps 5: HELM_HISTORY_MAX in scripts/ci/deploy-env.sh), plus
    # the one written during an upgrade, the chart's own Secrets and headroom for a pull,
    # TLS and database CA secret. A test recomputes it.
    secrets: "15"

# The app namespace's LimitRange. No CPU in default or max: a max with no default becomes the
# default limit, so either one would put a CPU limit on every container.
limitRange:
  container:
    default: {memory: 512Mi}
    defaultRequest: {cpu: 100m, memory: 128Mi}
    max: {memory: 2Gi}
    min: {cpu: 50m, memory: 64Mi}
  pod:
    max: {memory: 4Gi}
