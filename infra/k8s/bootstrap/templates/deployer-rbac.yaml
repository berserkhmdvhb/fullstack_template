{{/*
   The deployer's rights, one Role and RoleBinding per namespace: what `helm upgrade --install` of the
   app chart needs, and the deploy's own checks (scripts/ci/deploy-env.sh), nothing else. No pods/exec:
   the verify step asks each Pod over a port-forward.
   - Write access to exactly the kinds the chart renders in that namespace, plus Helm's release
     Secrets. tests/backend/test_k8s_bootstrap.py derives that set from the chart, so a kind added
     to the chart fails the test until it is added here.
   - Never: a wildcard, escalate, bind or impersonate; namespaces, resourcequotas or limitranges;
     or any Role or RoleBinding. The app's own Role and RoleBinding come from this bootstrap too
     (scripts/k8s-bootstrap.sh renders the chart's templates/rbac.yaml), so the deployer can neither
     change its own rights nor copy them to another identity.
*/}}
{{- $helm := list "get" "list" "watch" "create" "update" "patch" "delete" }}
{{- $read := list "get" "list" "watch" }}
{{- range (include "bootstrap.namespaces" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-deployer
  namespace: {{ .name }}
  labels:
{{- include "bootstrap.labels" $ | nindent 4 }}
rules:
{{- if eq .role "app" }}
  # The chart's kinds in the app namespace. Secrets also hold Helm's release records.
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts]
    verbs: {{ toJson $helm }}
  - apiGroups: [apps]
    resources: [deployments]
    verbs: {{ toJson $helm }}
  - apiGroups: [batch]
    resources: [jobs]
    verbs: {{ toJson $helm }}
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: {{ toJson $helm }}
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: {{ toJson $helm }}
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: {{ toJson $helm }}
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: {{ toJson $helm }}
  - apiGroups: [networking.gke.io]
    resources: [healthcheckpolicies, gcpbackendpolicies]
    verbs: {{ toJson $helm }}
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, prometheusrules]
    verbs: {{ toJson $helm }}
  # monitoring.flavour gmp (Google Managed Prometheus): the namespaced kinds. ClusterRules is
  # cluster-scoped and comes from this bootstrap (gmpClusterRules), never the deploy.
  - apiGroups: [monitoring.googleapis.com]
    resources: [podmonitorings, rules]
    verbs: {{ toJson $helm }}
  # secrets.externalSecret.enabled: the ExternalSecret that syncs the app Secret (External Secrets
  # Operator; the operator itself and its store are the platform's).
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: {{ toJson $helm }}
  # The deploy's checks, one line each:
  # helm --wait reads a Deployment's Pods; deploy-verify.sh lists them.
  - apiGroups: [""]
    resources: [pods]
    verbs: {{ toJson $read }}
  # helm --wait reads a Deployment's ReplicaSets.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: {{ toJson $read }}
  # migration-job-lib.sh prints a failed migration's logs.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The smoke test and deploy-verify.sh's health checks reach the Pods over a port-forward.
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
{{- else }}
  # The chart's kinds in the database namespace (the ConfigMap holds the restore check's script).
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims]
    verbs: {{ toJson $helm }}
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: {{ toJson $helm }}
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: {{ toJson $helm }}
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: {{ toJson $helm }}
  # helm --wait reads the StatefulSet's Pods.
  - apiGroups: [""]
    resources: [pods]
    verbs: {{ toJson $read }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-deployer
  namespace: {{ .name }}
  labels:
{{- include "bootstrap.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bootstrap-deployer
subjects:
{{- if eq $.Values.deployer.kind "ServiceAccount" }}
  - kind: ServiceAccount
    name: {{ $.Values.deployer.name }}
    namespace: {{ required "deployer.namespace is required for a ServiceAccount" $.Values.deployer.namespace }}
{{- else if has $.Values.deployer.kind (list "User" "Group") }}
  - apiGroup: rbac.authorization.k8s.io
    kind: {{ $.Values.deployer.kind }}
    name: {{ required "deployer.name is required" $.Values.deployer.name | quote }}
{{- else }}
{{- fail "deployer.kind must be User, Group or ServiceAccount" }}
{{- end }}
{{- end }}
