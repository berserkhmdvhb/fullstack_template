{{/*
   The namespaces, on the restricted Pod Security profile (enforce, audit and warn). Every workload of
   the chart meets it (tests/backend/test_chart_pod_security.py). `tier` is what the chart's
   NetworkPolicies select on: db-network-policy.yaml admits the app namespace by `tier: app-ns`.
*/}}
{{- range (include "bootstrap.namespaces" . | fromJsonArray) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
{{- include "bootstrap.labels" $ | nindent 4 }}
    tier: {{ if eq .role "app" }}app-ns{{ else }}db{{ end }}
{{- if eq .role "db" }}
    component: database
{{- end }}
{{- range $mode := list "enforce" "audit" "warn" }}
    pod-security.kubernetes.io/{{ $mode }}: restricted
    pod-security.kubernetes.io/{{ $mode }}-version: {{ $.Values.podSecurityVersion }}
{{- end }}
{{- end }}
