# =============================================================================
# adopt.conf — config-driven template adoption.
#
# This repo is a TEMPLATE: it ships with the placeholder identity
# `your_service_name` and the placeholder coordinates `your-domain.example` /
# `registry.your-domain.example`. To make it YOUR service, edit the three values
# below, then run the adapter:
#
#   infra/adapt/adopt.sh            # apply
#   infra/adapt/adopt.sh --dry-run  # preview (touches nothing)
#
# One config drives BOTH axes of adoption:
#   * identity    (SERVICE_NAME) -> the Python package, the image-name suffix,
#                   the k8s name prefix, BACKEND_ENTRY, CI package_name, …
#   * deployment  (DOMAIN, REGISTRY) -> the ingress base domain and the image
#                   registry the CI-built images live in.
#
# Every real run backs up every touched file to .adapt-backup/<timestamp>/
# (gitignored) first; --dry-run writes nothing. Re-running is a no-op once the
# placeholders are gone, so it is safe to run twice.
# =============================================================================

# The new service name. Lowercase [a-z][a-z0-9_]* — it becomes a Python package,
# an env var, a Dockerfile suffix and a k8s name prefix, so it must be a bare
# identifier. The OLD name is auto-detected (pyproject.toml / src/), so this is
# the TARGET only.
SERVICE_NAME="your_service_name"

# Base domain for the ingress hosts. Stamped over every `your-domain.example` in the
# values files, giving <slug>.<DOMAIN> (and <slug>-dev / <slug>-qa for the other environments).
#   e.g. my-company.example   (or your cluster's base domain)
DOMAIN="your-domain.example"

# Image registry holding the CI-built images. Stamped over `registry.your-domain.example`
# in the values files. For GitHub Container Registry this is ghcr.io plus the
# lowercased owner and repository (the images are <value>/<id>):
#   ghcr.io/my-org/my-repo
REGISTRY="registry.your-domain.example"

# Optional: the GitHub repository as owner/name. Stamped over `your-org/your-repo` in the
# SOURCE_URL default of the three Dockerfiles (the OCI `source` label, which GHCR uses to link the
# image to the repository; CI always passes the real URL, this default is for local and kind
# builds), the README badges and the links in SECURITY.md, the issue forms and the pull request
# template. Leave it empty to keep the placeholders.
#   e.g. my-org/my-repo
REPOSITORY=""

# Optional: the owner in .github/CODEOWNERS, stamped over its placeholder. A user @name, a team
# @org/team or an email; GitHub rejects a bare organisation there. Leave it empty to keep the
# placeholder (the adapter prints a notice).
#   e.g. @my-name   or   @my-org/my-team
CODEOWNER=""
