# -----------------------------------------------------------------------------
# Security Configuration (SBOM + Vulnerability Scanning)
# -----------------------------------------------------------------------------

# ---------- Output ----------
output:
  base: output/security

# ---------- Toolchain ----------
# Pinned, checksum-verified release versions — the single source of truth.
# Bump here; the CI jobs and the scripts read these via cfg() (needs yq).
# Any one may be overridden at runtime via its <TOOL>_VERSION variable.
tools:
  # renovate: datasource=github-releases depName=sigstore/cosign
  cosign: v3.1.4
  # renovate: datasource=github-releases depName=anchore/syft
  syft: v1.55.0
  # renovate: datasource=github-releases depName=anchore/grype
  grype: v0.121.3
  # renovate: datasource=github-releases depName=anchore/grant
  grant: v0.6.8
  # OSV-Scanner: source/lockfile SCA + known-malicious (OSV.dev MAL-*). Checksum-verified
  # static binary (tools-install.sh). Reads resolved lockfiles (npm package-lock.json,
  # requirements.txt, poetry.lock…); PEP 621 pyproject.toml declarations are NOT parsed,
  # so pip_audit remains the Python known-CVE SCA (see wiki/supply-chain-tooling-assessment.md).
  # renovate: datasource=github-releases depName=google/osv-scanner
  osv-scanner: v2.7.0
  # SBOM quality + NTIA compliance scoring (interlynk-io/sbomqs). Checksum-verified static
  # binary (tools-install.sh). It ASSESSES the SBOM you already produced (completeness,
  # NTIA minimum elements) — a report-only quality grade, not a scanner that discovers CVEs.
  # renovate: datasource=github-releases depName=interlynk-io/sbomqs
  sbomqs: v2.1.3
  # CycloneDX sbom-utility: schema-validate + query the SBOM (CycloneDX/SPDX). Report-only;
  # validates the SBOM artifact you already produced. The project publishes only a per-asset
  # .md5 (tools-install.sh verifies it). See wiki/supply-chain-tooling-assessment.md.
  # renovate: datasource=github-releases depName=CycloneDX/sbom-utility
  sbom-utility: v0.19.2
  # Kubescape: K8s workload/posture scan against NSA-CISA + MITRE frameworks.
  # Checksum-verified Go static binary (tools-install.sh; a dedicated `kubescape`
  # case). The one K8s hardening axis — Checkov covers the IaC *policy* side.
  # renovate: datasource=github-releases depName=kubescape/kubescape
  kubescape: v4.0.20

# ---------- Python (pip) toolchain ----------
# Pip-installed tools: integrity is via the PINNED VERSION (reproducible wheel +
# PyPI's hash), NOT a release checksum, so these live OUTSIDE the checksum-verified
# `.tools` map above (see Global Constraints). Bump here; the CI jobs read via yq.
tools_pip:
  # GuardDog: proactive typosquat + malware heuristics on DIRECT deps (PyPI + npm).
  # Installed inline in the malware_heuristic_scan job (the pip_audit pattern).
  # renovate: datasource=pypi depName=guarddog
  guarddog: 3.2.0
  # Checkov: IaC misconfiguration scan (Terraform / CloudFormation / K8s / Helm).
  # Pip-installed (the guarddog pattern): integrity is via the PINNED VERSION
  # (reproducible wheel + PyPI's hash), not a release checksum, so it lives here
  # OUTSIDE the checksum-verified .tools map. Installed inline in the iac_scan job.
  # renovate: datasource=pypi depName=checkov
  checkov: 3.2.341

# ---------- DAST ----------
# The OWASP ZAP baseline image, pinned by tag AND digest (newest stable release at least 7 days old:
# 2.17.0, published 2025-12-15, resolved from ghcr.io). The one source: scan-dast.sh, devsec.sh and
# the dast workflow all read it from here. Override at runtime with DAST_ZAP_IMAGE.
dast:
  # Readiness probe the wrapper polls: the backend's liveness route, served without the gateway.
  health_path: /api/v1/healthz
  zap_image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

# ---------- SBOM Generation ----------
sbom:
  format: cyclonedx-json

  enable:
    image: true      # PRIMARY production source of truth
    project: false   # optional/debug only
    root: false      # optional/debug only

# ---------- Project Paths ----------
# Used only if SBOM_ENABLE_PROJECT=true.
# Production default is image-only.
paths:
  projects:
    - src/your_service_name

# ---------- Image Resolution ----------
# Images are resolved from scan.env generated by verify:registry.
#
# The service list below MUST mirror the image ids in .github/container-images.yml,
# whose uppercase id becomes the scan.env key (id `backend` -> BACKEND_IMAGE).
# This service builds the runtime images listed below; to scan more, add the id
# to BOTH .github/container-images.yml (build) and this list (scan) — e.g, adding a
# `worker` image:
#
#   images: (container-images.yml)       services: (here)
#     - id: worker                         - name: worker
#       dockerfile: Dockerfile.worker        env_var: WORKER_IMAGE
#                                            match: worker
#
# Therefore verify:registry exports BACKEND_IMAGE / BACKEND_IMAGE_DOCKER
# (plus the CS_IMAGE/LATEST_IMAGE/MAIN_IMAGE/QA_IMAGE/DEV_IMAGE compat aliases).
#
# `match` is the path segment that identifies the image in image-ref.txt (used as
# a fallback when the *_IMAGE var is empty); keep it in sync with each repo path.
image:
  env_file: scan.env
  # Immutable digests captured by verify:registry (<ID>_IMAGE_DIGEST=sha256:…).
  # When present the scan targets registry:repo@sha256:… — the exact artifact the
  # digest-pinned deploy ships — rather than the mutable tag (see precedence below).
  digest_file: image-digests.env

  # Resolution precedence per service (sbom-generate.sh:resolve_image_target):
  #   digest (<ID>_IMAGE_DIGEST) > daemon (<ID>_IMAGE_DOCKER) > tag (<ID>_IMAGE).
  # scan.env's *_IMAGE stays repo:tag — VEX, attested provenance and the
  # digest-pinned deploy all parse it that way — so the digest/daemon target is
  # assembled inside the scanner and never written back into scan.env.

  services:
    - name: backend
      env_var: BACKEND_IMAGE
      docker_env_var: BACKEND_IMAGE_DOCKER
      match: backend
    - name: frontend
      env_var: FRONTEND_IMAGE
      docker_env_var: FRONTEND_IMAGE_DOCKER
      match: frontend
    - name: waf
      env_var: WAF_IMAGE
      docker_env_var: WAF_IMAGE_DOCKER
      match: waf

# ---------- Vulnerability Policy ----------
policy:
  fail_level: high
  only_fixed: true

# ---------- Grouping ----------
grouping:
  rules:
    - match: ".image.sbom."
      group: "CONTAINER IMAGE"

    - match: ".project.sbom."
      group: "PROJECT"

    - match: "root.sbom."
      group: "APPLICATION ROOT"