fail-on: high
only-fixed: true
add-cpes-if-none: false

ignore:
  # --- Next.js vendored picomatch (no runtime attack surface we control) ---
  # With the lean frontend runtime (Node binary only — see Dockerfile.frontend),
  # npm's own bundled deps (brace-expansion, ip-address, pacote, sigstore, …) are
  # no longer shipped. The one remaining fixable-HIGH is picomatch, vendored by
  # Next.js under .next/…/compiled and bundled into the standalone output. It is
  # not a project dependency and cannot be fixed via package.json — it clears only
  # when Next.js ships a patched vendored copy. Matched by package (not CVE) so the
  # rule survives DB accrual; the until date forces re-evaluation at the next bump.
  - package:
      name: picomatch
    reason: >
      Next.js vendored dependency (.next/…/compiled), bundled into the standalone
      output. Not a project dependency; clears only with a Next.js bump.
    until: 2027-04-30