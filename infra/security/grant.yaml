# Enterprise default: “deny unless allowed” with pragmatic library stance.
format: json
quiet: false
verbose: false

allow:
  # Permissive (standard)
  - MIT
  - MIT-CMU
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Zlib
  - PSF-2.0
  - CC0-1.0

  # Pragmatic: accept MPL-2.0 for libraries
  - MPL-2.0


  # Optional: relaxers for Python non-SPDX license strings
  - "MIT License"
  - "Apache License 2.0"
  - "Apache License, Version 2.0"  
  - "Apache 2.0"
  - "BSD License"
  - "3-Clause BSD License"
  - "ISC License"
  - "Dual License"  

  # Optional: uncomment if Legal accepts
  # - Unlicense

require-license: true          # deny if no license found
require-known-license: false   # accept non-SPDX strings once normalized upstream

# Minimize non-shipping noise (names must match Grant's "name" field)
ignore-packages:
  - caniuse-lite
  - actions/checkout
  - actions/setup-node
  - coverallsapp/github-action
  - ljharb/actions/.github/workflows/node.yml
  - ljharb/actions/.github/workflows/pretest.yml
  - ljharb/actions/.github/workflows/rebase.yml
  - ljharb/require-allow-edits
  - binary:node