# ============================================================================
# Nginx Static Assets Server
#
# Responsibilities:
# - Serve Next.js build-time static assets (/_next/static/*)
# - Serve explicit public assets (logo, favicon, robots.txt, etc.)
# - No reverse proxying
# - No TLS termination (handled by K8s Ingress / cert-manager)
#
# In Kubernetes, the NGINX Ingress Controller handles edge routing.
# In Docker Compose / local dev, each service is accessed directly on its port.
# ============================================================================

# ---------------------------------------------------------------------------
# Process model
# ---------------------------------------------------------------------------

worker_processes  1;
pid               /tmp/nginx.pid;

events {
  worker_connections  1024;
  use                 epoll;
}

# ---------------------------------------------------------------------------
# HTTP configuration
# ---------------------------------------------------------------------------

http {
  # MIME types
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  charset       utf-8;
  # Logging (minimal; static assets usually do not need access logs)
  access_log    off;
  error_log     /tmp/nginx/error.log warn;

  # Performance & correctness
  sendfile          on;
  tcp_nopush        on;
  tcp_nodelay       on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Compression
  gzip on;
  gzip_types application/javascript text/css application/json text/xml application/xml;
  gzip_min_length 256;
  gzip_vary on;

  # Security hardening
  server_tokens off;

  # --- Runtime paths for unprivileged Nginx ---
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  # -------------------------------------------------------------------------
  # Static server
  # -------------------------------------------------------------------------

  server {
    # Bind address: set via NGINX_BIND env var (0.0.0.0 for Docker, 127.0.0.1 for local)
    listen ${NGINX_BIND}:${NGINX_PORT};

    # Baseline security headers on every response. `always` => emitted even for
    # error responses (e.g. the 404 catch-all below). These are INHERITED by the
    # locations that declare no add_header of their own; the two that do
    # (/_next/static/ and the public assets) re-declare the set further down,
    # because nginx drops inherited add_header the moment a level defines any.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'" always;

    # Fail closed by default
    location / {
      return 404;
    }

    # -----------------------------------------------------------------------
    # Next.js immutable build assets
    # -----------------------------------------------------------------------

    location /_next/static/ {
      alias ${FRONTEND_ROOT}/.next/static/;

      # Immutable assets: safe to cache forever
      expires 1y;
      add_header Cache-Control "public, immutable";
      # This location declares add_header, so it does NOT inherit the server-level
      # security headers above — re-declare the full set here.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Content-Security-Policy "default-src 'none'" always;

      # No directory listing
      autoindex off;

      # Reduce log noise
      access_log off;
    }
    # -----------------------------------------------------------------------
    # Explicit public assets (allow-list only)
    # -----------------------------------------------------------------------
    # Each allow-listed asset re-declares the security headers (it has add_header
    # of its own, so it does not inherit the server-level set). Images are hashed
    # and stable => long cache; the text files can change => no-cache.
    location = /logo.png {
      alias ${FRONTEND_ROOT}/public/logo.png;
      add_header Cache-Control "public, max-age=604800";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Content-Security-Policy "default-src 'none'" always;
    }
    location = /favicon.ico {
      alias ${FRONTEND_ROOT}/public/favicon.ico;
      add_header Cache-Control "public, max-age=604800";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Content-Security-Policy "default-src 'none'" always;
    }
    location = /robots.txt {
      alias ${FRONTEND_ROOT}/public/robots.txt;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Content-Security-Policy "default-src 'none'" always;
    }
    location = /sitemap.xml {
      alias ${FRONTEND_ROOT}/public/sitemap.xml;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Content-Security-Policy "default-src 'none'" always;
    }
    location = /health.txt {
      alias ${FRONTEND_ROOT}/public/health.txt;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Content-Security-Policy "default-src 'none'" always;
    }
    # -----------------------------------------------------------------------
    # Health endpoint (for K8s readiness probes / docker-compose healthchecks)
    # -----------------------------------------------------------------------

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
