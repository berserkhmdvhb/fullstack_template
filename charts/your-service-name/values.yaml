# =============================================================================
# values.yaml — single source of truth for the your-service-name chart.
#
# Every environment overrides only what differs, via `values.<env>.yaml`
# (`helm upgrade --install -f charts/your-service-name/values.dev.yaml`).
# The defaults here mirror the Kustomize base (dev-like).
#
# NOTE ON COUPLING: resources.{requests,limits} here, hpa.* maxReplicas, and the
# namespace ResourceQuota (infra/k8s/bootstrap, not this chart; a test computes its worst case and
# fails when the quota is short) must be raised TOGETHER
# for bigger clusters. Two numbers, not one: at the minimum replicas these defaults REQUEST about
# 5Gi of memory and 850m CPU (2 backend and 2 frontend Pods at 1Gi, PostgreSQL 1Gi; the WAF adds
# 512Mi), which a laptop node can hold; the quota's worst case (every HPA at its maximum plus the
# rollout surge) is an upper bound the namespace may grow to, not a reservation. On a laptop use
# values.local.yaml: one replica of each, about 3Gi requested.
# =============================================================================

# Metadata-only label. NEVER enters a selector (selectors are stable identity
# only — see templates/_helpers.tpl), which is what makes env switches idempotent.
environment: dev

# Deploy-time guards. rejectPlaceholders refuses to render while edge.hosts still holds the
# your-domain.example placeholder, or (gateway mode) edge.gateway.parentRefs still names
# your-gateway. Off here so every CI render passes; the deploy script (scripts/ci/deploy-env.sh)
# turns it on, and a hand-run `helm upgrade` should pass --set guards.rejectPlaceholders=true too.
guards:
  rejectPlaceholders: false

global:
  # Optional registry secret, e.g. [registry-credentials]. Empty => no pull secret
  # (correct for local, where images resolve off the node daemon with a bare tag).
  imagePullSecrets: []

namespaces:
  # App namespace is .Release.Namespace; the db namespace is derived:
  #   db namespace = <.Release.Namespace>-<dbSuffix> (e.g. your-service-name-dev-db)
  dbSuffix: db
  # false (the default): the chart assumes both namespaces exist. A cluster admin creates them once,
  # with the restricted Pod Security labels, the ResourceQuota, the LimitRange and the deployer's
  # RBAC: scripts/k8s-bootstrap.sh <env> | kubectl apply -f - (wiki/infrastructure.md). The deployer
  # then needs no cluster-scoped rights. true renders the two Namespace objects from this chart.
  create: false

# The app's Role and RoleBinding (its ServiceAccount reads ConfigMaps; templates/rbac.yaml). false
# (the default): the admin bootstrap renders them from this same template, so the deployer needs no
# RBAC rights. true renders them in the release, with namespaces.create (the single-tenant path).
rbac:
  create: false

serviceAccount:
  name: your-service-name
  automountServiceAccountToken: false

# ---- Images ---------------------------------------------------------------
# registry: "" => bare `repository:tag` (the local overlay trick: kubelet finds
# the node-daemon image with imagePullPolicy: IfNotPresent). Set a registry for
# dev/qa/production (e.g. registry.your-domain.example).
#
# digest: optional immutable pin. When set (production, via CI) the ref renders as
# `repository@sha256:<digest>` instead of `repository:tag` (see chart.image). Keep
# "" for dev/qa/local so those track the mutable tag.
imagePullPolicy: IfNotPresent
images:
  backend:
    repository: your-service-name-backend
    tag: dev
    registry: ""
    digest: ""
  frontend:
    repository: your-service-name-frontend
    tag: dev
    registry: ""
    digest: ""
  # The optional WAF image (Dockerfile.waf: Envoy with the Coraza Wasm), built, scanned and signed
  # with the two app images; used only when waf.enabled.
  waf:
    repository: your-service-name-waf
    tag: dev
    registry: ""
    digest: ""

# Backend-only settings.
backend:
  # Comma-separated Host values added to the backend's ALLOWED_HOSTS (the ingress hosts and the
  # backend Service names are always allowed). Empty by default. A local cluster that reaches the
  # backend through a port-forward sets "localhost,127.0.0.1" (values.local.yaml).
  extraAllowedHosts: ""
  # Init containers rendered FIRST (before wait-for-db) in both the backend Deployment and the
  # migration Job, for any native sidecar of your own. (The Cloud SQL Auth Proxy has its own
  # switch: cloudSqlProxy.) Empty by default.
  extraInitContainers: []
  networkPolicy:
    # Egress rules appended to the backend's NetworkPolicy (a list of NetworkPolicy `egress`
    # items). The policy is default-deny, so traffic to an OTLP collector or a Redis is dropped
    # silently unless a rule allows it. Empty by default. Examples:
    #   extraEgress:
    #     - to:                      # OTLP/HTTP collector (observability.tracing), port 4318
    #         - namespaceSelector:
    #             matchLabels: {kubernetes.io/metadata.name: monitoring}
    #       ports: [{protocol: TCP, port: 4318}]
    #     - to:                      # Redis for RATE_LIMIT_STORAGE (rediss://), port 6379
    #         - ipBlock: {cidr: 10.20.0.0/24}
    #       ports: [{protocol: TCP, port: 6379}]
    extraEgress: []

# ---- Opt-in features (all off by default; nothing renders until enabled) ------------------
observability:
  tracing:
    # OpenTelemetry traces over OTLP/HTTP (backend env TRACING_ENABLED, OTEL_EXPORTER_OTLP_ENDPOINT,
    # TRACING_SAMPLE_RATIO, OTEL_SERVICE_NAME). `endpoint` is required when enabled; allow the
    # egress with backend.networkPolicy.extraEgress (port 4318). The collector's auth headers are a
    # secret: put OTEL_EXPORTER_OTLP_HEADERS ("name=value,...") in the app Secret
    # (secrets.existingSecret), never here.
    enabled: false
    endpoint: ""
    sampleRatio: 1
    serviceName: ""      # empty: the backend default (the package's service name)

# CSP violation reports: one value, two env vars (backend CSP_REPORT_ENABLED serves
# POST /api/v1/csp-report; frontend CSP_REPORTING_ENABLED adds the reporting directives).
cspReporting:
  enabled: false

# TLS to the database. For a managed database whose CA is not in the image's trust store, name an
# existing Secret holding the CA certificate: it is mounted read-only in the backend and the
# migration Job and DB_SSLROOTCERT is set to it. Leave empty for DB_SSLMODE=disable or when the
# system trust store is enough.
database:
  tls:
    caSecret:
      name: ""
      key: ""

replicas:
  backend: 2
  frontend: 2

# Rolling updates of the backend and the frontend: never fewer ready Pods than desired
# (maxUnavailable is 0), up to maxSurge extra Pods, each counted ready only after it has been ready
# for minReadySeconds, and a rollout that makes no progress for progressDeadlineSeconds is failed.
# The readiness probes gate every step. (wiki/infrastructure.md, Workloads)
rollout:
  maxSurge: 25%
  minReadySeconds: 10
  progressDeadlineSeconds: 600

# Graceful shutdown, one source. A Pod's terminationGracePeriodSeconds is derived, never set:
# preStopSeconds + the drain + marginSeconds, where the drain is config.BACKEND_GRACEFUL_TIMEOUT for
# the backend and frontendDrainSeconds for the frontend. preStop is the native sleep action (the
# images have no shell), so the endpoint is removed from the Services before SIGTERM arrives.
# frontendDrainSeconds: Next.js stops accepting on SIGTERM, waits for open connections (Node closes
# idle keep-alive connections as soon as server.close() runs) and exits; it has no drain timeout of
# its own, so this bounds a slow request before SIGKILL. GA in Kubernetes 1.34, the chart's
# kubeVersion floor.
shutdown:
  preStopSeconds: 5
  frontendDrainSeconds: 15
  marginSeconds: 10

# Per-container resources, the standard {requests, limits} shape. Every container has a CPU request
# and a memory limit equal to its memory request: limits.memory is rendered from the request when
# unset, and a different value fails the render. There is no CPU limit (CPU limits throttle): set
# limits.cpu (for example "1") to add one; ephemeral-storage and hugepages-* limits pass through.
# The namespace LimitRange and ResourceQuota (infra/k8s/bootstrap) must hold the sum, with the HPA
# maxReplicas plus the rollout surge. The backend and frontend memory (1Gi) is the old limit, and
# the in-memory /tmp counts against it: tune it down with load data.
resources:
  backend:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {}
  frontend:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {}
  # The migration Job: its wait-for-db init container and the migrate container.
  waitForDb:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {}
  migration:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {}
  # The in-cluster PostgreSQL (the database namespace has no LimitRange or quota).
  postgresql:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {}
  # The backup and the backup-verify CronJobs.
  pgBackup:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {}
  # The helm test Jobs (templates/tests, tests.enabled).
  tests:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {}

# ---- Config (non-secret) -> ConfigMap ------------------------------------
# DB_HOST is intentionally absent: it is computed in the template from the db
# namespace (templates/_helpers.tpl -> chart.dbHost) so it tracks the release.
config:
  ENV: dev
  DEBUG: "false"
  LOG_LEVEL: INFO
  API_VERSION: "v1"
  BACKEND_ENTRY: your_service_name.backend.main:app
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  # The Prometheus metrics server's own port (the launcher starts it; the API port serves no
  # /metrics). It is the backend Pod's `metrics` container port and the Service's `metrics` port,
  # and the one port the scrape NetworkPolicy opens. Keep it clear of every other container port
  # in the Pod (the API port, the Cloud SQL proxy's cloudSqlProxy.healthPort).
  METRICS_PORT: "9102"
  # Served by Uvicorn (one process per pod); Kubernetes scales PODS (HPA), not
  # processes. BACKEND_GRACEFUL_TIMEOUT is how long Uvicorn drains in-flight
  # requests + lifespan shutdown after SIGTERM before force-exiting.
  BACKEND_GRACEFUL_TIMEOUT: "30"
  # The largest request body the backend accepts (bytes; more is a 413). This one value sets the
  # backend (through this ConfigMap) and the WAF's limits (Coraza's and Envoy's buffer). The
  # backend's built-in default (settings.py, used outside the chart) is kept equal by a test.
  MAX_REQUEST_BODY_BYTES: "10485760"
  FRONTEND_IMPL: react
  FRONTEND_HOST: "0.0.0.0"
  FRONTEND_PORT: "3000"
  FRONTEND_ROOT: /app/frontend
  FRONTEND_REACT_SERVER: /app/frontend/.next/standalone/server.js
  DB_PORT: "5432"
  DB_NAME: service_template
  # Logs go to stdout only. The request line (method, path, status, duration, client IP) holds no
  # query string, header, cookie or body, so it is on here; the app default stays off locally.
  LOG_REQUESTS: "true"
  RATE_LIMIT_DEFAULT: 100/minute
  # RATE_LIMIT_STORAGE is deliberately not a config value: a Redis URL can hold a password, so it
  # comes from the app Secret (secrets.existingSecret holds a RATE_LIMIT_STORAGE key, read through
  # the backend's envFrom). Unset means memory:// (a counter per replica). Putting it here is
  # refused. Allow the Redis egress with backend.networkPolicy.extraEgress (port 6379).
  # Client IP: set TRUSTED_PROXY_CIDRS to the cloudflared and gateway Pod ranges of YOUR cluster
  # (comma-separated CIDRs; Pod CIDRs are cluster-specific, so none is guessed here). Empty trusts
  # no forwarding header and the TCP peer is the client, so behind a proxy every client then shares
  # one rate-limit bucket. Set TRUST_CF_CONNECTING_IP "true" only in the Cloudflare Tunnel edge
  # mode, and only when cloudflared is the only way in (Cloudflare sends the header on traffic
  # from its edge); elsewhere a client could forge it.
  TRUSTED_PROXY_CIDRS: ""
  TRUST_CF_CONNECTING_IP: "false"
  # Gateway auth: AUTH_PROXY_CIDRS lists the proxy that authenticates and injects the identity
  # headers (AUTH_USER_ID_HEADER, AUTH_ROLES_HEADER); the backend believes them only from a direct
  # TCP peer in this list, and empty trusts nobody (every request a 401; production with
  # AUTH_MODE=gateway refuses to start). It is NOT TRUSTED_PROXY_CIDRS (the client-IP hops).
  # Set the authenticating proxy's Pod range, in every edge mode. That proxy MUST remove or
  # overwrite any client-sent copy of these headers on every route it forwards (a header sent twice
  # is a 401). Never list a hop that does not both authenticate and strip client copies: not the
  # edge (Gateway, ingress controller, cloudflared), the WAF or the frontend. API traffic must reach
  # the backend through that proxy, or same-origin /api/v1 calls get a 401 (wiki/security.md).
  # Admit the proxy to the backend with networkPolicy.backendExtraIngressPeers.
  # The frontend reads the same ConfigMap and drops these headers (and any x-authenticated-*)
  # from browser requests.
  AUTH_PROXY_CIDRS: ""

# ---- Secret (app) -> DB_USER / DB_PASSWORD / STATS_PASS -------------------
# Dev/local defaults only. Production leaves these empty and supplies them via
# sealed-secrets / External Secrets Operator / SOPS (see templates/secret.yaml).
#
# NO PASSWORDS ARE COMMITTED BELOW. DB_PASSWORD / STATS_PASS (and, for the
# internal DB, the matching Postgres password) are supplied out-of-band:
#   * local/manual: copy charts/your-service-name/values.secret.yaml.example to
#     values.secret.yaml (gitignored) and pass it with an extra -f; or
#   * CI: inject them as masked/protected variables into a generated values file.
#
# secrets.existingSecret: name of an EXTERNALLY-managed Opaque secret holding the
# same keys (DB_USER / DB_PASSWORD / STATS_PASS). When set, the chart does NOT
# create its own secret and the backend/migration reference this one instead —
# so production can deploy without committing credentials. Empty => the chart
# creates chart.fullname-secret from the values here (dev/local only).
#
# SINGLE SOURCE OF TRUTH: the internal Postgres password is sourced from
# secrets.dbPassword too (templates/db-secret.yaml), so the app and the database
# always share ONE value to keep in sync — not two.
#
# EXACTLY ONE source holds the app Secret; two at once fail the render:
#   1. the chart's own Secret, from dbPassword / statsPass here (dev/local);
#   2. existingSecret, a Secret you manage (sealed-secrets, SOPS, a hand-made one);
#   3. externalSecret.enabled, an External Secrets Operator ExternalSecret that syncs the keys
#      from the platform's secret store (for example GCP Secret Manager, wiki/security.md). The
#      store itself (a ClusterSecretStore and its Workload Identity) is the platform's: the chart
#      ships none.
secrets:
  existingSecret: ""
  dbUser: app            # username (not secret) — safe to keep
  dbPassword: ""         # <-- supply out-of-band (see note above)
  statsPass: ""          # <-- supply out-of-band (see note above)
  externalSecret:
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      # A placeholder: guards.rejectPlaceholders refuses it.
      name: your-secret-store      # the platform's store
      kind: ClusterSecretStore     # or SecretStore
    # Secret key -> remote key in the store. The names are placeholders: set yours. Add a key
    # (for example RATE_LIMIT_STORAGE) to sync it too.
    remoteKeys:
      DB_USER: your-service-name-db-user
      DB_PASSWORD: your-service-name-db-password
      STATS_PASS: your-service-name-stats-pass

# Cloud SQL Auth Proxy as a native sidecar (an init container with restartPolicy: Always,
# Kubernetes 1.29+) in the backend Deployment and the migration Job, which completes when the
# migrate container exits. Off by default. On, DB_HOST is 127.0.0.1 and the proxy listens on
# config.DB_PORT; set config.DB_SSLMODE to disable (the proxy encrypts) and leave postgresql.enabled
# false. The pod's service account needs Cloud SQL Client (Workload Identity; wiki/database.md).
# The Private Service Connect path needs no proxy: see wiki/database.md.
cloudSqlProxy:
  enabled: false
  # project:region:instance; the placeholder renders, and guards.rejectPlaceholders refuses it.
  instanceConnectionName: your-project:your-region:your-instance
  # Third-party image, pinned by tag and multi-arch index digest (Renovate refreshes both).
  image:
    repository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
    tag: 2.28.0
    digest: "sha256:e0cbea7b63455c1635d354ef456696d019dd02a5db47bf1994e849823e71ae89"
  privateIp: false               # --private-ip: connect to the instance's private address
  # --auto-iam-authn: IAM database authentication. The proxy supplies the token as the password, so
  # DB_PASSWORD may be absent from the app Secret (the Job reads it as an optional key).
  autoIamAuthn: false
  runAsUser: 65532               # the image's non-root user
  # Where the proxy may connect (NetworkPolicy is IP-based): required when enabled. The proxy
  # reaches the instance on 3307 and Google APIs on 443; for example the Private Google Access
  # range 199.36.153.8/30 (private.googleapis.com) and the instance's private address range.
  egressCIDRs: []
  # The proxy's own startup endpoint (--health-check, --http-port): the kubelet starts the main
  # container only after the sidecar answers it.
  healthPort: 9090
  # The proxy gets its Workload Identity token from the GKE metadata server, which the default-deny
  # egress also blocks. Both GKE forms are allowed here: 169.254.169.252 on 987 and 988 (GKE
  # 1.21 and later, the standard dataplane) and 169.254.169.254 on 80 (GKE Dataplane V2).
  # Trim the list to your dataplane. A list of {cidr, ports}; an empty list renders no rule.
  metadataEgress:
    - {cidr: 169.254.169.252/32, ports: [987, 988]}
    - {cidr: 169.254.169.254/32, ports: [80]}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {}

# ---- Edge -----------------------------------------------------------------
# How traffic reaches the two Services. ONE routes list drives every mode, so a path is
# written once: the root host serves every route, the api host the `backend` routes, the
# app host the `frontend` routes.
#   gateway : Gateway API HTTPRoutes (the default) attached to a Gateway you run.
#   ingress : a controller-agnostic networking.k8s.io/v1 Ingress (no class or annotations by
#             default).
#   tunnel  : no edge object; the platform's tunnel (for example Cloudflare Tunnel) carries the
#             traffic and NOTES.txt prints the route table to configure it from.
# `backend` resolves to the API Service (the WAF Service when waf.enabled), `frontend` to the UI
# Service.
edge:
  mode: gateway
  hosts:
    api: api.your-domain.example
    app: app.your-domain.example
    root: your-service-name.your-domain.example
  routes:
    - {path: /api, match: PathPrefix, service: backend}
    - {path: /docs, match: PathPrefix, service: backend}
    - {path: /openapi.json, match: Exact, service: backend}
    - {path: /, match: PathPrefix, service: frontend}
  # Who may reach the app Pods, per mode (templates/network-policy.yaml). The peers reach the
  # frontend on its port, and the backend on its port (or, with waf.enabled, only the WAF).
  #   gateway : each edge.gateway.parentRefs namespace (in-cluster Gateway Pods), plus the Google
  #             load balancer ranges when edge.gateway.gke.enabled.
  #   tunnel  : the namespace this selects (matchLabels); empty means
  #             {kubernetes.io/metadata.name: cloudflared}.
  #   ingress : the namespace this selects, REQUIRED (the chart does not guess your controller's
  #             namespace; the render fails without it).
  namespaceSelector: {}
  # NetworkPolicy peers added in every mode, for example a regional load balancer's proxy-only
  # subnet: [{ipBlock: {cidr: 10.129.0.0/23}}]. Empty by default.
  extraPeers: []
  gateway:
    # The Gateway(s) the HTTPRoutes attach to. The placeholder renders; replace it before a deploy.
    # A parentRef without a namespace means the release namespace.
    parentRefs:
      - {name: your-gateway, namespace: gateway-system}
    # Optional, rendered on every rule when set, for example {request: 120s, backendRequest: 100s}
    # (backendRequest must not exceed request).
    timeouts: {}
    # GKE Gateway provider policies (networking.gke.io/v1), off by default. When enabled they
    # render for the backend Service (the WAF Service when waf.enabled) and the frontend Service:
    # a HealthCheckPolicy on each readiness path (GKE does not read readiness probes and checks
    # `/` otherwise), and a GCPBackendPolicy with the timeout, the load balancer access log and an
    # optional Cloud Armor policy. Enabling it also admits the Google load balancer ranges in the
    # NetworkPolicy. Cloud CDN is not rendered: put the CDN in front (wiki/infrastructure.md).
    gke:
      enabled: false
      timeoutSec: 120         # backend service timeout (the former edge proxy's 120 s)
      logging:
        sampleRate: 1000000   # 0..1000000; 1000000 logs every request
      securityPolicy: ""      # a Cloud Armor policy name (WAF and rate-based rules); "" => none
  ingress:
    className: ""           # "" => no ingressClassName, so the cluster's default class applies
    annotations: {}         # controller-specific annotations; none by default
    tlsSecretName: ""       # set to add a tls block (one secret for all three hosts)
  tunnel: {}

# ---- NetworkPolicy -------------------------------------------------------------
# The app namespace is default-deny; templates/network-policy.yaml allows each flow on both ends.
networkPolicy:
  # DNS egress goes to kube-dns only (every egress policy uses it). An empty selector means the
  # default, and a set one replaces it. Defaults: namespaceSelector
  # {kubernetes.io/metadata.name: kube-system}, podSelector {k8s-app: kube-dns}. ipBlocks adds
  # resolver IPs, for example NodeLocal DNSCache: [169.254.20.10/32].
  dns:
    namespaceSelector: {}
    podSelector: {}
    ipBlocks: []
  # Who may scrape the backend's metrics: Pods matching monitoringPodSelector in the namespace
  # matching monitoringNamespaceSelector, on config.METRICS_PORT only (never the API port). The
  # rule renders only when the chart renders a scrape target (monitoring.scrapeAnnotations or
  # monitoring.serviceMonitor). Empty means the default of monitoring.flavour, a set one replaces
  # it (set both):
  #   prometheus-operator: {kubernetes.io/metadata.name: monitoring} and
  #                        {app.kubernetes.io/name: prometheus}
  #   gmp:                 {kubernetes.io/metadata.name: gmp-system} and
  #                        {app.kubernetes.io/name: collector}
  # On GKE Autopilot the managed collector's namespace is gke-gmp-system. If the collector reaches
  # the Pod from a node address (host networking: Google's docs do not say), the selectors never
  # match it: add the node range in monitoringExtraPeers.
  # monitoringNamespaceSelector: null drops the collector peer (monitoringExtraPeers remain).
  monitoringNamespaceSelector: {}
  monitoringPodSelector: {}
  # Extra peers (a list of `from` entries: ipBlock, podSelector, namespaceSelector) admitted to the
  # metrics port ONLY, next to the collector peer: a node range, or another collector source. They
  # never reach the API port. Same condition as the collector rule (a scrape target). Empty: none.
  monitoringExtraPeers: []
  # Extra NetworkPolicy peers (a list of `from` entries: podSelector, namespaceSelector, ipBlock)
  # admitted to the backend Pods on the backend port, with the WAF on or off. For the auth proxy in
  # AUTH_MODE=gateway: list it here AND in config.AUTH_PROXY_CIDRS. Empty adds no rule. Every peer
  # listed can reach the backend around the WAF, so list only what must.
  backendExtraIngressPeers: []
  # Egress rules appended to the migration Job's policy (a list of NetworkPolicy `egress` items),
  # like backend.networkPolicy.extraEgress for the backend. Empty by default.
  migrationExtraEgress: []

# ---- Web Application Firewall (WAF) --------------------------------------
# In-cluster Coraza WAF (Go, CNCF) running as an Envoy wasm plugin with the OWASP
# Core Rule Set — a reverse proxy that fronts the API surface (/api, /docs,
# /openapi.json), see templates/waf-proxy.yaml. OFF BY DEFAULT: waf.enabled=false
# renders nothing extra and the edge routes straight to the backend, so there
# is no side effect until you turn it on. Enable on QA/production to filter
# SQLi/XSS/etc. at the edge. The UI/static tiers bypass it (not SQLi targets).
#
# The image is images.waf (Dockerfile.waf): the distroless Envoy image and the Coraza Wasm, both
# pinned, built and signed by this repository's release like the app images, and deployed by
# digest. Envoy loads the module from a file in the image, so the WAF fetches nothing at runtime.
waf:
  enabled: false
  provider: coraza          # coraza — the only supported in-cluster engine today
  # Coraza runs its recommended configuration, enforcing, and inspects request bodies up to
  # config.MAX_REQUEST_BODY_BYTES (the backend's own limit); responses are not inspected.
  owaspCrs: true            # load the OWASP CRS rule set embedded in the wasm
  service:
    port: 8080
  # A dedicated listener that answers `path` with a 200 and nothing else; the startup, readiness and
  # liveness probes ask it. The NetworkPolicy admits no other Pod to it (kubelet probes are exempt).
  # Envoy's admin interface is disabled.
  health:
    port: 8090
    path: /healthz
  # Where the WAF forwards. Empty host: the backend Service; empty port: the backend port. Point it
  # at an auth proxy to run WAF -> auth proxy -> backend; then list that proxy in upstreamPeers (the
  # WAF egress allows those peers on the upstream port instead of the backend Pods; a host without
  # peers fails the render), and admit the proxy to the backend with
  # networkPolicy.backendExtraIngressPeers.
  upstream:
    host: ""
    port: ""
  upstreamPeers: []
  # Slow requests are cut off with a 408. requestHeadersSeconds bounds the headers (10 s: a real
  # client sends them in one packet); requestSeconds bounds the whole request, body included (120 s,
  # which must be at least edge.gateway.gke.timeoutSec when that policy is on; the render checks).
  timeouts:
    requestHeadersSeconds: 10
    requestSeconds: 120
  # Coraza directives appended after CRS: rule exclusions for your API (empty by default). Binary
  # uploads on one path (CRS refuses application/octet-stream, rule 920420, and would parse the
  # body as form fields), the pair wiki/containerization.md (Dockerfile.waf) explains:
  #   extraDirectives:
  #     - SecRuleRemoveById 920420
  #     - SecRule REQUEST_METHOD "@streq POST" "id:10001,phase:1,pass,nolog,chain"
  #     - SecRule REQUEST_FILENAME "@streq /api/v1/uploads" "ctl:requestBodyAccess=Off"
  extraDirectives: []
  # Seconds Envoy keeps an idle upstream connection to the backend before closing it. It MUST stay
  # below the backend's keep-alive (BACKEND_KEEPALIVE_TIMEOUT, 75 s in the launcher,
  # backend/serve.py), or Envoy can reuse a connection Uvicorn just closed and return a 502.
  # Envoy's own default is one hour, which is why it is set explicitly. A test compares the two.
  # The same rule holds for any proxy in front of the backend: an ingress controller's upstream
  # keep-alive (ingress-nginx's `upstream-keepalive-timeout`, default 60 s) must stay below the
  # backend keep-alive too; raising it past that causes intermittent 502s.
  upstreamIdleTimeoutSeconds: 60
  # Envoy's worker threads (1 to 16). Each runs its own Wasm VM with the Coraza rules loaded, so
  # memory grows with it; Envoy's own default (one per CPU of the node, whatever the Pod's CPU
  # request) was OOM-killed at startup under the 512Mi limit on a 24-CPU node. The render refuses
  # more workers than waf.resources.requests.cpu in cores, rounded up (at least 2): raise the CPU
  # and memory requests with it, or scale the WAF with replicas.
  concurrency: 2
  # The memory limit equals the request; Envoy's heap is bounded at 80% of it (overload manager).
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {}

# ---- Autoscaling ----------------------------------------------------------
# backend maxReplicas:6 is coupled to the namespace ResourceQuota (infra/k8s/bootstrap).
hpa:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70
    targetMemory: 80
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 70
    targetMemory: 80

# ---- Pod Disruption Budgets ----------------------------------------------
pdb:
  backend:
    minAvailable: 1
  frontend:
    minAvailable: 1

# ---- Database tier --------------------------------------------------------
# Internal PostgreSQL for local/dev/qa. Production sets enabled=false and uses a
# managed DB via externalDatabase below.
postgresql:
  enabled: true
  # Third-party images, pinned by tag and multi-arch index digest (Renovate refreshes both).
  # The server image (StatefulSet).
  image:
    repository: postgres
    tag: 16-alpine
    digest: "sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d"
  # The Secret (in the database namespace) holding the server's password, and its key. Required
  # when the app Secret comes from secrets.existingSecret or the ExternalSecret, because
  # secrets.dbPassword is empty then; when set it feeds the StatefulSet and the backup jobs in
  # every mode, and the chart then renders no password of its own. Empty: secrets.dbPassword
  # feeds them (dev and local).
  existingSecret: ""
  existingSecretKey: password
  # clientImage is the slim psql/pg_dump client used by the migration's
  # wait-for-db init container and the backup/verify CronJobs — parameterized so
  # the app images are not the only ones pinned (C-L7).
  clientImage:
    repository: postgres
    tag: 16-alpine
    digest: "sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d"
  # className "" leaves storageClassName out, so the cluster's default class is used (for a
  # cluster with no class named standard). Immutable on an existing PVC.
  storage:
    className: standard
    size: 10Gi
  # Credentials the StatefulSet initializes the DB with. POSTGRES_USER /
  # POSTGRES_DB are config here; the password is NOT set here — it is sourced from
  # secrets.dbPassword (the app's DB_PASSWORD) so the app and DB always match.
  # Supply secrets.dbPassword out-of-band (see the secrets block above).
  auth:
    user: app
    database: service_template
  # The backup PVC binds at install on any binding mode: the PostgreSQL Pod mounts it read-only,
  # and the backup and verify jobs run on its node (a required podAffinity; the volume is
  # ReadWriteOnce). wiki/database.md, Database Backup CronJob.
  backup:
    enabled: true
    schedule: "0 2 * * *"        # daily 02:00 UTC
    retentionDays: 30
    storage:
      className: standard
      size: 50Gi

# External managed DB (production). Used only when postgresql.enabled=false.
externalDatabase:
  enabled: false
  host: "your-service-name-db.xxxxx.eu-west-1.rds.amazonaws.com"
  name: service_template
  user: app
  # Leave empty in prod and point at a sealed-secrets / ESO / SOPS secret.
  passwordSecret: ""
  # Egress allow for the managed DB. Kubernetes NetworkPolicy is IP-based (FQDN
  # egress needs Cilium or a service mesh), so list the managed DB's subnet here.
  # The backend + migration :5432 egress allow renders only when this is non-empty
  # AND the in-cluster Postgres is disabled; empty => default-deny egress stands.
  egressCIDR: ""
  # Whether the chart renders the placeholder external-DB connection Secret
  # (chart.fullname-db-credentials). Default false: nothing consumes it, and it
  # would occupy the name / ship a placeholder password you supply via
  # sealed-secrets / ESO / SOPS instead. Set true only to emit the non-secret
  # host/port/username/database stub.
  manageSecret: false

# ---- Observability (pluggable; off by default) ---------------------------
# Prometheus Operator CRDs are required for serviceMonitor / prometheusRule.
# The chart ships no log collector: logs go to stdout and the platform collects them.
monitoring:
  # prometheus-operator: a ServiceMonitor and a PrometheusRule (the Prometheus Operator CRDs).
  # gmp: a PodMonitoring and a Rules object (Google Managed Prometheus). `serviceMonitor` and
  # `prometheusRule` switch on the monitor and the rules of the chosen flavour; the rule groups are
  # the same for both. The flavour also sets the default scrape peers (networkPolicy).
  flavour: prometheus-operator
  # Google Managed Prometheus only. A namespaced Rules object evaluates only series from its own
  # namespace, so `Rules` holds the backend's own alerts and the kube-state-metrics and cAdvisor
  # alerts go in a cluster-scoped ClusterRules, which the deployer cannot apply. Like rbac.create,
  # this is off for the deploy: the admin bootstrap renders it (scripts/k8s-bootstrap.sh, with
  # gmpClusterRules: true in its values) and applies it once.
  gmp:
    clusterRules:
      enabled: false
    # The label that holds the OBJECT's namespace on kube-state-metrics series (the `namespace`
    # label is the scraped Pod's own namespace there). A third-party report says GMP relabels it to
    # exported_namespace: verify that against your GMP (query kube_pod_status_phase and read its
    # labels) and set this if it differs. The prometheus-operator flavour always uses `namespace`.
    objectNamespaceLabel: exported_namespace
  # The prometheus.io/scrape annotations on the backend Service (annotation-based discovery).
  scrapeAnnotations: true
  serviceMonitor: false
  prometheusRule: false
  # Must match the Prometheus Operator install's release label for the
  # ServiceMonitor/PrometheusRule to be discovered.
  prometheusRelease: prometheus

# ---- helm test --------------------------------------------------------------
# `helm test <release>` (templates/tests/release-test.yaml): Jobs that run the backend image's
# Python inside the namespace. They check the backend's readiness, apiPath and the frontend for a
# 200 (with the WAF on, a benign request through it for a 200 and an XSS probe for a 403) and that
# the backend's metrics port refuses them; when the scrape peers
# (networkPolicy.monitoringNamespaceSelector and monitoringPodSelector) select this namespace, a
# second Job with the peer's labels must reach it. Hook NetworkPolicies open the default-deny to
# the test Pods while the test runs. The refusal check needs a CNI that enforces NetworkPolicy.
# Off by default, so no release carries the test objects; values.local.yaml and the kind job
# (scripts/kind-deploy.sh) turn it on.
tests:
  enabled: false
  # A GET route of the API that reads the database (the template's sample route by default).
  apiPath: /api/v1/items
