# Development cluster. Images pulled from the private registry.
environment: dev

# Always re-pull in-cluster (images carry immutable per-commit tags in CI); only
# `local` keeps IfNotPresent so the node-daemon image resolves off a bare tag.
imagePullPolicy: Always

images:
  backend: {repository: your-service-name-backend, tag: dev, registry: registry.your-domain.example}
  frontend: {repository: your-service-name-frontend, tag: dev, registry: registry.your-domain.example}

# Kustomize dev overlay ran a single replica; mirror that here and drop the HPA
# min to 1 so it can't scale back up (replica drift seen in an end-to-end run). qa/production stay at 2.
replicas:
  backend: 1
  frontend: 1

hpa:
  backend: {minReplicas: 1}
  frontend: {minReplicas: 1}

# Dev runs ONE replica (HPA minReplicas:1). A PDB of minAvailable:1 would block
# EVERY voluntary disruption — a node drain could never evict the sole pod. 0
# lets the drain proceed while the HPA reschedules (C-L10).
pdb:
  backend: {minAvailable: 0}
  frontend: {minAvailable: 0}

config:
  ENV: development
  DEBUG: "true"
  LOG_LEVEL: DEBUG
  # Same-origin, versioned: the browser calls /api/v1 and the Next.js server
  # proxies it to BACKEND_URL (set in the ConfigMap). Relative => one bundle
  # for every environment; no build-time API URL to inject per env.
  NEXT_PUBLIC_API_URL: "/api/v1"

edge:
  hosts:
    api: dev-api.your-domain.example
    app: dev-app.your-domain.example
    root: dev.your-domain.example
  ingress:
    tlsSecretName: your-service-name-dev-tls

postgresql:
  enabled: true
