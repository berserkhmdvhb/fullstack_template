apiVersion: v2
name: your-service-name
description: >-
  Helm chart for the your-service-name stack (FastAPI backend + Next.js
  frontend) with a gated in-cluster PostgreSQL tier (external DB
  for production). Per-environment, per-tier namespaces.
type: application
version: 0.1.0
appVersion: "1.0.0"
# The floor is set by two features: the preStop sleep action (lifecycle.preStop.sleep, beta and
# on by default from Kubernetes 1.30, GA in 1.34) and native sidecars (restartPolicy: Always on an
# init container, beta and on by default from 1.29, GA in 1.33). An install on an older cluster
# fails with a clear message instead of a cryptic one.
kubeVersion: ">=1.30.0-0"
keywords:
  - fastapi
  - nextjs
  - postgresql
home: https://your-domain.example
sources:
  - https://your-domain.example/your-service-name
maintainers:
  - name: YourOrg
    email: you@your-domain.example
