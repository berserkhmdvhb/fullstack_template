{{/*
   Weekly backup-integrity verification CronJob. Gated by postgresql.enabled.
   Runs files/pg-backup-verify.sh (from the ConfigMap in pg-backup-verify-configmap.yaml): restores
   the newest dump into a temporary database, checks it and drops it; wiki/disaster-recovery.md.

   CREATEDB perms (cross-cutting finding): this runs CREATE DATABASE as the app DB
   user. That user is POSTGRES_USER of the in-cluster StatefulSet, and the official
   postgres image runs `initdb --username="$POSTGRES_USER"` — i.e. the app user IS
   the cluster superuser, so it has CREATEDB unconditionally. This CronJob only
   renders for the in-cluster DB (postgresql.enabled), never the external prod DB,
   so the scratch-DB restore always has permission.
*/}}
{{- if and .Values.postgresql.enabled .Values.postgresql.backup.enabled }}
{{- /* The age after which the script treats one of its temporary databases as left over by a killed
       run (VERIFY_STALE_AFTER_SECONDS): longer than any run lasts, so the deadline and the grace
       period together must stay below it. */}}
{{- $staleAfter := 86400 }}
{{- /* The Pod's terminationGracePeriodSeconds: the time the script has, after a deadline's SIGTERM, to
       drop its temporary database (DROP DATABASE ... WITH (FORCE) ends the restore's session, then
       checkpoints and removes the files). Fixed, and four times the default 30 s. */}}
{{- $grace := 120 }}
{{- $deadline := int .Values.postgresql.backup.verifyDeadlineSeconds }}
{{- if ge (add $deadline $grace) $staleAfter }}
{{- fail (printf "%s: postgresql.backup.verifyDeadlineSeconds (%d) plus the %d s termination grace period must be below %d, the age after which the restore check drops a temporary database as left over: a longer run could lose its database to the next one." (include "chart.fullname" .) $deadline $grace $staleAfter) }}
{{- end }}
{{- /* A CronJob name may be at most 52 characters: the controller adds 11 for each Job it creates, and a
       Job name is limited to 63. */}}
{{- $cronName := printf "%s-pg-backup-verify" (include "chart.fullname" .) }}
{{- if gt (len $cronName) 52 }}
{{- fail (printf "the restore-check CronJob name %q is %d characters, over the 52 a CronJob name may have (the controller adds 11 to name each Job): shorten the release name or set fullnameOverride so that the chart's fullname is at most 35 characters." $cronName (len $cronName)) }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $cronName }}
  namespace: {{ include "chart.dbNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-verification
spec:
  schedule: {{ .Values.postgresql.backup.verifySchedule | quote }}
  # Two runs at once would collide on the temporary database's name.
  concurrencyPolicy: Forbid
  # revisionHistoryLimit is alpha (CronJobExecutionHistory feature gate) and absent
  # from clusters without it — use the GA split fields so SSA never rejects the object.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A hung restore ends at the deadline and fails the Job, so BackupVerifyFailed fires and
      # Forbid does not block the next run. The Pod gets SIGTERM: the script stops waiting for the
      # restore and drops its database within terminationGracePeriodSeconds. Only a SIGKILL before
      # that drop finishes leaves the database, for a later run's stale cleanup.
      activeDeadlineSeconds: {{ $deadline }}
      # One retry, for a passing fault such as a database restart; a wrong dump fails the same way
      # every time, and six retries would only repeat the failure.
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          # What the database's NetworkPolicy admits (db-network-policy.yaml).
          labels:
{{- include "chart.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup-verification
        spec:
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: {{ $grace }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            # The backup volume's group, the same in every Pod that mounts it (chart.pgFsGroup).
            fsGroup: {{ include "chart.pgFsGroup" . }}
            fsGroupChangePolicy: OnRootMismatch
            # RuntimeDefault seccomp is the one restricted-PSS control this pod was
            # still missing (container caps are already dropped below); without it
            # the pod is rejected on an enforcing cluster.
            seccompProfile:
              type: RuntimeDefault
          {{- include "chart.backupAffinity" . | nindent 10 }}
          containers:
            - name: pg-backup-verify
              image: {{ include "chart.image" (dict "image" .Values.postgresql.clientImage) }}
              # The script (files/pg-backup-verify.sh) comes from the ConfigMap, read-only.
              command: [/bin/sh, /scripts/pg-backup-verify.sh]
              env:
                - name: VERIFY_STALE_AFTER_SECONDS
                  value: {{ $staleAfter | quote }}
                - name: VERIFY_TABLES
                  value: {{ join "," .Values.postgresql.backup.verifyTables | quote }}
                - name: VERIFY_MAX_AGE_HOURS
                  value: {{ .Values.postgresql.backup.verifyMaxAgeHours | default .Values.monitoring.alerts.backupMaxAgeHours | quote }}
                - name: DB_HOST
                  value: {{ include "chart.fullname" . }}-postgresql
                - name: DB_PORT
                  value: {{ include "chart.dbPort" . | quote }}
                - name: PGPORT
                  value: {{ include "chart.dbPort" . | quote }}
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "chart.fullname" . }}-db-credentials
                      key: username
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "chart.fullname" . }}-db-credentials
                      key: database
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      {{- include "chart.pgPasswordRef" . | nindent 22 }}
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
                - name: verify-script
                  mountPath: /scripts
                  readOnly: true
              resources:
{{- include "chart.resources" .Values.resources.pgBackup | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: {{ include "chart.fullname" . }}-pg-backup-pvc
            - name: verify-script
              configMap:
                name: {{ include "chart.fullname" . }}-pg-backup-verify
                defaultMode: 0555
{{- end }}
