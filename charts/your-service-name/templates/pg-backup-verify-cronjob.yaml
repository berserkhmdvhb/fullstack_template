{{/*
   Weekly backup-integrity verification CronJob. Gated by postgresql.enabled.
   Runs files/pg-backup-verify.sh (from the ConfigMap in pg-backup-verify-configmap.yaml): restores
   the newest dump into a temporary database, checks it and drops it; wiki/disaster-recovery.md.

   CREATEDB perms (cross-cutting finding): this runs CREATE DATABASE as the app DB
   user. That user is POSTGRES_USER of the in-cluster StatefulSet, and the official
   postgres image runs `initdb --username="$POSTGRES_USER"` — i.e. the app user IS
   the cluster superuser, so it has CREATEDB unconditionally. This CronJob only
   renders for the in-cluster DB (postgresql.enabled), never the external prod DB,
   so the scratch-DB restore always has permission.
*/}}
{{- if and .Values.postgresql.enabled .Values.postgresql.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "chart.fullname" . }}-pg-backup-verify
  namespace: {{ include "chart.dbNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-verification
spec:
  schedule: {{ .Values.postgresql.backup.verifySchedule | quote }}
  # revisionHistoryLimit is alpha (CronJobExecutionHistory feature gate) and absent
  # from clusters without it — use the GA split fields so SSA never rejects the object.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          # What the database's NetworkPolicy admits (db-network-policy.yaml).
          labels:
{{- include "chart.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup-verification
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            # The backup volume's group, the same in every Pod that mounts it (chart.pgFsGroup).
            fsGroup: {{ include "chart.pgFsGroup" . }}
            fsGroupChangePolicy: OnRootMismatch
            # RuntimeDefault seccomp is the one restricted-PSS control this pod was
            # still missing (container caps are already dropped below); without it
            # the pod is rejected on an enforcing cluster.
            seccompProfile:
              type: RuntimeDefault
          {{- include "chart.backupAffinity" . | nindent 10 }}
          containers:
            - name: pg-backup-verify
              image: {{ include "chart.image" (dict "image" .Values.postgresql.clientImage) }}
              # The script (files/pg-backup-verify.sh) comes from the ConfigMap, read-only.
              command: [/bin/sh, /scripts/pg-backup-verify.sh]
              env:
                - name: VERIFY_TABLES
                  value: {{ join "," .Values.postgresql.backup.verifyTables | quote }}
                - name: VERIFY_MAX_AGE_HOURS
                  value: {{ .Values.postgresql.backup.verifyMaxAgeHours | quote }}
                - name: DB_HOST
                  value: {{ include "chart.fullname" . }}-postgresql
                - name: DB_PORT
                  value: {{ include "chart.dbPort" . | quote }}
                - name: PGPORT
                  value: {{ include "chart.dbPort" . | quote }}
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "chart.fullname" . }}-db-credentials
                      key: username
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "chart.fullname" . }}-db-credentials
                      key: database
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      {{- include "chart.pgPasswordRef" . | nindent 22 }}
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
                - name: verify-script
                  mountPath: /scripts
                  readOnly: true
              resources:
{{- include "chart.resources" .Values.resources.pgBackup | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: {{ include "chart.fullname" . }}-pg-backup-pvc
            - name: verify-script
              configMap:
                name: {{ include "chart.fullname" . }}-pg-backup-verify
                defaultMode: 0555
{{- end }}
