apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  {{- toYaml .Values.config | nindent 2 }}
  # Runtime proxy target for the frontend's same-origin /api/v1, /docs and /openapi.json calls
  # (frontend/proxy.ts reads it per request). The in-cluster backend Service, or the WAF Service
  # when waf.enabled (chart.backendURL); the browser never sees it. A runtime env, so one image
  # serves every environment.
  BACKEND_URL: {{ include "chart.backendURL" . | quote }}
  # Host values the backend accepts (a 400 otherwise); probes are exempt. Set
  # config.ALLOWED_HOSTS to take over the list.
  {{- if not (hasKey .Values.config "ALLOWED_HOSTS") }}
  ALLOWED_HOSTS: {{ include "chart.allowedHosts" . | quote }}
  {{- end }}
  # DB_HOST: loopback with the Cloud SQL Auth Proxy sidecar, else the internal Postgres Service
  # (computed from the db namespace) for local/dev/qa, or the managed DB host (chart.dbHostValue).
  DB_HOST: {{ include "chart.dbHostValue" . | quote }}
