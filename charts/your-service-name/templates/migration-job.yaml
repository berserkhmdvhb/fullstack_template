{{/*
   Alembic migration Job: a plain release resource, one per release revision. NOT a Helm hook.

   Why not a hook: the backend's readiness (/api/v1/health) checks the schema revision, and Helm
   waits for the release's resources to be ready (--wait) BEFORE it runs post-install and
   post-upgrade hooks (pkg/action install.go and upgrade.go: the wait, then the post hooks). A
   post-install migration hook would therefore wait for Pods that wait for the schema it creates: a
   deadlock on every first install. As an ordinary resource the Job is created together with the
   Deployment; the Pods stay unready until it finishes, and a rolling update keeps the old Pods
   serving meanwhile. deploy-env.sh passes --wait-for-jobs, so a failed migration fails the
   release and the rollback path runs.

   The name carries .Release.Revision because a Job's spec is immutable: each upgrade renders a new
   Job. ttlSecondsAfterFinished cleans old ones up. The runner never downgrades and treats a newer
   database as success, so `helm rollback` is safe: within the TTL the older revision's kept Job already exists and is updated in place without re-running; after the TTL the Job is recreated and re-runs, finds the database ahead and exits 0.
   backoffLimit/activeDeadlineSeconds are the Job's own retry budget; the runner also retries the
   database connection itself.

   DB_USER is pulled from the APP secret (the one the migrate container consumes) and DB_NAME from
   the ConfigMap, both in the Job's own namespace. Referencing the db-namespace secret here
   stranded the init container in CreateContainerConfigError.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chart.migrationJobName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # Keep the Job when a rollback or upgrade removes this revision from the release (Helm skips
    # deleting resources with this policy), so a failed migration's logs survive the automatic
    # rollback. ttlSecondsAfterFinished still removes it after 24 hours.
    "helm.sh/resource-policy": keep
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
{{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "chart.imagePullSecrets" . | indent 6 }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- with include "chart.extraInitContainers" . }}
        {{- . | nindent 8 }}
        {{- end }}
        - name: wait-for-db
          image: {{ .Values.postgresql.clientImage }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL at ${DB_HOST}:${DB_PORT} ..."
              until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}"; do
                echo "  PostgreSQL not ready, retrying in 2s ..."
                sleep 2
              done
              echo "PostgreSQL is ready."
          envFrom:
            - configMapRef:
                name: {{ include "chart.fullname" . }}-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.secretName" . }}
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "chart.fullname" . }}-config
                  key: DB_NAME
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          image: {{ include "chart.image" (dict "image" .Values.images.backend) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              export DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
              exec /usr/bin/tini -- python -m your_service_name.backend.db.run_migrations
          envFrom:
            - configMapRef:
                name: {{ include "chart.fullname" . }}-config
            - secretRef:
                name: {{ include "chart.secretName" . }}
          {{- with include "chart.dbCaEnv" . }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with include "chart.dbCaVolumeMount" . }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- with include "chart.dbCaVolume" . }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
