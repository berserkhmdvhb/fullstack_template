{{/*
   The weekly restore check's script (files/pg-backup-verify.sh, tested by
   tests/scripts/pg-backup-verify.bats), mounted by the verify CronJob. Same gates.
*/}}
{{- if and .Values.postgresql.enabled .Values.postgresql.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-pg-backup-verify
  namespace: {{ include "chart.dbNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-verification
data:
  pg-backup-verify.sh: {{ .Files.Get "files/pg-backup-verify.sh" | quote }}
{{- end }}
