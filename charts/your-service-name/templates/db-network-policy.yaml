{{/*
   Restricts ingress to the PostgreSQL pods: backend + migration pods from the app
   namespace. The app namespace is selected by its STABLE `tier: app-ns` label
   (stamped on the app Namespace resource; namespaces.appTier), NOT by a hard-coded name — so the
   policy keeps working as the release namespace changes per environment.
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-postgresql-access
  namespace: {{ include "chart.dbNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgresql
  policyTypes:
    - Ingress
  ingress:
    # Backend pods from the app namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              tier: {{ .Values.namespaces.appTier }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ include "chart.dbPort" . }}
    # Migration Job pods from the app namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              tier: {{ .Values.namespaces.appTier }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: migration
      ports:
        - protocol: TCP
          port: {{ include "chart.dbPort" . }}
{{- if .Values.postgresql.backup.enabled }}
    # The backup and verify jobs of this release, in this (the database) namespace.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backup, backup-verification]
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ include "chart.dbPort" . }}
{{- end }}
{{- end }}
