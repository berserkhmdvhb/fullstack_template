{{/*
   App Secret, the local and kind source: from secrets.dbPassword / statsPass (the
   gitignored values.secret.yaml). dev, qa and production take it from the External
   Secrets Operator instead (secrets.externalSecret.enabled renders templates/externalsecret.yaml),
   and previews from secrets.existingSecret, a Secret managed outside the chart; with either, this
   Secret is skipped and the backend/migration read chart.secretName. validate-values.yaml fails the
   render when two sources are set (wiki/security.md, Secret sources).

   IMPORTANT: the DB_USER / DB_PASSWORD here MUST match postgresql.auth in the
   internal-DB case — the backend authenticates to Postgres with these.
*/}}
{{- if and (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) (or .Values.secrets.dbPassword .Values.secrets.statsPass) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  STATS_PASS: {{ .Values.secrets.statsPass | quote }}
{{- end }}
