{{/*
   App Secret. Dev/local defaults come from values; production leaves the values
   empty and supplies the keys via an externally-managed secret referenced by
   secrets.existingSecret (sealed-secrets / External Secrets Operator / SOPS).
   When secrets.existingSecret is set, this chart-created Secret is skipped and
   the backend/migration reference the external one instead (chart.secretName).

   IMPORTANT: the DB_USER / DB_PASSWORD here MUST match postgresql.auth in the
   internal-DB case — the backend authenticates to Postgres with these.
*/}}
{{- if and (not .Values.secrets.existingSecret) (or .Values.secrets.dbPassword .Values.secrets.statsPass) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  STATS_PASS: {{ .Values.secrets.statsPass | quote }}
{{- end }}
