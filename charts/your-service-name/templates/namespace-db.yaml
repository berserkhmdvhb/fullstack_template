{{/*
   Database namespace, rendered only with namespaces.create=true (see namespace-app.yaml; by
   default the admin bootstrap creates it). Derived from the release namespace (e.g.
   your-service-name-dev-db). Carries the stable `tier: db` label and Pod Security "restricted":
   the PostgreSQL StatefulSet and the backup CronJobs meet it (tests/backend/test_chart_pod_security.py).
*/}}
{{- if and .Values.namespaces.create (or .Values.postgresql.enabled .Values.externalDatabase.enabled) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "chart.dbNamespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: {{ include "chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    environment: {{ .Values.environment }}
    tier: db
    component: database
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.30
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.30
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.30
{{- end }}
