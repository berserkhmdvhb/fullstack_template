{{- /*
   serviceAccount.create false: the ServiceAccount exists already. The preview namespace holds one
   release per pull request, and they share the one the bootstrap creates there (scripts/k8s-bootstrap.sh
   preview), since two releases cannot own the same object.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
