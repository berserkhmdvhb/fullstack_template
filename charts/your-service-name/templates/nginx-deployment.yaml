apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  # Omit replicas when the HPA owns scaling (C-M4); production enables the nginx
  # HPA for HA, dev/qa keep the static replica below.
  {{- if not .Values.hpa.nginx.enabled }}
  replicas: {{ .Values.replicas.nginx }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
{{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
{{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "chart.imagePullSecrets" . | indent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ include "chart.image" (dict "image" .Values.images.nginx) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Delegate to the image entrypoint, which renders the envsubst template
          # (NGINX_BIND/NGINX_PORT/FRONTEND_ROOT) before exec'ing nginx — a bare
          # `nginx -g 'daemon off;'` bypasses rendering and fails for the non-root
          # worker.
          command:
            - /entrypoint.sh
          envFrom:
            - configMapRef:
                name: {{ include "chart.fullname" . }}-config
          env:
            - name: NGINX_PORT
              value: "8081"
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          resources:
{{- toYaml .Values.resources.nginx | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 10
            periodSeconds: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Let the Ingress drop this pod from its endpoints before SIGTERM;
                # nginx then finishes in-flight requests on SIGTERM (C-L5).
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            # Read-only rootfs: the entrypoint writes the rendered config, pid,
            # error log and all worker temp dirs under /tmp (see nginx.conf),
            # which the emptyDir below satisfies (C-L4).
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
      terminationGracePeriodSeconds: 30
      # Spread nginx pods across nodes/zones so the static-asset tier is not a
      # single point of failure (C-L12): production runs >=2 via the nginx HPA.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: nginx
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: nginx
                topologyKey: kubernetes.io/hostname
