{{/*
   PrometheusRule — alerting rules. Pluggable (off by default); requires the
   Prometheus Operator CRDs. namespace/endpoint literals are templated to the
   release. NOTE: Prometheus template expressions in annotations are escaped
   ({{ "{{" }} ... {{"}}" }}) so Helm leaves them for Prometheus to render.
*/}}
{{- if .Values.monitoring.prometheusRule }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "chart.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.prometheusRelease }}
spec:
  groups:
    - name: pod-health
      rules:
        - alert: PodRestartingFrequently
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[1h]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is restarting frequently"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} has restarted {{ "{{" }} $value {{ "}}" }} times in the last hour."
        - alert: PodPendingTooLong
          expr: |
            kube_pod_status_phase{namespace="{{ .Release.Namespace }}", phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is pending for more than 10 minutes"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} has been in Pending state for over 10 minutes."
        - alert: PodFailed
          expr: |
            kube_pod_status_phase{namespace="{{ .Release.Namespace }}", phase="Failed"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} has failed"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is in Failed state."
    - name: resource-usage
      rules:
        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}"}[5m])) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}", resource="cpu"}) by (pod)
            > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} CPU usage is above 85%"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is using {{ "{{" }} $value | humanizePercentage {{ "}}" }} of its CPU limit."
        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}"}) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}", resource="memory"}) by (pod)
            > 0.90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} memory usage is above 90%"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is using {{ "{{" }} $value | humanizePercentage {{ "}}" }} of its memory limit."
        - alert: MemoryApproachingOOM
          expr: |
            sum(container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}"}) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}", resource="memory"}) by (pod)
            > 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} memory usage is above 95% (OOM risk)"
            description: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is at risk of OOM kill."
    - name: service-health
      rules:
        - alert: BackendEndpointsDown
          expr: |
            kube_endpoint_address_available{namespace="{{ .Release.Namespace }}", endpoint="{{ include "chart.fullname" . }}-backend"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Backend service has no ready endpoints"
            description: "Backend service {{ include "chart.fullname" . }}-backend has 0 ready endpoints."
        - alert: FrontendEndpointsDown
          expr: |
            kube_endpoint_address_available{namespace="{{ .Release.Namespace }}", endpoint="{{ include "chart.fullname" . }}-frontend"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Frontend service has no ready endpoints"
            description: "Frontend service {{ include "chart.fullname" . }}-frontend has 0 ready endpoints."
        - alert: HighErrorRate
          # http_requests_total is the default metric of prometheus_fastapi_instrumentator
          # (main.py: Instrumentator().instrument(app).expose(app, endpoint="/metrics")),
          # so the app exposes this series by default — verified, not assumed.
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m]))
            > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "High error rate detected ({{ "{{" }} $value | humanizePercentage {{ "}}" }})"
            description: "More than 5% of requests are returning 5xx errors."
    - name: database-health
      rules:
        - alert: PostgreSQLDown
          expr: |
            kube_endpoint_address_available{namespace="{{ include "chart.dbNamespace" . }}", endpoint="{{ include "chart.fullname" . }}-postgresql"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL has no ready endpoints"
            description: "PostgreSQL service {{ include "chart.fullname" . }}-postgresql has 0 ready endpoints."
        - alert: BackupJobFailed
          # The backup CronJob's Jobs are "<name>-pg-backup-<timestamp>"; match the
          # trailing timestamp with [0-9]+ so we DON'T also fire on the weekly
          # "<name>-pg-backup-verify-<timestamp>" Jobs (cross-cutting finding).
          expr: |
            kube_job_failed{job_name=~"{{ include "chart.fullname" . }}-pg-backup-[0-9]+"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL backup job failed"
            description: "Backup job {{ "{{" }} $labels.job_name {{ "}}" }} has failed."
{{- end }}
