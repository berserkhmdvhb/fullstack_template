{{/*
   PrometheusRule: the alert rules for the Prometheus Operator (monitoring.flavour
   prometheus-operator). Pluggable (off by default); requires the Prometheus Operator CRDs.
   The groups are chart.alertGroups, shared with the Google Managed Prometheus flavour.
*/}}
{{- if and .Values.monitoring.prometheusRule (eq .Values.monitoring.flavour "prometheus-operator") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "chart.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.prometheusRelease }}
spec:
  groups:
{{- include "chart.alertGroups" . | nindent 4 }}
{{- end }}
