{{/*
   ResourceQuota for the app namespace. Caps are coupled to hpa.* maxReplicas AND
   sized to fit a single developer-laptop node; raise both together for big
   clusters. Postgres is excluded — it lives in the separate db namespace.
*/}}
{{- if .Values.quota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "chart.fullname" . }}-quota
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  hard:
{{- toYaml .Values.quota.hard | nindent 4 }}
{{- end }}
---
{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
{{- toYaml .Values.limitRange.container.default | nindent 8 }}
      defaultRequest:
{{- toYaml .Values.limitRange.container.defaultRequest | nindent 8 }}
      max:
{{- toYaml .Values.limitRange.container.max | nindent 8 }}
      min:
{{- toYaml .Values.limitRange.container.min | nindent 8 }}
    - type: Pod
      max:
{{- toYaml .Values.limitRange.pod.max | nindent 8 }}
{{- end }}
