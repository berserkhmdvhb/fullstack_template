apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # Omit replicas when the HPA owns scaling: a static value here would be
  # three-way-merged back on every `helm upgrade`, clobbering the live count
  # (C-M4). The HPA's minReplicas is the effective floor when enabled.
  {{- if not .Values.hpa.backend.enabled }}
  replicas: {{ .Values.replicas.backend }}
  {{- end }}
  revisionHistoryLimit: 3
  # Zero-downtime: never fewer ready Pods than desired; the readiness probe gates each step.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: 0
  minReadySeconds: {{ .Values.rollout.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  selector:
    matchLabels:
{{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
{{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Rolling update on ConfigMap change (Helm recomputes the hash).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "chart.imagePullSecrets" . | indent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with include "chart.extraInitContainers" . }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "chart.image" (dict "image" .Values.images.backend) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # The Python launcher serves the ASGI app with Uvicorn, in this one process. It reads
          # BACKEND_{BIND,PORT} and BACKEND_{GRACEFUL,KEEPALIVE}_TIMEOUT from the ConfigMap.
          command:
            - /usr/bin/tini
            - -s
            - --
            - /app/.venv/bin/python
            - -m
            - your_service_name.backend.serve
          envFrom:
            - configMapRef:
                name: {{ include "chart.fullname" . }}-config
            - secretRef:
                name: {{ include "chart.secretName" . }}
          # Assemble the Postgres URL from ConfigMap (host/port/name) + Secret
          # (user/pass). Without it engine.py silently falls back to local SQLite
          # and /health looks green while the DB tier is never exercised.
          env:
            - name: DATABASE_URL
              value: {{ include "chart.databaseURL" . | quote }}
            {{- include "chart.dbCaEnv" . | nindent 12 }}
            {{- with .Values.observability.tracing }}
            {{- if .enabled }}
            - name: TRACING_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: TRACING_SAMPLE_RATIO
              value: {{ .sampleRatio | quote }}
            {{- if .serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .serviceName | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.cspReporting.enabled }}
            - name: CSP_REPORT_ENABLED
              value: "true"
            {{- end }}
            {{- if or (eq .Values.edge.hsts "edge") (and (eq .Values.edge.hsts "auto") (eq .Values.edge.mode "tunnel")) }}
            - name: HSTS_ENABLED
              value: "false"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ include "chart.backendPort" . }}
              protocol: TCP
            - name: metrics
              containerPort: {{ include "chart.metricsPort" . }}
              protocol: TCP
          resources:
{{- include "chart.resources" .Values.resources.backend | nindent 12 }}
          # Startup and liveness are process-only (/healthz): the migration Job can outlast the startup
          # budget, and a Pod must not be restarted for waiting on it. Only readiness checks the schema.
          startupProbe:
            httpGet:
              path: {{ include "chart.backendLivePath" . }}
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: {{ include "chart.backendReadyPath" . }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ include "chart.backendLivePath" . }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the endpoint leave the Services before SIGTERM. The native sleep action: the
              # image has no shell to exec (GA in Kubernetes 1.34).
              sleep:
                seconds: {{ .Values.shutdown.preStopSeconds }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "chart.dbCaVolumeMount" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # writable paths are emptyDir below (C-L4)
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        {{- include "chart.dbCaVolume" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ include "chart.backendTerminationGrace" . }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: backend
                topologyKey: kubernetes.io/hostname
