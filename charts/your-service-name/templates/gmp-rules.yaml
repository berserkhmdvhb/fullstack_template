{{/*
   Rules: the alert rules for Google Managed Prometheus (monitoring.flavour gmp), the same groups
   as the PrometheusRule (chart.alertGroups). Pluggable (off by default); requires the managed
   collection's CRDs (monitoring.googleapis.com/v1). Namespaced: it applies to this namespace.
*/}}
{{- if and .Values.monitoring.prometheusRule (eq .Values.monitoring.flavour "gmp") }}
apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: {{ include "chart.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  groups:
{{- include "chart.alertGroups" . | nindent 4 }}
{{- end }}
