{{/*
   RBAC for the logging namespace (C-M2). The Fluentd DaemonSet runs in the logging
   namespace (not the app namespace), so it needs a ServiceAccount that lives there —
   a pod can only reference a ServiceAccount in its own namespace. Mirrors the app
   RBAC: minimal configmap read, token not automounted (log forwarding reads node
   files via hostPath, not the API).
*/}}
{{- if .Values.monitoring.logging }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.serviceAccountName" . }}
  namespace: {{ include "chart.loggingNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}-logging-role
  namespace: {{ include "chart.loggingNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-logging-binding
  namespace: {{ include "chart.loggingNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chart.fullname" . }}-logging-role
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.serviceAccountName" . }}
    namespace: {{ include "chart.loggingNamespace" . }}
{{- end }}
