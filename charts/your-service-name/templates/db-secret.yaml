{{/*
   DB-namespace Secret consumed by the internal Postgres StatefulSet (POSTGRES_USER/
   PASSWORD/DB) and the backup CronJobs. Keys are username/password/database.

   The password is sourced from secrets.dbPassword — the SAME value the app Secret
   uses for DB_PASSWORD — so the database and the app always share one password
   (no second value to drift). Supplied out-of-band; never committed (see
   values.yaml `secrets`). username/database come from postgresql.auth.*.
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-db-credentials
  namespace: {{ include "chart.dbNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.user }}
  {{- /* An empty password never renders: with postgresql.existingSecret the password lives there. */}}
  {{- if and (not .Values.postgresql.existingSecret) .Values.secrets.dbPassword }}
  # Single source of truth with the app Secret's DB_PASSWORD.
  password: {{ .Values.secrets.dbPassword | quote }}
  {{- end }}
  database: {{ .Values.postgresql.auth.database }}
{{- end }}
