{{/*
   Logging namespace. Derived from the release namespace (e.g. your-service-name-dev-logging).
   Carries Pod Security "baseline": the Fluentd DaemonSet (logging-daemonset.yaml) runs
   runAsUser:0, mounts hostPaths, and adds DAC_READ_SEARCH — all forbidden by the app
   namespace's "restricted" policy, so the log shipper lives here instead (C-M2).
*/}}
{{- if .Values.monitoring.logging }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "chart.loggingNamespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    environment: {{ .Values.environment }}
    tier: logging
    component: log-forwarding
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.30
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.30
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.30
{{- end }}
