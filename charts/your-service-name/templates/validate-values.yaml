{{- /*
  Fail-loud value validation. Renders nothing when values are sane; aborts the
  render (helm lint / helm template / helm upgrade all fail) when they are not.
  This is deliberate instead of a silent misconfig that only shows up as a pod
  that can't reach its database.

  Production selects a managed DB (postgresql.enabled=false + externalDatabase
  enabled). Kubernetes NetworkPolicy is IP-based (FQDN egress needs Cilium/a
  mesh), so the backend + migration can only reach the DB if externalDatabase
  .egressCIDR names the managed DB's subnet. An empty egressCIDR => the default
  -deny egress stands and the DB is silently unreachable while /health looks
  green. Fail here so the mistake surfaces at render time, not at 3am. With the Cloud SQL Auth
  Proxy (cloudSqlProxy.enabled) the app dials loopback instead, and cloudSqlProxy.egressCIDRs
  (checked below) is the egress that matters.
*/ -}}
{{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.enabled (not .Values.cloudSqlProxy.enabled) (eq (toString .Values.externalDatabase.egressCIDR) "") }}
{{- fail (printf "%s: externalDatabase is selected (postgresql.enabled=false) but externalDatabase.egressCIDR is empty. Set it to the managed DB's VPC subnet (e.g. your RDS CIDR) in values.production.yaml so the :5432 egress allow renders; empty => default-deny egress strands the DB." (include "chart.fullname" .)) }}
{{- end }}
{{- /*
  The backend turns its production checks on only when config.ENV is production (or prod).
  A production release that does not layer values.production.yaml keeps the dev default ENV
  and would run with those checks silently off, so refuse to render it.
*/ -}}
{{- if and (eq (toString .Values.environment) "production") (not (has (lower (toString .Values.config.ENV)) (list "production" "prod"))) }}
{{- fail (printf "%s: environment is production but config.ENV is %q. Layer values.production.yaml (-f) or set config.ENV=production, otherwise the backend's production checks stay off." (include "chart.fullname" .) (toString .Values.config.ENV)) }}
{{- end }}
{{- /*
  Opt-in tracing needs a collector URL: without it the backend refuses to start.
*/ -}}
{{- if and .Values.observability.tracing.enabled (eq (toString .Values.observability.tracing.endpoint) "") }}
{{- fail (printf "%s: observability.tracing.enabled is true but observability.tracing.endpoint is empty. Set the collector URL (for example http://collector:4318), and allow the egress with backend.networkPolicy.extraEgress." (include "chart.fullname" .)) }}
{{- end }}
{{- /*
  These two can hold a password or a token, and a ConfigMap is readable by anyone who can read the
  namespace: they belong in the app Secret (secrets.existingSecret), never in config.
*/ -}}
{{- range $name := list "RATE_LIMIT_STORAGE" "OTEL_EXPORTER_OTLP_HEADERS" }}
{{- if hasKey $.Values.config $name }}
{{- fail (printf "%s: config.%s must not be set: it can hold a credential. Put %s in the app Secret (secrets.existingSecret) instead." (include "chart.fullname" $) $name $name) }}
{{- end }}
{{- end }}
{{- /*
  Deploy-time placeholder guard (guards.rejectPlaceholders; the deploy script sets it). Every CI
  render leaves it off, so the template's own placeholders keep rendering there.
*/ -}}
{{- if .Values.guards.rejectPlaceholders }}
{{- if eq .Values.edge.mode "gateway" }}
{{- range .Values.edge.gateway.parentRefs }}
{{- if eq .name "your-gateway" }}
{{- fail (printf "%s: edge.gateway.parentRefs names the placeholder Gateway \"your-gateway\". Set it to the Gateway on your cluster (values.<env>.yaml) before a deploy." (include "chart.fullname" $)) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Chart Secret mode with the in-cluster database and no password renders a Secret key that does not exist. */}}
{{- if and .Values.postgresql.enabled (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) (not .Values.secrets.dbPassword) (not .Values.postgresql.existingSecret) }}
{{- fail (printf "%s: secrets.dbPassword is empty with the in-cluster PostgreSQL and the chart Secret, so the database would have no password. Supply it out-of-band (values.secret.yaml), or take the app Secret from secrets.existingSecret or the ExternalSecret and name the database's password Secret in postgresql.existingSecret." (include "chart.fullname" $)) }}
{{- end }}
{{- if .Values.secrets.externalSecret.enabled }}
{{- if eq .Values.secrets.externalSecret.secretStoreRef.name "your-secret-store" }}
{{- fail (printf "%s: secrets.externalSecret.secretStoreRef.name is the placeholder \"your-secret-store\". Set it to your cluster's secret store (values.<env>.yaml) before a deploy." (include "chart.fullname" $)) }}
{{- end }}
{{- end }}
{{- if .Values.cloudSqlProxy.enabled }}
{{- if eq .Values.cloudSqlProxy.instanceConnectionName "your-project:your-region:your-instance" }}
{{- fail (printf "%s: cloudSqlProxy.instanceConnectionName is the placeholder \"your-project:your-region:your-instance\". Set it to project:region:instance (values.<env>.yaml) before a deploy." (include "chart.fullname" $)) }}
{{- end }}
{{- end }}
{{- range $role, $host := .Values.edge.hosts }}
{{- $name := trimSuffix "." $host }}{{- /* one trailing dot: the absolute (FQDN) form */}}
{{- if or (eq $name "your-domain.example") (hasSuffix ".your-domain.example" $name) }}
{{- fail (printf "%s: edge.hosts.%s is %q, which still holds the placeholder domain your-domain.example. Set your real hostnames (infra/adapt/adopt.sh stamps them) before a deploy." (include "chart.fullname" $) $role $host) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
  Exactly one secret source holds the app Secret: the chart's own (secrets.dbPassword or
  secrets.statsPass), secrets.existingSecret, or the ExternalSecret. Two at once would leave it
  unclear which one the Pods read, so refuse to render.
*/ -}}
{{- $sources := list }}
{{- if or .Values.secrets.dbPassword .Values.secrets.statsPass }}{{ $sources = append $sources "secrets.dbPassword or secrets.statsPass" }}{{ end }}
{{- if .Values.secrets.existingSecret }}{{ $sources = append $sources "secrets.existingSecret" }}{{ end }}
{{- if .Values.secrets.externalSecret.enabled }}{{ $sources = append $sources "secrets.externalSecret.enabled" }}{{ end }}
{{- if gt (len $sources) 1 }}
{{- fail (printf "%s: more than one secret source is set (%s); choose exactly one: the chart's own Secret from values, secrets.existingSecret, or secrets.externalSecret.enabled." (include "chart.fullname" .) (join ", " $sources)) }}
{{- end }}
{{- /*
  The in-cluster Postgres takes its password from secrets.dbPassword, which is empty when the app
  Secret comes from secrets.existingSecret or the ExternalSecret: it then needs its own Secret.
*/ -}}
{{- if and .Values.postgresql.enabled (or .Values.secrets.existingSecret .Values.secrets.externalSecret.enabled) (not .Values.postgresql.existingSecret) }}
{{- fail (printf "%s: postgresql.existingSecret is required when postgresql.enabled is true and the app Secret comes from secrets.existingSecret or the ExternalSecret: secrets.dbPassword is empty then, so the in-cluster database has no password. Name a Secret in the database namespace holding it (key postgresql.existingSecretKey), or use a managed database (postgresql.enabled=false)." (include "chart.fullname" .)) }}
{{- end }}
{{- /*
  The Cloud SQL Auth Proxy replaces the database host with loopback and encrypts to Cloud SQL
  itself: the in-cluster Postgres would sit unused, and a verifying DB_SSLMODE would fail against
  the proxy's plaintext loopback listener (the backend's production check accepts disable for a
  loopback host).
*/ -}}
{{- if .Values.cloudSqlProxy.enabled }}
{{- if .Values.postgresql.enabled }}
{{- fail (printf "%s: cloudSqlProxy.enabled needs postgresql.enabled=false: the proxy replaces the database host with 127.0.0.1, so the in-cluster PostgreSQL would be unused. Use the managed database." (include "chart.fullname" .)) }}
{{- end }}
{{- if has (toString (get .Values.config "DB_SSLMODE")) (list "verify-ca" "verify-full") }}
{{- fail (printf "%s: config.DB_SSLMODE is %q with cloudSqlProxy.enabled; set it to \"disable\". The proxy encrypts to Cloud SQL, and the hop to 127.0.0.1 is local, so TLS verification fails against it." (include "chart.fullname" .) (toString (get .Values.config "DB_SSLMODE"))) }}
{{- end }}
{{- end }}
{{- /*
  The Cloud SQL Auth Proxy needs the instance to dial and the CIDRs its egress may reach (the
  NetworkPolicy is IP-based); without either the Pods start and cannot connect.
*/ -}}
{{- if .Values.cloudSqlProxy.enabled }}
{{- if not .Values.cloudSqlProxy.instanceConnectionName }}
{{- fail (printf "%s: cloudSqlProxy.instanceConnectionName is required when cloudSqlProxy.enabled is true. Set it to project:region:instance." (include "chart.fullname" .)) }}
{{- end }}
{{- if not .Values.cloudSqlProxy.egressCIDRs }}
{{- fail (printf "%s: cloudSqlProxy.egressCIDRs is required when cloudSqlProxy.enabled is true. List the CIDRs the proxy may reach on 3307 and 443 (the instance's private range and, for example, Private Google Access 199.36.153.8/30); empty => default-deny egress strands the proxy." (include "chart.fullname" .)) }}
{{- end }}
{{- end }}
