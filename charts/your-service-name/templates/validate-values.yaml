{{- /*
  Fail-loud value validation. Renders nothing when values are sane; aborts the
  render (helm lint / helm template / helm upgrade all fail) when they are not.
  This is deliberate instead of a silent misconfig that only shows up as a pod
  that can't reach its database.

  Production selects a managed DB (postgresql.enabled=false + externalDatabase
  enabled). Kubernetes NetworkPolicy is IP-based (FQDN egress needs Cilium/a
  mesh), so the backend + migration can only reach the DB if externalDatabase
  .egressCIDR names the managed DB's subnet. An empty egressCIDR => the default
  -deny egress stands and the DB is silently unreachable while /health looks
  green. Fail here so the mistake surfaces at render time, not at 3am. With the Cloud SQL Auth
  Proxy (cloudSqlProxy.enabled) the app dials loopback instead, and cloudSqlProxy.egressCIDRs
  (checked below) is the egress that matters.
*/ -}}
{{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.enabled (not .Values.cloudSqlProxy.enabled) (eq (toString .Values.externalDatabase.egressCIDR) "") }}
{{- fail (printf "%s: externalDatabase is selected (postgresql.enabled=false) but externalDatabase.egressCIDR is empty. Set it to the managed DB's VPC subnet (e.g. your RDS CIDR) in values.production.yaml so the egress allow to its port (config.DB_PORT) renders; empty => default-deny egress strands the DB." (include "chart.fullname" .)) }}
{{- end }}
{{- /*
  The backend turns its production checks on only when config.ENV is production (or prod).
  A production release that does not layer values.production.yaml keeps the dev default ENV
  and would run with those checks silently off, so refuse to render it.
*/ -}}
{{- /* The backend's PRODUCTION_ENVS, compared as it compares them: trimmed and lower-cased. */}}
{{- if and (eq (toString .Values.environment) "production") (not (has (lower (trim (toString .Values.config.ENV))) (list "production" "prod"))) }}
{{- fail (printf "%s: environment is production but config.ENV is %q. Layer values.production.yaml (-f) or set config.ENV=production, otherwise the backend's production checks stay off." (include "chart.fullname" .) (toString .Values.config.ENV)) }}
{{- end }}
{{- /*
  The images this release renders, by values path: the backend (the API and the migration Job), the
  frontend, the database client (the migration's wait-for-db and the backups), and each optional
  image while its feature is on. backend.extraInitContainers hold a full image reference each, so
  the rules and the guard below check them on their own (<repository>[:<tag>]@sha256:<64 hex>).
  The production rules and the placeholder guard below both read it.
*/ -}}
{{- $images := dict "images.backend" .Values.images.backend "images.frontend" .Values.images.frontend "postgresql.clientImage" .Values.postgresql.clientImage }}
{{- if .Values.waf.enabled }}{{- $_ := set $images "images.waf" .Values.images.waf }}{{- end }}
{{- if .Values.postgresql.enabled }}{{- $_ := set $images "postgresql.image" .Values.postgresql.image }}{{- end }}
{{- if .Values.cloudSqlProxy.enabled }}{{- $_ := set $images "cloudSqlProxy.image" .Values.cloudSqlProxy.image }}{{- end }}
{{- /*
  Production rules. Here rather than in values.schema.json because they depend on what renders (the
  WAF, the proxy, the HPA), and because Helm checks the schema before any template: a schema rule
  would hide the config.ENV message above. The digest's format is the schema's (any environment).
  - every image the release renders runs by digest, backend.extraInitContainers included;
  - a managed database: no in-cluster PostgreSQL, and externalDatabase or the Cloud SQL proxy;
  - an auth mode: AUTH_MODE none (also the default when unset) only with ALLOW_ANONYMOUS true, the
    backend's own production rule (the truthy spellings are the ones the backend parses);
  - at least two backend and two frontend Pods: the HPA's minReplicas when it is on, else replicas;
  - both PodDisruptionBudgets keep at least one Pod (minAvailable 0 would let a drain take them all).
*/ -}}
{{- if eq (toString .Values.environment) "production" }}
{{- range $path := keys $images | sortAlpha }}
{{- if not (get $images $path).digest }}
{{- fail (printf "%s: environment is production but %s.digest is empty. Production runs every image it renders by digest (sha256:<64 hex>); the deploy (scripts/ci/deploy-env.sh) sets the release's digests." (include "chart.fullname" $) $path) }}
{{- end }}
{{- end }}
{{- range $i, $c := .Values.backend.extraInitContainers }}
{{- $ref := toString (default "" $c.image) }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" $ref) }}
{{- fail (printf "%s: environment is production but backend.extraInitContainers[%d].image (%q) has no digest. Production runs every image by digest: pin it as <repository>:<tag>@sha256:<64 hex>." (include "chart.fullname" $) $i $ref) }}
{{- end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- fail (printf "%s: environment is production but postgresql.enabled is true. Production uses a managed database: set postgresql.enabled=false with externalDatabase or cloudSqlProxy." (include "chart.fullname" .)) }}
{{- else if not (or .Values.externalDatabase.enabled .Values.cloudSqlProxy.enabled) }}
{{- fail (printf "%s: environment is production and needs a managed database: set externalDatabase.enabled or cloudSqlProxy.enabled (postgresql.enabled stays false)." (include "chart.fullname" .)) }}
{{- end }}
{{- /* AUTH_MODE as the backend reads it: trimmed, lower-cased, empty is none; its allowed modes
     are the backend's AuthMode (a test keeps the two lists equal). ALLOW_ANONYMOUS is a bool the
     backend parses case-insensitively and without trimming. */}}
{{- $authModes := list "none" "gateway" "bearer" "oidc" "cloudflare-access" }}
{{- $authMode := default "none" (lower (trim (toString (get .Values.config "AUTH_MODE")))) }}
{{- if not (has $authMode $authModes) }}
{{- fail (printf "%s: environment is production but config.AUTH_MODE is %q, which is not one of %s; the backend refuses it." (include "chart.fullname" .) $authMode (join ", " $authModes)) }}
{{- end }}
{{- $anonymous := has (lower (toString (get .Values.config "ALLOW_ANONYMOUS"))) (list "1" "on" "t" "true" "y" "yes") }}
{{- if and (eq $authMode "none") (not $anonymous) }}
{{- fail (printf "%s: environment is production but config.AUTH_MODE is \"none\" (unset means none), which serves every endpoint anonymously and the backend refuses it. Set config.AUTH_MODE (oidc or cloudflare-access; wiki/security.md), or set config.ALLOW_ANONYMOUS to \"true\" to accept that explicitly." (include "chart.fullname" .)) }}
{{- end }}
{{- range $c := list "backend" "frontend" }}
{{- $hpa := get $.Values.hpa $c }}
{{- if $hpa.enabled }}
{{- if lt (int $hpa.minReplicas) 2 }}
{{- fail (printf "%s: environment is production but hpa.%s.minReplicas is %d. Production runs at least 2 %s Pods: set it to 2 or more." (include "chart.fullname" $) $c (int $hpa.minReplicas) $c) }}
{{- end }}
{{- else if lt (int (get $.Values.replicas $c)) 2 }}
{{- fail (printf "%s: environment is production but replicas.%s is %d (hpa.%s.enabled is false). Production runs at least 2 %s Pods: set it to 2 or more." (include "chart.fullname" $) $c (int (get $.Values.replicas $c)) $c $c) }}
{{- end }}
{{- if lt (int (get $.Values.pdb $c).minAvailable) 1 }}
{{- fail (printf "%s: environment is production but pdb.%s.minAvailable is %d, so a node drain may evict every %s Pod. Set it to 1 or more." (include "chart.fullname" $) $c (int (get $.Values.pdb $c).minAvailable) $c) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
  The metrics port is its own container port in the backend Pod: it may not be the API port or, with
  the Cloud SQL proxy sidecar, the proxy's health port. Two containers on one port fail at bind
  time, after the render passed.
*/ -}}
{{- if eq (toString .Values.config.METRICS_PORT) (toString .Values.config.BACKEND_PORT) }}
{{- fail (printf "%s: config.METRICS_PORT (%s) is the API port (config.BACKEND_PORT). Give the metrics server its own port." (include "chart.fullname" .) (toString .Values.config.METRICS_PORT)) }}
{{- end }}
{{- if and .Values.cloudSqlProxy.enabled (eq (toString .Values.config.METRICS_PORT) (toString .Values.cloudSqlProxy.healthPort)) }}
{{- fail (printf "%s: config.METRICS_PORT (%s) is the Cloud SQL proxy's health port (cloudSqlProxy.healthPort). Change one of them." (include "chart.fullname" .) (toString .Values.config.METRICS_PORT)) }}
{{- end }}
{{- /*
  Opt-in tracing needs a collector URL: without it the backend refuses to start.
*/ -}}
{{- if and .Values.observability.tracing.enabled (eq (toString .Values.observability.tracing.endpoint) "") }}
{{- fail (printf "%s: observability.tracing.enabled is true but observability.tracing.endpoint is empty. Set the collector URL (for example http://collector:4318), and allow the egress with backend.networkPolicy.extraEgress." (include "chart.fullname" .)) }}
{{- end }}
{{- /*
  These two can hold a password or a token, and a ConfigMap is readable by anyone who can read the
  namespace: they belong in the app Secret (secrets.existingSecret), never in config.
*/ -}}
{{- range $name := list "RATE_LIMIT_STORAGE" "OTEL_EXPORTER_OTLP_HEADERS" }}
{{- if hasKey $.Values.config $name }}
{{- fail (printf "%s: config.%s must not be set: it can hold a credential. Put %s in the app Secret (secrets.existingSecret) instead." (include "chart.fullname" $) $name $name) }}
{{- end }}
{{- end }}
{{- /*
  Deploy-time placeholder guard (guards.rejectPlaceholders; the deploy script sets it). Every CI
  render leaves it off, so the template's own placeholders keep rendering there. It collects every
  placeholder it finds and fails once, naming each, so one failed deploy shows the whole list.
*/ -}}
{{- if .Values.guards.rejectPlaceholders }}
{{- $found := list }}
{{- if eq .Values.edge.mode "gateway" }}
{{- range .Values.edge.gateway.parentRefs }}
{{- if eq .name "your-gateway" }}
{{- $found = append $found "edge.gateway.parentRefs names the placeholder Gateway \"your-gateway\" (set the Gateway on your cluster)" }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Chart Secret mode with the in-cluster database and no password renders a Secret key that does not exist. */}}
{{- if and .Values.postgresql.enabled (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) (not .Values.secrets.dbPassword) (not .Values.postgresql.existingSecret) }}
{{- $found = append $found "secrets.dbPassword is empty with the in-cluster PostgreSQL and the chart Secret, so the database would have no password (supply it out-of-band, values.secret.yaml, or take the app Secret from secrets.existingSecret or the ExternalSecret and name the database's password Secret in postgresql.existingSecret)" }}
{{- end }}
{{- if and .Values.secrets.externalSecret.enabled (eq .Values.secrets.externalSecret.secretStoreRef.name "your-secret-store") }}
{{- $found = append $found "secrets.externalSecret.secretStoreRef.name is the placeholder \"your-secret-store\" (set your cluster's secret store)" }}
{{- end }}
{{- if and .Values.cloudSqlProxy.enabled (eq .Values.cloudSqlProxy.instanceConnectionName "your-project:your-region:your-instance") }}
{{- $found = append $found "cloudSqlProxy.instanceConnectionName is the placeholder \"your-project:your-region:your-instance\" (set project:region:instance)" }}
{{- end }}
{{- range $role, $host := .Values.edge.hosts }}
{{- $name := lower (trimSuffix "." $host) }}{{- /* one trailing dot: the absolute (FQDN) form; DNS names ignore case */}}
{{- if or (eq $name "your-domain.example") (hasSuffix ".your-domain.example" $name) }}
{{- $found = append $found (printf "edge.hosts.%s is %q, which still holds the placeholder domain your-domain.example (set your real hostnames; infra/adapt/adopt.sh stamps them)" $role $host) }}
{{- end }}
{{- end }}
{{- /* The placeholder digest (values.production.yaml) on any image that renders. */}}
{{- $zero := printf "sha256:%s" (repeat 64 "0") }}
{{- $held := list }}
{{- range $path := keys $images | sortAlpha }}
{{- if eq (toString (get $images $path).digest) $zero }}{{- $held = append $held (printf "%s.digest" $path) }}{{- end }}
{{- end }}
{{- range $i, $c := .Values.backend.extraInitContainers }}
{{- if hasSuffix (printf "@%s" $zero) (toString (default "" $c.image)) }}{{- $held = append $held (printf "backend.extraInitContainers[%d].image" $i) }}{{- end }}
{{- end }}
{{- if $held }}
{{- $found = append $found (printf "%s still %s the placeholder digest %s (the deploy sets each image's release digest; a hand-run upgrade passes --set images.<name>.digest=sha256:<64 hex>)" (join ", " $held) (ternary "holds" "hold" (eq (len $held) 1)) $zero) }}
{{- end }}
{{- /* The placeholder OIDC issuer and audience (values.production.yaml). */}}
{{- $authHeld := list }}
{{- if regexMatch "(?i)^[a-z][a-z0-9+.-]*://([^/?#@]*\\.)?your-domain\\.example\\.?(:[0-9]+)?([/?#].*)?$" (trim (toString (get .Values.config "OIDC_ISSUER"))) }}{{- $authHeld = append $authHeld "config.OIDC_ISSUER" }}{{- end }}
{{- if regexMatch "(^|,)\\s*your-oidc-audience\\s*(,|$)" (toString (get .Values.config "OIDC_AUDIENCE")) }}{{- $authHeld = append $authHeld "config.OIDC_AUDIENCE" }}{{- end }}
{{- if $authHeld }}
{{- $found = append $found (printf "%s still %s (an issuer on your-domain.example, the audience your-oidc-audience; set your OIDC provider's issuer and the API's audience)" (join ", " $authHeld) (ternary "holds a placeholder" "hold placeholders" (eq (len $authHeld) 1))) }}
{{- end }}
{{- if $found }}
{{- fail (printf "%s: guards.rejectPlaceholders found %d %s to replace before a deploy: %s. Set them in values.<env>.yaml." (include "chart.fullname" .) (len $found) (ternary "placeholder" "placeholders" (eq (len $found) 1)) (join "; " $found)) }}
{{- end }}
{{- end }}
{{- /*
  Exactly one secret source holds the app Secret: the chart's own (secrets.dbPassword or
  secrets.statsPass), secrets.existingSecret, or the ExternalSecret. Two at once would leave it
  unclear which one the Pods read, so refuse to render.
*/ -}}
{{- $sources := list }}
{{- if or .Values.secrets.dbPassword .Values.secrets.statsPass }}{{ $sources = append $sources "secrets.dbPassword or secrets.statsPass" }}{{ end }}
{{- if .Values.secrets.existingSecret }}{{ $sources = append $sources "secrets.existingSecret" }}{{ end }}
{{- if .Values.secrets.externalSecret.enabled }}{{ $sources = append $sources "secrets.externalSecret.enabled" }}{{ end }}
{{- if gt (len $sources) 1 }}
{{- fail (printf "%s: more than one secret source is set (%s); choose exactly one: the chart's own Secret from values, secrets.existingSecret, or secrets.externalSecret.enabled." (include "chart.fullname" .) (join ", " $sources)) }}
{{- end }}
{{- /*
  The in-cluster Postgres takes its password from secrets.dbPassword, which is empty when the app
  Secret comes from secrets.existingSecret or the ExternalSecret: it then needs its own Secret.
*/ -}}
{{- if and .Values.postgresql.enabled (or .Values.secrets.existingSecret .Values.secrets.externalSecret.enabled) (not .Values.postgresql.existingSecret) }}
{{- fail (printf "%s: postgresql.existingSecret is required when postgresql.enabled is true and the app Secret comes from secrets.existingSecret or the ExternalSecret: secrets.dbPassword is empty then, so the in-cluster database has no password. Name a Secret in the database namespace holding it (key postgresql.existingSecretKey), or use a managed database (postgresql.enabled=false)." (include "chart.fullname" .)) }}
{{- end }}
{{- /*
  The Cloud SQL Auth Proxy replaces the database host with loopback and encrypts to Cloud SQL
  itself: the in-cluster Postgres would sit unused, and a verifying DB_SSLMODE would fail against
  the proxy's plaintext loopback listener (the backend's production check accepts disable for a
  loopback host).
*/ -}}
{{- if .Values.cloudSqlProxy.enabled }}
{{- if .Values.postgresql.enabled }}
{{- fail (printf "%s: cloudSqlProxy.enabled needs postgresql.enabled=false: the proxy replaces the database host with 127.0.0.1, so the in-cluster PostgreSQL would be unused. Use the managed database." (include "chart.fullname" .)) }}
{{- end }}
{{- if has (lower (trim (toString (get .Values.config "DB_SSLMODE")))) (list "verify-ca" "verify-full") }}
{{- fail (printf "%s: config.DB_SSLMODE is %q with cloudSqlProxy.enabled; set it to \"disable\". The proxy encrypts to Cloud SQL, and the hop to 127.0.0.1 is local, so TLS verification fails against it." (include "chart.fullname" .) (toString (get .Values.config "DB_SSLMODE"))) }}
{{- end }}
{{- end }}
{{- /*
  The Cloud SQL Auth Proxy needs the instance to dial and the CIDRs its egress may reach (the
  NetworkPolicy is IP-based); without either the Pods start and cannot connect.
*/ -}}
{{- if .Values.cloudSqlProxy.enabled }}
{{- if not .Values.cloudSqlProxy.instanceConnectionName }}
{{- fail (printf "%s: cloudSqlProxy.instanceConnectionName is required when cloudSqlProxy.enabled is true. Set it to project:region:instance." (include "chart.fullname" .)) }}
{{- end }}
{{- if not .Values.cloudSqlProxy.egressCIDRs }}
{{- fail (printf "%s: cloudSqlProxy.egressCIDRs is required when cloudSqlProxy.enabled is true. List the CIDRs the proxy may reach on 3307 and 443 (the instance's private range and, for example, Private Google Access 199.36.153.8/30); empty => default-deny egress strands the proxy." (include "chart.fullname" .)) }}
{{- end }}
{{- end }}
