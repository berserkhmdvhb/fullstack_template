apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  # Omit replicas when the HPA owns scaling — a static value would be
  # three-way-merged back on `helm upgrade` and clobber the live count (C-M4).
  {{- if not .Values.hpa.frontend.enabled }}
  replicas: {{ .Values.replicas.frontend }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
{{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
{{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "chart.imagePullSecrets" . | indent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "chart.image" (dict "image" .Values.images.frontend) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            # Distroless frontend: node lives under /nodejs/bin and is NOT on PATH,
            # so the binary is pinned absolutely (same path the Dockerfile healthcheck
            # uses). The old `node` (PATH-relative) form assumed node:-slim and gave
            # "node: not found" -> exit 127 on the distroless image.
            - /nodejs/bin/node
          args:
            - server.js
          envFrom:
            - configMapRef:
                name: {{ include "chart.fullname" . }}-config
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # The browser calls same-origin /api/v1; the Next.js server proxies
            # it to the backend using BACKEND_URL from this ConfigMap (envFrom).
            # NEXT_PUBLIC_API_URL is left to the same-origin default — it is a
            # build-time var and cannot vary per env, so it must not be set here.
            {{- if .Values.cspReporting.enabled }}
            # Adds report-uri / report-to to the CSP (frontend/proxy.ts); read per request.
            - name: CSP_REPORTING_ENABLED
              value: "true"
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
{{- toYaml .Values.resources.frontend | nindent 12 }}
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 20
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Let the Ingress drop this pod from its endpoints before SIGTERM,
                # so in-flight requests drain instead of being cut off (C-L5).
                # Mirrors the backend; the Next.js server finishes on SIGTERM.
                # Distroless ships no shell, so the drain is a Node timer, not `sh -c`.
                command:
                  - /nodejs/bin/node
                  - "-e"
                  - "setTimeout(() => {}, 5000)"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # writable paths are emptyDir below (C-L4)
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: frontend
                topologyKey: kubernetes.io/hostname
