{{- if and (eq .Values.edge.mode "gateway") .Values.edge.routes }}
{{- /* One HTTPRoute per host role; each role's rules come from the one routes list (edge.routes). */ -}}
{{- range $role := include "chart.edgeRoles" . | fromJsonArray }}
{{- $routes := include "chart.edgeRoutes" (dict "ctx" $ "role" $role) | fromJsonArray }}
{{- if $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chart.fullname" $ }}-{{ $role }}
  namespace: {{ $.Release.Namespace }}
  labels:
{{- include "chart.labels" $ | nindent 4 }}
spec:
  parentRefs:
{{- toYaml $.Values.edge.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ index $.Values.edge.hosts $role | quote }}
  rules:
  {{- range $routes }}
    - matches:
        - path:
            type: {{ .match }}
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ .name }}
          port: {{ .port }}
      {{- with $.Values.edge.gateway.timeouts }}
      timeouts:
{{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
