{{- if .Values.waf.enabled }}
{{- if ne .Values.waf.provider "coraza" }}
{{- fail "waf.provider must be \"coraza\" (the only supported in-cluster WAF engine)" }}
{{- end }}
{{- if eq (int .Values.waf.health.port) (int .Values.waf.service.port) }}
{{- fail "waf.health.port must differ from waf.service.port (both listeners bind in the one Pod)" }}
{{- end }}
{{- $gke := .Values.edge.gateway.gke }}
{{- if and $gke.enabled (lt (int .Values.waf.timeouts.requestSeconds) (int $gke.timeoutSec)) }}
{{- fail (printf "waf.timeouts.requestSeconds (%v) must be at least edge.gateway.gke.timeoutSec (%v): the WAF would cut off a request the load balancer still allows" .Values.waf.timeouts.requestSeconds $gke.timeoutSec) }}
{{- end }}
{{- if and .Values.waf.upstream.host (not .Values.waf.upstreamPeers) }}
{{- fail "waf.upstream.host is set but waf.upstreamPeers is empty: list the upstream's NetworkPolicy peers, or the default-deny egress drops the WAF's traffic" }}
{{- end }}
{{- $upstreamHost := .Values.waf.upstream.host | default (printf "%s-backend" (include "chart.fullname" .)) }}
{{- $upstreamPort := include "chart.wafUpstreamPort" . }}
{{- /* Coraza's recommended configuration, enforcing, with request bodies inspected up to the
       backend's own limit (config.MAX_REQUEST_BODY_BYTES); responses are not buffered. */}}
{{- $bodyLimit := .Values.config.MAX_REQUEST_BODY_BYTES }}
{{- $directives := list "Include @recommended-conf" "SecRuleEngine On" "SecRequestBodyAccess On" "SecResponseBodyAccess Off" (printf "SecRequestBodyLimit %s" $bodyLimit) (printf "SecRequestBodyInMemoryLimit %s" $bodyLimit) "SecRequestBodyLimitAction Reject" }}
{{- if .Values.waf.owaspCrs }}
{{- $directives = concat $directives (list "Include @crs-setup-conf" "Include @owasp_crs/*.conf") }}
{{- end }}
{{- /* An adopter's own directives (rule exclusions such as SecRuleRemoveById), after CRS. */}}
{{- $directives = concat $directives (.Values.waf.extraDirectives | default list) }}
{{- /* Envoy's heap bound: 80% of the WAF container's memory limit, which chart.resources sets equal
       to its memory request; the rest is left to the Wasm VMs and the process. */}}
{{- $wafMemory := include "chart.bytes" .Values.waf.resources.requests.memory }}
{{- $maxHeap := div (mul (int64 $wafMemory) 8) 10 }}
# -----------------------------------------------------------------------------
# WAF proxy — Coraza (Envoy wasm + OWASP CRS), fronting the API surface.
#
# Envoy listens on .Values.waf.service.port, runs the Coraza filter (its recommended configuration,
# enforcing, request bodies inspected up to config.MAX_REQUEST_BODY_BYTES, then OWASP CRS)
# and reverse-proxies /api, /docs and /openapi.json to the upstream: the backend Service, or
# waf.upstream (an auth proxy). The Ingress routes those API paths at THIS Service when waf.enabled
# (see templates/ingress.yaml); the UI / static tiers bypass it.
#
# The image is images.waf (Dockerfile.waf): Envoy loads the Wasm from the file the image ships, so
# nothing is fetched at runtime. The CRS rules are embedded in the Wasm. The admin interface is off;
# a separate listener on waf.health.port answers the probes.
#
# OFF BY DEFAULT — nothing renders when waf.enabled=false.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-waf
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: waf
spec:
  replicas: 1
  selector:
    matchLabels:
{{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: waf
  template:
    metadata:
      labels:
{{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: waf
    spec:
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      {{- include "chart.imagePullSecrets" . | indent 6 }}
      # The restricted Pod Security profile (the app namespace enforces it): the image's own user
      # (65532, distroless nonroot; Dockerfile.waf), RuntimeDefault seccomp, no privilege escalation,
      # no capabilities, a read-only root filesystem. Envoy listens on unprivileged ports.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: {{ include "chart.image" (dict "image" .Values.images.waf) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
{{- include "chart.resources" .Values.waf.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.waf.service.port }}
            - name: health
              containerPort: {{ .Values.waf.health.port }}
          startupProbe:
            httpGet: {path: {{ .Values.waf.health.path }}, port: health}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: {{ .Values.waf.health.path }}, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: {{ .Values.waf.health.path }}, port: health}
            periodSeconds: 10
            failureThreshold: 3
          # Envoy writes nothing to its root filesystem; /tmp is a small in-memory scratch space.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # The image's entrypoint is envoy. Hot restart is off (one process per Pod, and no shared
          # memory to set up). The bootstrap has no admin block, so the admin interface is disabled.
          args:
            - --config-yaml
            - |
              # Under memory pressure (Envoy's heap against max_heap_size_bytes) Envoy first returns
              # free memory to the system, then refuses new requests (503) instead of being OOM-killed.
              overload_manager:
                refresh_interval: 0.25s
                resource_monitors:
                  - name: envoy.resource_monitors.fixed_heap
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.resource_monitors.fixed_heap.v3.FixedHeapConfig
                      max_heap_size_bytes: {{ $maxHeap }}
                actions:
                  - name: envoy.overload_actions.shrink_heap
                    triggers:
                      - name: envoy.resource_monitors.fixed_heap
                        threshold: { value: 0.9 }
                  - name: envoy.overload_actions.stop_accepting_requests
                    triggers:
                      - name: envoy.resource_monitors.fixed_heap
                        threshold: { value: 0.95 }
              static_resources:
                listeners:
                  # Coraza needs the whole body, so Envoy buffers it; above the buffer limit Envoy
                  # answers 413 itself. The same value as Coraza's limits: the backend's own limit.
                  - name: waf_listener
                    per_connection_buffer_limit_bytes: {{ $bodyLimit }}
                    address:
                      socket_address: { address: 0.0.0.0, port_value: {{ .Values.waf.service.port }} }
                    filter_chains:
                      - filters:
                          - name: envoy.filters.network.http_connection_manager
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                              stat_prefix: waf
                              # One canonical path for Coraza and the router: dot segments resolved,
                              # repeated slashes merged. An encoded slash (%2F) is refused (400): no
                              # API route has one, and it is a classic way to split a path differently
                              # for the WAF and the backend.
                              normalize_path: true
                              merge_slashes: true
                              path_with_escaped_slashes_action: REJECT_REQUEST
                              # Slow or unfinished requests are cut off (408): headers within
                              # waf.timeouts.requestHeadersSeconds, the whole request within
                              # waf.timeouts.requestSeconds (the buffer below holds it until then).
                              request_headers_timeout: {{ .Values.waf.timeouts.requestHeadersSeconds }}s
                              request_timeout: {{ .Values.waf.timeouts.requestSeconds }}s
                              # xff_num_trusted_hops is left at 0 on purpose: it also selects
                              # Envoy's trusted client address, so a non-zero value would hide the
                              # client behind the ingress Pod. The cost: Envoy overwrites
                              # X-Forwarded-Proto (wiki/security.md, Client IP). Nothing but the
                              # ingress may reach this Envoy.
                              http_filters:
                                - name: envoy.filters.http.wasm
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                                    config:
                                      name: coraza
                                      root_id: ""
                                      vm_config:
                                        runtime: envoy.wasm.runtime.v8
                                        vm_id: coraza
                                        code:
                                          local:
                                            filename: /etc/envoy/coraza/coraza-proxy-wasm.wasm
                                      configuration:
                                        "@type": type.googleapis.com/google.protobuf.StringValue
                                        value: {{ dict "directives_map" (dict "default" $directives) "default_directives" "default" | toJson | quote }}
                                # After Coraza, before the router: Coraza passes the headers on at once and
                                # runs its phase-2 rules (CRS's attack rules on the query string, headers
                                # and body) only at the end of the request, so without this buffer the
                                # upstream would get a request whose body never finishes uninspected.
                                - name: envoy.filters.http.buffer
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                                    max_request_bytes: {{ $bodyLimit }}
                                - name: envoy.filters.http.router
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                              route_config:
                                name: api_routes
                                virtual_hosts:
                                  - name: backend_api
                                    domains: ["*"]
                                    routes:
                                      - match: { prefix: /api }
                                        route: { cluster: upstream }
                                      - match: { prefix: /docs }
                                        route: { cluster: upstream }
                                      - match: { prefix: /openapi.json }
                                        route: { cluster: upstream }
                  # The probes' listener: the health path is a fixed 200, anything else a 404. No
                  # filter but the router, and no route to the upstream.
                  - name: health_listener
                    address:
                      socket_address: { address: 0.0.0.0, port_value: {{ .Values.waf.health.port }} }
                    filter_chains:
                      - filters:
                          - name: envoy.filters.network.http_connection_manager
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                              stat_prefix: health
                              http_filters:
                                - name: envoy.filters.http.router
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                              route_config:
                                name: health
                                virtual_hosts:
                                  - name: health
                                    domains: ["*"]
                                    routes:
                                      - match: { path: {{ .Values.waf.health.path | quote }} }
                                        direct_response: { status: 200, body: { inline_string: "ok" } }
                                      - match: { prefix: / }
                                        direct_response: { status: 404 }
                clusters:
                  - name: upstream
                    type: STRICT_DNS
                    # Close idle upstream connections BEFORE the backend's keep-alive does
                    # (values.yaml: waf.upstreamIdleTimeoutSeconds), so Envoy never reuses a
                    # connection Uvicorn has just closed.
                    typed_extension_protocol_options:
                      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
                        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
                        common_http_protocol_options:
                          idle_timeout: {{ .Values.waf.upstreamIdleTimeoutSeconds }}s
                        explicit_http_config:
                          http_protocol_options: {}
                    load_assignment:
                      cluster_name: upstream
                      endpoints:
                        - lb_endpoints:
                            - endpoint:
                                address:
                                  socket_address:
                                    address: {{ $upstreamHost }}
                                    port_value: {{ $upstreamPort }}
            - --disable-hot-restart
            # Worker threads: Envoy's default is one per CPU of the node, each with its own Wasm VM and
            # CRS, which outgrows the memory limit on a large node (waf.concurrency).
            - --concurrency
            - {{ .Values.waf.concurrency | quote }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-waf
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: waf
spec:
  selector:
{{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: waf
  ports:
    - name: http
      port: {{ .Values.waf.service.port }}
      targetPort: http
{{- end }}
