{{- if .Values.waf.enabled }}
{{- if ne .Values.waf.provider "coraza" }}
{{- fail "waf.provider must be \"coraza\" (the only supported in-cluster WAF engine)" }}
{{- end }}
# -----------------------------------------------------------------------------
# WAF proxy — Coraza (Envoy wasm + OWASP CRS), fronting the API surface.
#
# Envoy listens on .Values.waf.service.port, loads the Coraza wasm plugin (OWASP
# CRS, SecRuleEngine On) and reverse-proxies /api, /docs and /openapi.json to the
# backend service. The Ingress routes those API paths at THIS Service when
# waf.enabled (see templates/ingress.yaml); the UI / static tiers bypass it.
#
# OFF BY DEFAULT — nothing renders when waf.enabled=false.
#
# ⚠ VERIFY-ON-CLUSTER (see wiki/dast-waf-openshift-local-runbook.md): the two
# specifics below are the confirmed config *shape* from the corazawaf/coraza-proxy
# -wasm README, but must be pinned/confirmed against a real Envoy+Coraza run:
#   1. .Values.waf.wasmImage  — the exact published ghcr.io wasm image ref, AND
#      how Envoy loads it (OCI uri vs an HTTP url to the compiled main.wasm).
#   2. the wasm filter `type_url` — the PluginConfig type the pinned wasm expects.
# The CRS rules are embedded in the wasm, so there is no rules file to mount.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-waf
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: waf
spec:
  replicas: 1
  selector:
    matchLabels:
{{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: waf
  template:
    metadata:
      labels:
{{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: waf
    spec:
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      imagePullSecrets:
{{- include "chart.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: envoy
          image: {{ include "chart.image" (dict "image" .Values.waf.envoyImage) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.waf.service.port }}
          # Envoy bootstrap: an HTTP connection manager whose only custom filter
          # is the Coraza wasm (OWASP CRS), then the built-in router. The API
          # paths are routed to the `backend` cluster. CRS is embedded in the wasm
          # (Include @crs-setup-conf / @owasp_crs/*.conf) — no file mount needed.
          command: ["envoy"]
          args:
            - --config-yaml
            - |
              admin:
                address:
                  socket_address: { address: 127.0.0.1, port_value: 19000 }
              static_resources:
                listeners:
                  - name: waf_listener
                    address:
                      socket_address: { address: 0.0.0.0, port_value: {{ .Values.waf.service.port }} }
                    filter_chains:
                      - filters:
                          - name: envoy.filters.network.http_connection_manager
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                              stat_prefix: waf
                              # xff_num_trusted_hops is left at 0 on purpose: it also selects
                              # Envoy's trusted client address, so a non-zero value would hide the
                              # client behind the ingress Pod. The cost: Envoy overwrites
                              # X-Forwarded-Proto (wiki/security.md, Client IP). Nothing but the
                              # ingress may reach this Envoy.
                              http_filters:
                                - name: coraza.coraza
                                  typed_config:
                                    "@type": type.googleapis.com/udpa.type.v1.TypedStruct
                                    # ⚠ VERIFY: the PluginConfig type_url the pinned
                                    # Coraza wasm expects (confirmed shape, not a
                                    # confirmed value — check the pinned release).
                                    type_url: type.googleapis.com/corazawaf.coraza.v3alpha1.PluginConfig
                                    value:
                                      config:
                                        vm_config:
                                          runtime: envoy.wasm.runtime.v8
                                          vm_id: coraza-waf
                                          root_id: ""
                                          code:
                                            remote:
                                              # ⚠ VERIFY: how the pinned wasm is
                                              # served — an OCI uri (oci://ghcr.io/…)
                                              # if Envoy has OCI wasm support, or an
                                              # HTTP url to the compiled main.wasm.
                                              http:
                                                uri: {{ .Values.waf.wasmImage | quote }}
                                              vm_config:
                                                runtime: envoy.wasm.runtime.v8
                                                vm_id: coraza
                                          configuration:
                                            directives_map:
                                              default:
                                                - SecRuleEngine On
{{- if .Values.waf.owaspCrs }}
                                                - Include @crs-setup-conf
                                                - Include @owasp_crs/*.conf
{{- end }}
                                            default_directives: default
                                - name: envoy.filters.http.router
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                              route_config:
                                name: api_routes
                                virtual_hosts:
                                  - name: backend_api
                                    domains: ["*"]
                                    routes:
                                      - match: { prefix: /api }
                                        route: { cluster: backend }
                                      - match: { prefix: /docs }
                                        route: { cluster: backend }
                                      - match: { prefix: /openapi.json }
                                        route: { cluster: backend }
                clusters:
                  - name: backend
                    type: STRICT_DNS
                    # Close idle upstream connections BEFORE the backend's keep-alive does
                    # (values.yaml: waf.upstreamIdleTimeoutSeconds), so Envoy never reuses a
                    # connection Uvicorn has just closed.
                    typed_extension_protocol_options:
                      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
                        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
                        common_http_protocol_options:
                          idle_timeout: {{ .Values.waf.upstreamIdleTimeoutSeconds }}s
                        explicit_http_config:
                          http_protocol_options: {}
                    load_assignment:
                      cluster_name: backend
                      endpoints:
                        - lb_endpoints:
                            - endpoint:
                                address:
                                  socket_address:
                                    address: {{ include "chart.fullname" . }}-backend
                                    port_value: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-waf
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: waf
spec:
  selector:
{{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: waf
  ports:
    - name: http
      port: {{ .Values.waf.service.port }}
      targetPort: http
{{- end }}
