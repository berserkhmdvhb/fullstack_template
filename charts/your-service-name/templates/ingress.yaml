{{- if eq .Values.edge.mode "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
  {{- with .Values.edge.ingress.annotations }}
  annotations:
{{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.edge.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.edge.ingress.tlsSecretName }}
  tls:
    # All three host rules share one cert, so the issuer must cover all three names.
    # An empty tlsSecretName renders no TLS block (plain HTTP).
    - hosts:
        - {{ .Values.edge.hosts.api | quote }}
        - {{ .Values.edge.hosts.app | quote }}
        - {{ .Values.edge.hosts.root | quote }}
      secretName: {{ .Values.edge.ingress.tlsSecretName }}
  {{- end }}
  rules:
  {{- range $role := list "api" "app" "root" }}
    - host: {{ index $.Values.edge.hosts $role | quote }}
      http:
        paths:
        {{- range include "chart.edgeRoutes" (dict "ctx" $ "role" $role) | fromJsonArray }}
          - path: {{ .path }}
            pathType: {{ trimPrefix "Path" .match }}
            backend:
              service:
                name: {{ .name }}
                port: { number: {{ .port }} }
        {{- end }}
  {{- end }}
{{- end }}
