{{/*
   Optional ExternalSecret (External Secrets Operator): syncs the app Secret from the platform's secret
   store, for example GCP Secret Manager through a ClusterSecretStore with Workload Identity. The
   store is the platform's; the chart ships none (wiki/security.md). One of three exclusive secret
   sources (secrets.existingSecret, the chart Secret, this): secret.yaml does not render with it, and
   validate-values.yaml fails the render when two are set. The operator creates the Secret under
   chart.secretName, the name the backend and the migration Job read.
*/}}
{{- if .Values.secrets.externalSecret.enabled }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "chart.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
spec:
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  refreshInterval: {{ $es.refreshInterval }}
  target:
    name: {{ include "chart.secretName" . }}
    creationPolicy: Owner
  data:
  {{- range $key, $remote := $es.remoteKeys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote }}
  {{- end }}
{{- end }}
