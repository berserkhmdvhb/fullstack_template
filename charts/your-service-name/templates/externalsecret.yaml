{{/*
   Optional ExternalSecret (External Secrets Operator), on in dev, qa and production: syncs the app
   Secret from the environment's secret store, by default Google Secret Manager through a namespaced
   SecretStore with Workload Identity (wiki/gke-cluster-setup.md, External Secrets). The store is the
   platform's; the chart ships none. One of three exclusive secret sources (secrets.existingSecret,
   the chart Secret, this): secret.yaml does not render with it, and validate-values.yaml fails the
   render when two are set. The operator creates the Secret under chart.secretName, the name the
   backend and the migration Job read.
   With the in-cluster PostgreSQL and no postgresql.existingSecret, a second ExternalSecret in the
   database namespace syncs the same DB_PASSWORD remote key for the server and the backup jobs
   (chart.pgPasswordRef), from a store of the same name there: one value for the app and the database.
   Each remote key is remoteKeyTemplate with {key} replaced, so switching the store is a values change.
*/}}
{{- if .Values.secrets.externalSecret.enabled }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "chart.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
spec:
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  refreshInterval: {{ $es.refreshInterval }}
  target:
    name: {{ include "chart.secretName" . }}
    creationPolicy: Owner
  data:
  {{- range $key, $name := $es.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        {{- include "chart.remoteRef" (list $es $name) | nindent 8 }}
  {{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "chart.fullname" . }}-db-password
  namespace: {{ include "chart.dbNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  refreshInterval: {{ $es.refreshInterval }}
  target:
    name: {{ include "chart.fullname" . }}-db-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        {{- include "chart.remoteRef" (list $es (get $es.keys "DB_PASSWORD")) | nindent 8 }}
{{- end }}
{{- end }}
