apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- if .Values.monitoring.scrapeAnnotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ include "chart.metricsPort" . | quote }}
    prometheus.io/path: "/metrics"
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ include "chart.backendPort" . }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ include "chart.metricsPort" . }}
      targetPort: metrics
      protocol: TCP
  selector:
{{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ include "chart.frontendPort" . }}
      targetPort: http
      protocol: TCP
  selector:
{{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
{{/* Internal Postgres headless-ish Service in the db namespace (for the StatefulSet). */}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-postgresql
  namespace: {{ include "chart.dbNamespace" . }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  clusterIP: None        # headless — StatefulSet needs stable, per-pod network IDs (C-L6)
  ports:
    - name: postgres
      port: {{ include "chart.dbPort" . }}
      targetPort: {{ include "chart.dbPort" . }}
      protocol: TCP
  selector:
{{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
