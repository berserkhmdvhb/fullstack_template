{{/*
   App-namespace NetworkPolicies: default-deny, then least-privilege allows.
   The db namespace is referenced by its templated name (kubernetes.io/metadata.name
   is auto-added to every namespace) — the one cross-namespace string that was a
   hard-coded literal in Kustomize and is now drift-proof.
*/}}
# ---- 1. Default deny all ingress and egress ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# ---- 2. Allow Ingress Controller -> app pods ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-from-ingress
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000   # backend
        - protocol: TCP
          port: 3000   # frontend
---
# ---- 3. Allow Backend -> PostgreSQL (cross-namespace) + DNS ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-backend-to-db
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "chart.dbNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
{{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.egressCIDR }}
    # Managed DB (postgresql.enabled=false): allow egress to its subnet on :5432.
    # NetworkPolicy is IP-based; set externalDatabase.egressCIDR to the DB subnet.
    - to:
        - ipBlock:
            cidr: {{ .Values.externalDatabase.egressCIDR | quote }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- /* backend.networkPolicy.extraEgress: an OTLP collector (4318), a Redis (6379), ... */}}
{{- with .Values.backend.networkPolicy.extraEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
---
# ---- 4. Allow Migration Job -> PostgreSQL (cross-namespace) + DNS ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-migration-to-db
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: migration
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "chart.dbNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
{{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.egressCIDR }}
    # Managed DB (postgresql.enabled=false): allow egress to its subnet on :5432.
    - to:
        - ipBlock:
            cidr: {{ .Values.externalDatabase.egressCIDR | quote }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ---- 5. Allow Frontend -> Backend API + DNS ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-frontend-to-backend
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
