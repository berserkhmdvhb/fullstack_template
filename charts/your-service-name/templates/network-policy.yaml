{{/*
   App-namespace NetworkPolicies: default-deny, then least-privilege allows.
   The db namespace is referenced by its templated name (kubernetes.io/metadata.name
   is auto-added to every namespace) — the one cross-namespace string that was a
   hard-coded literal in Kustomize and is now drift-proof.
*/}}
# ---- 1. Default deny all ingress and egress ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
{{- $peers := include "chart.edgePeers" . | fromJsonArray }}
{{- $backendPort := include "chart.backendPort" . }}
# ---- 2. Allow the edge -> frontend (peers per edge.mode, chart.edgePeers) ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-to-frontend
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
{{- /* No peer => no rule: an empty `from` would admit every source. */}}
{{- if $peers }}
  ingress:
    - from:
{{- toYaml $peers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "chart.frontendPort" . }}
{{- end }}
---
# ---- 3. Allow -> backend: the frontend's server-side calls and the edge, or, with the WAF on,
#         only the WAF (nothing reaches the backend around it); plus the metrics scrape ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-to-backend
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
{{- if .Values.waf.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: waf
      ports:
        - protocol: TCP
          port: {{ $backendPort }}
{{- else }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: {{ $backendPort }}
{{- if $peers }}
    - from:
{{- toYaml $peers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $backendPort }}
{{- end }}
{{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
{{- toYaml (.Values.networkPolicy.monitoringNamespaceSelector | default (dict "kubernetes.io/metadata.name" "monitoring")) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $backendPort }}
---
{{- if .Values.waf.enabled }}
# ---- 3b. Allow the frontend and the edge -> WAF, and WAF -> backend + DNS ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-waf
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: waf
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: {{ .Values.waf.service.port }}
{{- if $peers }}
    - from:
{{- toYaml $peers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.waf.service.port }}
{{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ $backendPort }}
{{- include "chart.dnsEgress" . | nindent 4 }}
---
{{- end }}
# ---- 4. Allow Backend -> PostgreSQL (cross-namespace) + DNS ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-backend-to-db
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "chart.dbNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
{{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.egressCIDR }}
    # Managed DB (postgresql.enabled=false): allow egress to its subnet on :5432.
    # NetworkPolicy is IP-based; set externalDatabase.egressCIDR to the DB subnet.
    - to:
        - ipBlock:
            cidr: {{ .Values.externalDatabase.egressCIDR | quote }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- include "chart.dnsEgress" . | nindent 4 }}
{{- /* backend.networkPolicy.extraEgress: an OTLP collector (4318), a Redis (6379), ... */}}
{{- with .Values.backend.networkPolicy.extraEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
---
# ---- 5. Allow Migration Job -> PostgreSQL (cross-namespace) + DNS ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-migration-to-db
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: migration
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "chart.dbNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
{{- if and (not .Values.postgresql.enabled) .Values.externalDatabase.egressCIDR }}
    # Managed DB (postgresql.enabled=false): allow egress to its subnet on :5432.
    - to:
        - ipBlock:
            cidr: {{ .Values.externalDatabase.egressCIDR | quote }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- include "chart.dnsEgress" . | nindent 4 }}
---
# ---- 6. Allow Frontend -> Backend API (the WAF when it is on) + DNS ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-allow-frontend-to-backend
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ ternary "waf" "backend" .Values.waf.enabled }}
      ports:
        - protocol: TCP
          port: {{ include "chart.apiBackendPort" . }}
{{- include "chart.dnsEgress" . | nindent 4 }}
