suite: edge mode tunnel
release:
  name: svc
  namespace: app
set:
  edge:
    mode: tunnel
templates:
  - httproute.yaml
  - ingress.yaml
  - NOTES.txt
tests:
  - it: renders neither an HTTPRoute nor an Ingress
    asserts:
      - hasDocuments:
          count: 0
        template: httproute.yaml
      - hasDocuments:
          count: 0
        template: ingress.yaml

  - it: NOTES prints the tunnel route table on the root host only
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'your-service-name\.your-domain\.example\s+\^/api\(/\|\$\)\s+http://svc-your-service-name-backend.app.svc.cluster.local:8000'
      - matchRegexRaw:
          pattern: 'your-service-name\.your-domain\.example\s+\(empty\)\s+http://svc-your-service-name-frontend.app.svc.cluster.local:3000'
      - matchRegexRaw:
          pattern: 'your-service-name\.your-domain\.example\s+\^/openapi\\\.json\$\s+http://svc-your-service-name-backend.app.svc.cluster.local:8000'
      - notMatchRegexRaw:
          pattern: 'svc-api\.example\.org'
      - matchSnapshotRaw: {}

  - it: an api host adds the backend routes on it, and no frontend route
    template: NOTES.txt
    set:
      edge:
        hosts: {api: svc-api.example.org}
    asserts:
      - matchRegexRaw:
          pattern: 'svc-api\.example\.org\s+\^/api\(/\|\$\)\s+http://svc-your-service-name-backend.app.svc.cluster.local:8000'
      - matchRegexRaw:
          pattern: 'svc-api\.example\.org\s+\^/openapi\\\.json\$\s'
      - notMatchRegexRaw:
          pattern: 'svc-api\.example\.org\s+\(empty\)'
      - matchSnapshotRaw: {}

  - it: a custom route shows up in the route table, and the WAF switch moves it
    template: NOTES.txt
    set:
      waf:
        enabled: true
      edge:
        hosts: {api: svc-api.example.org}
        routes:
          - {path: /healthz, match: Exact, service: backend}
          - {path: /, match: PathPrefix, service: frontend}
    asserts:
      - matchRegexRaw:
          pattern: 'svc-api\.example\.org\s+\^/healthz\$\s+http://svc-your-service-name-waf.app.svc.cluster.local:8080'

  - it: the paths are the anchored regexes cloudflared matches, the catch-all last on each host
    template: NOTES.txt
    set:
      edge:
        hosts: {api: svc-api.example.org}
        routes:
          - {path: /, match: PathPrefix, service: frontend}
          - {path: /api/v1, match: PathPrefix, service: backend}
          - {path: /openapi.json, match: Exact, service: backend}
    asserts:
      - matchRegexRaw:
          pattern: '(?s)your-service-name\.your-domain\.example\s+\^/api/v1\(/\|\$\)\s.*\^/openapi\\\.json\$\s.*\(empty\)\s+http://svc-your-service-name-frontend'
      - notMatchRegexRaw:
          pattern: '(?s)\(empty\)\s+http://svc-your-service-name-frontend[^\n]*\n\s*your-service-name\.your-domain\.example\s+\^'
      - matchRegexRaw:
          pattern: 'first match wins'
