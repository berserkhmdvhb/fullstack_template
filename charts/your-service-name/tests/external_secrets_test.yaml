suite: External Secrets is the app Secret's source in the cluster environments, one store per environment
release:
  name: your-service-name
  namespace: your-service-name-dev
templates:
  - externalsecret.yaml
  - secret.yaml
tests:
  - it: dev renders the app ExternalSecret and the database's, from the environment's SecretStore and its keys
    values: [../values.dev.yaml]
    asserts:
      - hasDocuments: {count: 0}
        template: secret.yaml
      - hasDocuments: {count: 2}
        template: externalsecret.yaml
      - isKind: {of: ExternalSecret}
        template: externalsecret.yaml
      - equal: {path: apiVersion, value: external-secrets.io/v1}
        template: externalsecret.yaml
      - equal: {path: metadata.namespace, value: your-service-name-dev}
        template: externalsecret.yaml
        documentIndex: 0
      - equal: {path: spec.secretStoreRef, value: {name: your-secret-store, kind: SecretStore}}
        template: externalsecret.yaml
      - equal: {path: spec.target, value: {name: your-service-name-secret, creationPolicy: Owner}}
        template: externalsecret.yaml
        documentIndex: 0
      - equal:
          path: spec.data
          value:
            - {secretKey: DB_PASSWORD, remoteRef: {key: your-service-name-dev-db-password}}
            - {secretKey: DB_USER, remoteRef: {key: your-service-name-dev-db-user}}
            - {secretKey: STATS_PASS, remoteRef: {key: your-service-name-dev-stats-pass}}
        template: externalsecret.yaml
        documentIndex: 0
      - equal: {path: metadata.namespace, value: your-service-name-dev-db}
        template: externalsecret.yaml
        documentIndex: 1
      - equal: {path: spec.target, value: {name: your-service-name-db-password, creationPolicy: Owner}}
        template: externalsecret.yaml
        documentIndex: 1
      - equal:
          path: spec.data
          value: [{secretKey: password, remoteRef: {key: your-service-name-dev-db-password}}]
        template: externalsecret.yaml
        documentIndex: 1

  - it: qa reads only qa's keys
    release: {namespace: your-service-name-qa}
    values: [../values.qa.yaml]
    asserts:
      - hasDocuments: {count: 2}
        template: externalsecret.yaml
      - equal: {path: spec.secretStoreRef, value: {name: your-secret-store, kind: SecretStore}}
        template: externalsecret.yaml
      - equal:
          path: spec.data
          value:
            - {secretKey: DB_PASSWORD, remoteRef: {key: your-service-name-qa-db-password}}
            - {secretKey: DB_USER, remoteRef: {key: your-service-name-qa-db-user}}
            - {secretKey: STATS_PASS, remoteRef: {key: your-service-name-qa-stats-pass}}
        template: externalsecret.yaml
        documentIndex: 0
      - equal:
          path: spec.data
          value: [{secretKey: password, remoteRef: {key: your-service-name-qa-db-password}}]
        template: externalsecret.yaml
        documentIndex: 1

  - it: production renders exactly one ExternalSecret (a managed database), with production's keys
    release: {namespace: your-service-name-production}
    values: [../values.production.yaml]
    asserts:
      - hasDocuments: {count: 0}
        template: secret.yaml
      - hasDocuments: {count: 1}
        template: externalsecret.yaml
      - equal: {path: metadata.namespace, value: your-service-name-production}
        template: externalsecret.yaml
      - equal: {path: spec.secretStoreRef, value: {name: your-secret-store, kind: SecretStore}}
        template: externalsecret.yaml
      - equal:
          path: spec.data
          value:
            - {secretKey: DB_PASSWORD, remoteRef: {key: your-service-name-production-db-password}}
            - {secretKey: DB_USER, remoteRef: {key: your-service-name-production-db-user}}
            - {secretKey: STATS_PASS, remoteRef: {key: your-service-name-production-stats-pass}}
        template: externalsecret.yaml

  - it: local keeps the chart's own Secret
    release: {namespace: your-service-name-local}
    values: [../values.local.yaml]
    set: {secrets: {dbPassword: not-a-real-password, statsPass: not-a-real-password}}
    asserts:
      - hasDocuments: {count: 0}
        template: externalsecret.yaml
      - hasDocuments: {count: 1}
        template: secret.yaml

  - it: previews keep the Secrets the preview bootstrap creates
    release: {namespace: your-service-name-preview}
    values: [../values.preview.yaml]
    asserts:
      - hasDocuments: {count: 0}
        template: externalsecret.yaml
      - hasDocuments: {count: 0}
        template: secret.yaml

  - it: switching the store to OpenBao is a values change (the store reference, the key template and the property)
    values: [../values.dev.yaml]
    set:
      secrets:
        externalSecret:
          secretStoreRef: {name: openbao, kind: SecretStore}
          remoteKeyTemplate: "your-service-name/dev/{key}"
          remoteProperty: value
    asserts:
      - equal: {path: spec.secretStoreRef, value: {name: openbao, kind: SecretStore}}
        template: externalsecret.yaml
      - equal:
          path: spec.data
          value:
            - {secretKey: DB_PASSWORD, remoteRef: {key: your-service-name/dev/db-password, property: value}}
            - {secretKey: DB_USER, remoteRef: {key: your-service-name/dev/db-user, property: value}}
            - {secretKey: STATS_PASS, remoteRef: {key: your-service-name/dev/stats-pass, property: value}}
        template: externalsecret.yaml
        documentIndex: 0
      - equal:
          path: spec.data
          value: [{secretKey: password, remoteRef: {key: your-service-name/dev/db-password, property: value}}]
        template: externalsecret.yaml
        documentIndex: 1

  - it: a named database password Secret replaces the database's ExternalSecret
    values: [../values.dev.yaml]
    set: {postgresql: {existingSecret: pg-credentials}}
    asserts:
      - hasDocuments: {count: 1}
        template: externalsecret.yaml
      - equal: {path: metadata.namespace, value: your-service-name-dev}
        template: externalsecret.yaml
---
suite: the in-cluster database reads the password the database's ExternalSecret syncs
release:
  name: your-service-name
  namespace: your-service-name-dev
templates:
  - postgresql-statefulset.yaml
values:
  - ../values.dev.yaml
tests:
  - it: the StatefulSet's password comes from the synced Secret
    documentSelector: {path: kind, value: StatefulSet}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: your-service-name-db-password, key: password}}
---
suite: the External Secrets values are validated
release:
  name: your-service-name
  namespace: your-service-name-dev
templates:
  - validate-values.yaml
values:
  - ../values.dev.yaml
tests:
  - it: the committed dev values render
    asserts:
      - notFailedTemplate: {}

  - it: the former remoteKeys map is refused (a closed object)
    set: {secrets: {externalSecret: {remoteKeys: {DB_USER: x}}}}
    asserts:
      - failedTemplate: {}

  - it: a key template without {key} is refused
    set: {secrets: {externalSecret: {remoteKeyTemplate: your-service-name-dev-db-password}}}
    asserts:
      - failedTemplate: {}

  - it: an unknown store kind is refused
    set: {secrets: {externalSecret: {secretStoreRef: {kind: Vault}}}}
    asserts:
      - failedTemplate: {}

  - it: an empty store name is refused while enabled
    set: {secrets: {externalSecret: {secretStoreRef: {name: ""}}}}
    asserts:
      - failedTemplate: {}

  - it: a key segment with a slash is refused (the template adds the separators)
    set: {secrets: {externalSecret: {keys: {DB_USER: "a/b"}}}}
    asserts:
      - failedTemplate: {}

  - it: the database's ExternalSecret needs a DB_PASSWORD key
    set: {secrets: {externalSecret: {keys: {DB_PASSWORD: null}}}}
    asserts:
      - failedTemplate:
          errorPattern: 'secrets\.externalSecret\.keys has no DB_PASSWORD'

  - it: the deploy guard refuses the placeholder store
    set:
      guards: {rejectPlaceholders: true}
      edge: {hosts: {root: svc.test}, gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}}
    asserts:
      - failedTemplate:
          errorPattern: 'secrets\.externalSecret\.secretStoreRef\.name is the placeholder "your-secret-store"'

  - it: the deploy guard passes once the store is named
    set:
      guards: {rejectPlaceholders: true}
      edge: {hosts: {root: svc.test}, gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}}
      secrets: {externalSecret: {secretStoreRef: {name: secret-manager}}}
    asserts:
      - notFailedTemplate: {}
