suite: the weekly restore check runs the chart's script from a ConfigMap, with its schedule, tables and age
release:
  name: svc
  namespace: app
templates:
  - pg-backup-verify-cronjob.yaml
  - pg-backup-verify-configmap.yaml
  - pg-backup-cronjob.yaml
tests:
  - it: the schedule is postgresql.backup.verifySchedule
    template: pg-backup-verify-cronjob.yaml
    set:
      postgresql: {backup: {verifySchedule: "30 4 * * 1"}}
    asserts:
      - equal: {path: spec.schedule, value: "30 4 * * 1"}
  - it: the default schedule is Sundays 03:00 UTC
    template: pg-backup-verify-cronjob.yaml
    asserts:
      - equal: {path: spec.schedule, value: "0 3 * * 0"}
  - it: the Pod mounts the script read-only from the ConfigMap, executable by its user, and runs it
    template: pg-backup-verify-cronjob.yaml
    asserts:
      - equal:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].command'
          value: [/bin/sh, /scripts/pg-backup-verify.sh]
      - contains:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].volumeMounts'
          content: {name: verify-script, mountPath: /scripts, readOnly: true}
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content: {name: verify-script, configMap: {name: svc-your-service-name-pg-backup-verify, defaultMode: 0555}}
  - it: the tables and the maximum age reach the script
    template: pg-backup-verify-cronjob.yaml
    set:
      postgresql: {backup: {verifyTables: [alembic_version, orders], verifyMaxAgeHours: 50}}
    asserts:
      - contains:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].env'
          content: {name: VERIFY_TABLES, value: "alembic_version,orders"}
      - contains:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].env'
          content: {name: VERIFY_MAX_AGE_HOURS, value: "50"}
  - it: the defaults are the app's tables and 26 hours
    template: pg-backup-verify-cronjob.yaml
    asserts:
      - contains:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].env'
          content: {name: VERIFY_TABLES, value: "alembic_version,items"}
      - contains:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].env'
          content: {name: VERIFY_MAX_AGE_HOURS, value: "26"}
  - it: the ConfigMap is in the database namespace and holds the script
    template: pg-backup-verify-configmap.yaml
    asserts:
      - isKind: {of: ConfigMap}
      - equal: {path: metadata.name, value: svc-your-service-name-pg-backup-verify}
      - equal: {path: metadata.namespace, value: app-db}
      - matchRegex: {path: 'data["pg-backup-verify.sh"]', pattern: '^#!/bin/sh\n'}
      - matchRegex: {path: 'data["pg-backup-verify.sh"]', pattern: 'Backup verification completed successfully\.'}
  - it: without backups neither renders
    set:
      postgresql: {backup: {enabled: false}}
    asserts:
      - hasDocuments: {count: 0}
        template: pg-backup-verify-cronjob.yaml
      - hasDocuments: {count: 0}
        template: pg-backup-verify-configmap.yaml
  - it: with the managed database neither renders
    set:
      postgresql: {enabled: false}
      externalDatabase: {enabled: true}
    asserts:
      - hasDocuments: {count: 0}
        template: pg-backup-verify-cronjob.yaml
      - hasDocuments: {count: 0}
        template: pg-backup-verify-configmap.yaml
  - it: two runs never overlap (they would share the temporary database's name)
    template: pg-backup-verify-cronjob.yaml
    asserts:
      - equal: {path: spec.concurrencyPolicy, value: Forbid}
  - it: unset, the maximum age follows the BackupTooOld threshold (one source)
    template: pg-backup-verify-cronjob.yaml
    set:
      monitoring: {alerts: {backupMaxAgeHours: 30}}
    asserts:
      - contains:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].env'
          content: {name: VERIFY_MAX_AGE_HOURS, value: "30"}
  - it: an empty table list is refused
    template: pg-backup-verify-cronjob.yaml
    set:
      postgresql: {backup: {verifyTables: []}}
    asserts:
      - failedTemplate: {}
  - it: a table name with upper case is refused (information_schema holds lower-case names)
    template: pg-backup-verify-cronjob.yaml
    set:
      postgresql: {backup: {verifyTables: [alembic_version, Items]}}
    asserts:
      - failedTemplate: {}
  - it: the backup writes to a .partial name and renames it only once the dump succeeded
    template: pg-backup-cronjob.yaml
    documentSelector: {path: kind, value: CronJob}
    asserts:
      - matchRegex:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].command[2]'
          pattern: 'gzip > "\$\{BACKUP_FILE\}\.partial"\nmv "\$\{BACKUP_FILE\}\.partial" "\$\{BACKUP_FILE\}"\n'
  - it: retention removes old .partial files too
    template: pg-backup-cronjob.yaml
    documentSelector: {path: kind, value: CronJob}
    asserts:
      - matchRegex:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].command[2]'
          pattern: 'find /backup \\\( -name "\*\.sql\.gz" -o -name "\*\.sql\.gz\.partial" \\\) -mtime \+30 -delete'
  - it: a run is bounded by its deadline and retried once, and the script gets the stale age the deadline stays below
    template: pg-backup-verify-cronjob.yaml
    asserts:
      - equal: {path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 3600}
      - equal: {path: spec.jobTemplate.spec.backoffLimit, value: 1}
      - contains:
          path: 'spec.jobTemplate.spec.template.spec.containers[0].env'
          content: {name: VERIFY_STALE_AFTER_SECONDS, value: "86400"}
  - it: postgresql.backup.verifyDeadlineSeconds sets the deadline
    template: pg-backup-verify-cronjob.yaml
    set:
      postgresql: {backup: {verifyDeadlineSeconds: 7200}}
    asserts:
      - equal: {path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 7200}
  - it: the Pod's termination grace period leaves the script time to drop its database after a deadline's SIGTERM
    template: pg-backup-verify-cronjob.yaml
    asserts:
      - equal: {path: spec.jobTemplate.spec.template.spec.terminationGracePeriodSeconds, value: 120}
  - it: a deadline that, with the grace period, is not below the stale age is refused (a running check's database could be dropped)
    template: pg-backup-verify-cronjob.yaml
    set:
      postgresql: {backup: {verifyDeadlineSeconds: 86280}}
    asserts:
      - failedTemplate:
          errorPattern: 'verifyDeadlineSeconds \(86280\) plus the 120 s termination grace period must be below 86400'
  - it: the longest deadline that, with the grace period, stays below the stale age renders
    template: pg-backup-verify-cronjob.yaml
    set:
      postgresql: {backup: {verifyDeadlineSeconds: 86279}}
    asserts:
      - equal: {path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 86279}
  - it: the backup is bounded by postgresql.backup.deadlineSeconds
    template: pg-backup-cronjob.yaml
    documentSelector: {path: kind, value: CronJob}
    asserts:
      - equal: {path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 3600}
  - it: the backup deadline is a value
    template: pg-backup-cronjob.yaml
    documentSelector: {path: kind, value: CronJob}
    set:
      postgresql: {backup: {deadlineSeconds: 900}}
    asserts:
      - equal: {path: spec.jobTemplate.spec.activeDeadlineSeconds, value: 900}
  - it: a short release name keeps the unchanged CronJob names
    set:
      fullnameOverride: short-name
    asserts:
      - equal: {path: metadata.name, value: short-name-pg-backup-verify}
        template: pg-backup-verify-cronjob.yaml
      - equal: {path: metadata.name, value: short-name-pg-backup}
        template: pg-backup-cronjob.yaml
        documentSelector: {path: kind, value: CronJob}
  - it: a long release name gives CronJob names of at most 52 characters (the fullname cut to 35)
    set:
      fullnameOverride: abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz
    asserts:
      - equal: {path: metadata.name, value: abcdefghijklmnopqrstuvwxyz012345678-pg-backup-verify}
        template: pg-backup-verify-cronjob.yaml
      - equal: {path: metadata.name, value: abcdefghijklmnopqrstuvwxyz012345678-pg-backup}
        template: pg-backup-cronjob.yaml
        documentSelector: {path: kind, value: CronJob}
  - it: a cut that ends in a hyphen drops it
    set:
      fullnameOverride: abcdefghijklmnopqrstuvwxyz01234567-zzzzzzzz
    asserts:
      - equal: {path: metadata.name, value: abcdefghijklmnopqrstuvwxyz01234567-pg-backup}
        template: pg-backup-cronjob.yaml
        documentSelector: {path: kind, value: CronJob}
