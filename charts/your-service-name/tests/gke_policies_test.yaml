suite: optional GKE Gateway provider policies
release:
  name: svc
  namespace: app
templates:
  - gke-policies.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - configmap.yaml
tests:
  - template: gke-policies.yaml
    it: off by default - no provider object
    asserts:
      - hasDocuments: {count: 0}

  - template: gke-policies.yaml
    it: off outside gateway mode, even when enabled
    set: {edge: {mode: tunnel, gateway: {gke: {enabled: true}}}}
    asserts:
      - hasDocuments: {count: 0}

  - template: gke-policies.yaml
    it: WAF off - health checks and backend policies for the backend and frontend Services
    set: {edge: {gateway: {gke: {enabled: true}}}}
    asserts:
      - hasDocuments: {count: 4}
      - equal:
          path: spec
          value:
            default:
              config:
                type: HTTP
                httpHealthCheck: {requestPath: /api/v1/health, port: 8000}
            targetRef: {group: "", kind: Service, name: svc-your-service-name-backend}
        documentIndex: 0
      - isKind: {of: HealthCheckPolicy}
        documentIndex: 0
      - isAPIVersion: {of: networking.gke.io/v1}
        documentIndex: 0
      - equal:
          path: spec
          value:
            default:
              timeoutSec: 120
              logging: {enabled: true, sampleRate: 1000000}
            targetRef: {group: "", kind: Service, name: svc-your-service-name-backend}
        documentIndex: 1
      - isKind: {of: GCPBackendPolicy}
        documentIndex: 1
      - isAPIVersion: {of: networking.gke.io/v1}
        documentIndex: 1
      - equal:
          path: spec
          value:
            default:
              config:
                type: HTTP
                httpHealthCheck: {requestPath: /api/healthz, port: 3000}
            targetRef: {group: "", kind: Service, name: svc-your-service-name-frontend}
        documentIndex: 2
      - equal:
          path: spec.targetRef.name
          value: svc-your-service-name-frontend
        documentIndex: 3
      - matchSnapshot: {}

  - template: gke-policies.yaml
    it: WAF on - the backend policies target the WAF Service and health-check through it
    set: {waf: {enabled: true}, edge: {gateway: {gke: {enabled: true}}}}
    asserts:
      - equal:
          path: spec.default.config.httpHealthCheck
          value: {requestPath: /api/v1/health, port: 8080}
        documentIndex: 0
      - equal:
          path: spec.targetRef.name
          value: svc-your-service-name-waf
        documentIndex: 0
      - equal:
          path: spec.targetRef.name
          value: svc-your-service-name-waf
        documentIndex: 1
      - matchSnapshot: {}

  - template: gke-policies.yaml
    it: the timeout, the log sample rate and a Cloud Armor policy come from values
    set:
      edge:
        gateway:
          gke:
            enabled: true
            timeoutSec: 300
            logging: {sampleRate: 500000}
            securityPolicy: edge-armor
    asserts:
      - equal:
          path: spec.default
          value:
            timeoutSec: 300
            logging: {enabled: true, sampleRate: 500000}
            securityPolicy: edge-armor
        documentIndex: 1
      - equal:
          path: spec.default.securityPolicy
          value: edge-armor
        documentIndex: 3

  - template: gke-policies.yaml
    it: no Cloud Armor field unless a policy is named
    set: {edge: {gateway: {gke: {enabled: true}}}}
    asserts:
      - notExists: {path: spec.default.securityPolicy}
        documentIndex: 3

  - it: the health-check paths are the readiness probes' paths
    set: {edge: {gateway: {gke: {enabled: true}}}}
    asserts:
      - equal: {path: spec.default.config.httpHealthCheck.requestPath, value: /api/v1/health}
        template: gke-policies.yaml
        documentIndex: 0
      - equal: {path: 'spec.template.spec.containers[0].readinessProbe.httpGet.path', value: /api/v1/health}
        template: backend-deployment.yaml
      - equal: {path: spec.default.config.httpHealthCheck.requestPath, value: /api/healthz}
        template: gke-policies.yaml
        documentIndex: 2
      - equal: {path: 'spec.template.spec.containers[0].readinessProbe.httpGet.path', value: /api/healthz}
        template: frontend-deployment.yaml
