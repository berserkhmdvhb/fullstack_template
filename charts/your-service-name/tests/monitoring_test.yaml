suite: the monitoring flavour and the dedicated metrics port
release:
  name: svc
  namespace: app
templates:
  - servicemonitor.yaml
  - prometheusrule.yaml
  - podmonitoring.yaml
  - gmp-rules.yaml
  - gmp-cluster-rules.yaml
  - validate-values.yaml
  - services.yaml
  - backend-deployment.yaml
  - configmap.yaml
  - network-policy.yaml
tests:
  - it: nothing monitor-shaped renders by default
    asserts:
      - hasDocuments: {count: 0}
        template: servicemonitor.yaml
      - hasDocuments: {count: 0}
        template: prometheusrule.yaml
      - hasDocuments: {count: 0}
        template: podmonitoring.yaml
      - hasDocuments: {count: 0}
        template: gmp-rules.yaml

  - it: prometheus-operator renders the ServiceMonitor and the PrometheusRule, and no GMP object
    set: {monitoring: {serviceMonitor: true, prometheusRule: true}}
    asserts:
      - isKind: {of: ServiceMonitor}
        template: servicemonitor.yaml
      - equal: {path: 'spec.endpoints[0].port', value: metrics}
        template: servicemonitor.yaml
      - equal: {path: 'spec.endpoints[0].path', value: /metrics}
        template: servicemonitor.yaml
      - isKind: {of: PrometheusRule}
        template: prometheusrule.yaml
      - hasDocuments: {count: 0}
        template: podmonitoring.yaml
      - hasDocuments: {count: 0}
        template: gmp-rules.yaml

  - it: gmp renders the PodMonitoring and the Rules, and no operator object
    set: {monitoring: {flavour: gmp, serviceMonitor: true, prometheusRule: true}}
    asserts:
      - hasDocuments: {count: 0}
        template: servicemonitor.yaml
      - hasDocuments: {count: 0}
        template: prometheusrule.yaml
      - isKind: {of: PodMonitoring}
        template: podmonitoring.yaml
      - equal: {path: apiVersion, value: monitoring.googleapis.com/v1}
        template: podmonitoring.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: your-service-name
            app.kubernetes.io/instance: svc
            app.kubernetes.io/component: backend
        template: podmonitoring.yaml
      - equal: {path: 'spec.endpoints[0].port', value: metrics}
        template: podmonitoring.yaml
      - equal: {path: 'spec.endpoints[0].path', value: /metrics}
        template: podmonitoring.yaml
      - equal: {path: 'spec.endpoints[0].interval', value: 30s}
        template: podmonitoring.yaml
      - isKind: {of: Rules}
        template: gmp-rules.yaml
      - equal: {path: apiVersion, value: monitoring.googleapis.com/v1}
        template: gmp-rules.yaml

  - it: the flavour is an enum
    set: {monitoring: {flavour: datadog}}
    asserts:
      - failedTemplate: {errorPattern: one of}
        template: servicemonitor.yaml

  - it: the backend Service names the metrics port, and the annotations point at it
    asserts:
      - contains:
          path: spec.ports
          content: {name: metrics, port: 9102, targetPort: metrics, protocol: TCP}
        template: services.yaml
        documentIndex: 0
      - equal: {path: 'metadata.annotations["prometheus.io/port"]', value: "9102"}
        template: services.yaml
        documentIndex: 0

  - it: the backend Pod declares the metrics port and the ConfigMap value moves it
    set: {config: {METRICS_PORT: "9500"}}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: metrics, containerPort: 9500, protocol: TCP}
        template: backend-deployment.yaml

  - it: the scrape rule admits the collector to the metrics port only, never the API port
    template: network-policy.yaml
    documentSelector: {path: metadata.name, value: svc-your-service-name-allow-to-backend}
    asserts:
      - lengthEqual: {path: 'spec.ingress[2].ports', count: 1}
      - equal: {path: 'spec.ingress[2].ports[0].port', value: 9102}
      - notContains:
          path: spec.ingress[2].ports
          content: {protocol: TCP, port: 8000}

  - it: gmp defaults the peers to the gmp-system collector
    set: {monitoring: {flavour: gmp}}
    template: network-policy.yaml
    documentSelector: {path: metadata.name, value: svc-your-service-name-allow-to-backend}
    asserts:
      - equal:
          path: 'spec.ingress[2]'
          value:
            from:
              - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gmp-system}}
                podSelector: {matchLabels: {app.kubernetes.io/name: collector}}
            ports: [{protocol: TCP, port: 9102}]

  - it: explicit selectors replace the flavour defaults
    set:
      monitoring: {flavour: gmp}
      networkPolicy:
        monitoringNamespaceSelector: {kubernetes.io/metadata.name: gke-gmp-system}
        monitoringPodSelector: {app.kubernetes.io/name: collector, extra: "yes"}
    template: network-policy.yaml
    documentSelector: {path: metadata.name, value: svc-your-service-name-allow-to-backend}
    asserts:
      - equal:
          path: 'spec.ingress[2]'
          value:
            from:
              - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: gke-gmp-system}}
                podSelector: {matchLabels: {app.kubernetes.io/name: collector, extra: "yes"}}
            ports: [{protocol: TCP, port: 9102}]

  - it: monitoringExtraPeers empty - the scrape rule holds the collector peer only
    template: network-policy.yaml
    documentSelector: {path: metadata.name, value: svc-your-service-name-allow-to-backend}
    asserts:
      - lengthEqual: {path: 'spec.ingress[2].from', count: 1}

  - it: monitoringExtraPeers are admitted on the metrics port only, next to the collector peer
    set:
      networkPolicy:
        monitoringExtraPeers:
          - ipBlock: {cidr: 10.20.0.0/24}
    template: network-policy.yaml
    documentSelector: {path: metadata.name, value: svc-your-service-name-allow-to-backend}
    asserts:
      - equal:
          path: 'spec.ingress[2]'
          value:
            from:
              - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
                podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
              - ipBlock: {cidr: 10.20.0.0/24}
            ports: [{protocol: TCP, port: 9102}]

  - it: monitoringExtraPeers still render when the collector selector is null, on the metrics port
    set:
      networkPolicy:
        monitoringNamespaceSelector: null
        monitoringExtraPeers:
          - ipBlock: {cidr: 10.20.0.0/24}
    template: network-policy.yaml
    documentSelector: {path: metadata.name, value: svc-your-service-name-allow-to-backend}
    asserts:
      - equal:
          path: 'spec.ingress[2]'
          value:
            from: [{ipBlock: {cidr: 10.20.0.0/24}}]
            ports: [{protocol: TCP, port: 9102}]

  - it: no scrape target - the extra peers render nothing
    set:
      monitoring: {scrapeAnnotations: false}
      networkPolicy:
        monitoringExtraPeers:
          - ipBlock: {cidr: 10.20.0.0/24}
    template: network-policy.yaml
    documentSelector: {path: metadata.name, value: svc-your-service-name-allow-to-backend}
    asserts:
      - lengthEqual: {path: spec.ingress, count: 2}

  - it: gmp Rules hold the app groups only (the backend's own metrics in the app namespace)
    set: {monitoring: {flavour: gmp, prometheusRule: true}}
    template: gmp-rules.yaml
    asserts:
      - lengthEqual: {path: spec.groups, count: 1}
      - equal: {path: 'spec.groups[0].name', value: app-health}
      - matchRegex: {path: 'spec.groups[0].rules[0].expr', pattern: 'http_requests_total'}
      - notMatchRegex: {path: 'spec.groups[0].rules[0].expr', pattern: 'kube_'}

  - it: ClusterRules are off by default, even with the gmp flavour
    set: {monitoring: {flavour: gmp, prometheusRule: true}}
    template: gmp-cluster-rules.yaml
    asserts:
      - hasDocuments: {count: 0}

  - it: ClusterRules render with gmp and the switch, cluster-scoped, with the kube groups
    set: {monitoring: {flavour: gmp, gmp: {clusterRules: {enabled: true}}}}
    template: gmp-cluster-rules.yaml
    asserts:
      - isKind: {of: ClusterRules}
      - equal: {path: apiVersion, value: monitoring.googleapis.com/v1}
      - notExists: {path: metadata.namespace}
      - lengthEqual: {path: spec.groups, count: 4}
      - equal: {path: 'spec.groups[0].name', value: pod-health}
      - equal: {path: 'spec.groups[1].name', value: resource-usage}
      - equal: {path: 'spec.groups[2].name', value: service-health}
      - equal: {path: 'spec.groups[3].name', value: database-health}
      - matchRegex: {path: 'spec.groups[0].rules[0].expr', pattern: 'kube_pod_container_status_restarts_total\{exported_namespace="app"'}

  - it: the object namespace label is configurable and used in every kube_ selector
    set:
      monitoring:
        flavour: gmp
        gmp: {clusterRules: {enabled: true}, objectNamespaceLabel: kube_namespace}
    template: gmp-cluster-rules.yaml
    asserts:
      - matchRegex: {path: 'spec.groups[0].rules[0].expr', pattern: 'kube_namespace="app"'}
      - matchRegex: {path: 'spec.groups[1].rules[0].expr', pattern: 'kube_pod_container_resource_limits\{kube_namespace="app"'}
      - matchRegex: {path: 'spec.groups[3].rules[1].expr', pattern: 'kube_job_failed\{kube_namespace="app-db"'}
      - notMatchRegex: {path: 'spec.groups[0].rules[0].expr', pattern: 'exported_namespace'}

  - it: ClusterRules never render for the operator flavour
    set: {monitoring: {gmp: {clusterRules: {enabled: true}}}}
    template: gmp-cluster-rules.yaml
    asserts:
      - hasDocuments: {count: 0}

  - it: the operator PrometheusRule keeps the namespace label and holds every group
    set: {monitoring: {prometheusRule: true}}
    template: prometheusrule.yaml
    asserts:
      - lengthEqual: {path: spec.groups, count: 5}
      - equal: {path: 'spec.groups[0].name', value: pod-health}
      - equal: {path: 'spec.groups[1].name', value: resource-usage}
      - equal: {path: 'spec.groups[2].name', value: service-health}
      - equal: {path: 'spec.groups[3].name', value: database-health}
      - equal: {path: 'spec.groups[4].name', value: app-health}
      - matchRegex: {path: 'spec.groups[0].rules[0].expr', pattern: 'kube_pod_container_status_restarts_total\{namespace="app"'}
      - matchRegex: {path: 'spec.groups[3].rules[1].expr', pattern: 'kube_job_failed\{namespace="app-db", job_name'}
      - notMatchRegex: {path: 'spec.groups[0].rules[0].expr', pattern: 'exported_namespace'}

  - it: the schema refuses an unknown gmp key
    set: {monitoring: {gmp: {clusterRule: {enabled: true}}}}
    template: gmp-cluster-rules.yaml
    asserts:
      - failedTemplate: {}

  - it: the render refuses a metrics port that is the API port
    set: {config: {METRICS_PORT: "8000"}}
    template: validate-values.yaml
    asserts:
      - failedTemplate: {errorPattern: METRICS_PORT}

  - it: the render refuses a metrics port that is the Cloud SQL proxy health port when the proxy is on
    set:
      config: {METRICS_PORT: "9090"}
      postgresql: {enabled: false}
      cloudSqlProxy:
        enabled: true
        instanceConnectionName: proj:region:inst
        egressCIDRs: [199.36.153.8/30]
    template: validate-values.yaml
    asserts:
      - failedTemplate: {errorPattern: METRICS_PORT}

  - it: the proxy health port is no clash when the proxy is off
    set: {config: {METRICS_PORT: "9090"}}
    template: validate-values.yaml
    asserts:
      - notFailedTemplate: {}
