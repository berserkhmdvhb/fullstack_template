suite: edge values schema
release:
  name: svc
  namespace: app
templates:
  - httproute.yaml
tests:
  - it: rejects an unknown mode
    set: {edge: {mode: nginx}}
    asserts:
      - failedTemplate: {}
  - it: rejects a route with an unknown service
    set:
      edge:
        routes: [{path: /x, match: PathPrefix, service: database}]
    asserts:
      - failedTemplate: {}
  - it: rejects a route with an unknown key
    set:
      edge:
        routes: [{path: /x, match: PathPrefix, service: backend, rewrite: /y}]
    asserts:
      - failedTemplate: {}
  - it: rejects the retired top-level ingress block
    set: {ingress: {enabled: true}}
    asserts:
      - failedTemplate: {}
  - it: rejects an unknown host role
    set: {edge: {hosts: {admin: admin.your-domain.example}}}
    asserts:
      - failedTemplate: {}
  - it: rejects the retired app host
    set: {edge: {hosts: {app: svc-app.example.org}}}
    asserts:
      - failedTemplate: {}
  - it: rejects an empty root host
    set: {edge: {hosts: {root: ""}}}
    asserts:
      - failedTemplate: {}
  - it: rejects a missing root host
    set: {edge: {hosts: {root: null}}}
    asserts:
      - failedTemplate: {}
  - it: accepts an empty api host (no api host)
    set: {edge: {hosts: {api: ""}}}
    asserts:
      - notFailedTemplate: {}
  - it: rejects a path with whitespace
    set:
      edge:
        routes: [{path: "/a b", match: PathPrefix, service: backend}]
    asserts:
      - failedTemplate: {}
  - it: rejects a DNS selector value that is not a string
    set: {networkPolicy: {dns: {namespaceSelector: {team: [a]}}}}
    asserts:
      - failedTemplate: {}
  - it: rejects an unknown GKE policy key (no invented provider field)
    set: {edge: {gateway: {gke: {cdn: true}}}}
    asserts:
      - failedTemplate: {}
  - it: rejects a log sample rate above 1000000
    set: {edge: {gateway: {gke: {logging: {sampleRate: 1000001}}}}}
    asserts:
      - failedTemplate: {}
  - it: rejects the removed log-collector values
    set: {monitoring: {logging: true}}
    asserts:
      - failedTemplate: {}
  - it: rejects an edge peer that is not an object
    set: {edge: {extraPeers: [10.0.0.0/8]}}
    asserts:
      - failedTemplate: {}
  - it: rejects a non-boolean placeholder guard
    set: {guards: {rejectPlaceholders: "yes"}}
    asserts:
      - failedTemplate: {}
  - it: rejects a monitoring selector that is neither an object nor null
    set: {networkPolicy: {monitoringNamespaceSelector: monitoring}}
    asserts:
      - failedTemplate: {}
  - it: rejects a malformed image digest in any environment
    set: {cloudSqlProxy: {image: {digest: latest}}}
    asserts:
      - failedTemplate: {}
  - it: accepts an empty image digest (the tag is used)
    set: {images: {backend: {digest: ""}}}
    asserts:
      - notFailedTemplate: {}
