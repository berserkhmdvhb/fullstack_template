suite: edge mode gateway (the default)
release:
  name: svc
  namespace: app
templates:
  - httproute.yaml
  - ingress.yaml
  - services.yaml
tests:
  - it: renders one HTTPRoute, on the root host, and no Ingress
    asserts:
      - hasDocuments:
          count: 1
        template: httproute.yaml
      - hasDocuments:
          count: 0
        template: ingress.yaml
      - isKind:
          of: HTTPRoute
        template: httproute.yaml
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
        template: httproute.yaml

  - it: the root host serves every route, in list order, and no other host renders
    template: httproute.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: svc-your-service-name-root
      - equal:
          path: metadata.namespace
          value: app
      - equal:
          path: spec.hostnames
          value: [your-service-name.your-domain.example]
      - equal:
          path: spec.parentRefs
          value:
            - name: your-gateway
              namespace: gateway-system
      - lengthEqual:
          path: spec.rules
          count: 4
      - equal:
          path: spec.rules[3]
          value:
            matches: [{path: {type: PathPrefix, value: /}}]
            backendRefs: [{name: svc-your-service-name-frontend, port: 3000}]
      - matchSnapshot: {}

  - it: an api host adds an HTTPRoute with the backend routes only
    set:
      edge:
        hosts: {api: svc-api.example.org}
    template: httproute.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: svc-your-service-name-root
        documentIndex: 0
      - equal:
          path: metadata.name
          value: svc-your-service-name-api
        documentIndex: 1
      - equal:
          path: spec.hostnames
          value: [svc-api.example.org]
        documentIndex: 1
      - equal:
          path: spec.rules
          value:
            - matches: [{path: {type: PathPrefix, value: /api}}]
              backendRefs: [{name: svc-your-service-name-backend, port: 8000}]
            - matches: [{path: {type: PathPrefix, value: /docs}}]
              backendRefs: [{name: svc-your-service-name-backend, port: 8000}]
            - matches: [{path: {type: Exact, value: /openapi.json}}]
              backendRefs: [{name: svc-your-service-name-backend, port: 8000}]
        documentIndex: 1
      - matchSnapshot: {}
        documentIndex: 1

  - it: timeouts render only when set
    template: httproute.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.rules[0].timeouts
  - it: timeouts land on every rule when set
    template: httproute.yaml
    documentIndex: 0
    set:
      edge:
        gateway:
          timeouts: {request: 120s, backendRequest: 100s}
    asserts:
      - equal:
          path: spec.rules[0].timeouts
          value: {request: 120s, backendRequest: 100s}
      - equal:
          path: spec.rules[3].timeouts
          value: {request: 120s, backendRequest: 100s}

  - it: parentRefs come from values, with an optional sectionName
    template: httproute.yaml
    documentIndex: 0
    set:
      edge:
        gateway:
          parentRefs:
            - {name: shared, namespace: infra, sectionName: https}
    asserts:
      - equal:
          path: spec.parentRefs
          value:
            - {name: shared, namespace: infra, sectionName: https}

  - it: a custom route shows up on the root and api hosts (a backend route)
    set:
      edge:
        hosts: {api: svc-api.example.org}
        routes:
          - {path: /api, match: PathPrefix, service: backend}
          - {path: /healthz, match: Exact, service: backend}
          - {path: /, match: PathPrefix, service: frontend}
    asserts:
      - contains:
          path: spec.rules
          content:
            matches: [{path: {type: Exact, value: /healthz}}]
            backendRefs: [{name: svc-your-service-name-backend, port: 8000}]
        template: httproute.yaml
        documentIndex: 0
      - contains:
          path: spec.rules
          content:
            matches: [{path: {type: Exact, value: /healthz}}]
            backendRefs: [{name: svc-your-service-name-backend, port: 8000}]
        template: httproute.yaml
        documentIndex: 1
      - lengthEqual:
          path: spec.rules
          count: 2
        template: httproute.yaml
        documentIndex: 1

  - it: the WAF switch moves the backend routes to the WAF Service and its port
    set:
      waf:
        enabled: true
    template: httproute.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.rules[0].backendRefs
          value: [{name: svc-your-service-name-waf, port: 8080}]
      - equal:
          path: spec.rules[2].backendRefs
          value: [{name: svc-your-service-name-waf, port: 8080}]

  - it: the route port and the Service port come from the same config value
    set:
      config:
        BACKEND_PORT: "9000"
        FRONTEND_PORT: "4000"
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 9000
        template: httproute.yaml
        documentIndex: 0
      - equal:
          path: spec.rules[3].backendRefs[0].port
          value: 4000
        template: httproute.yaml
        documentIndex: 0
      - equal:
          path: spec.ports[0].port
          value: 9000
        template: services.yaml
        documentIndex: 0
      - equal:
          path: spec.ports[0].port
          value: 4000
        template: services.yaml
        documentIndex: 1

  - it: a backend-only list renders on the root host and no frontend route anywhere
    set:
      edge:
        hosts: {api: svc-api.example.org}
        routes:
          - {path: /api, match: PathPrefix, service: backend}
    asserts:
      - hasDocuments:
          count: 2
        template: httproute.yaml
      - equal:
          path: spec.hostnames
          value: [your-service-name.your-domain.example]
        template: httproute.yaml
        documentIndex: 0
      - equal:
          path: spec.hostnames
          value: [svc-api.example.org]
        template: httproute.yaml
        documentIndex: 1

  - it: a frontend-only list renders no api HTTPRoute even when the api host is set
    set:
      edge:
        hosts: {api: svc-api.example.org}
        routes:
          - {path: /, match: PathPrefix, service: frontend}
    asserts:
      - hasDocuments:
          count: 1
        template: httproute.yaml
      - equal:
          path: spec.hostnames
          value: [your-service-name.your-domain.example]
        template: httproute.yaml
        documentIndex: 0

  - it: an empty routes list renders no HTTPRoute
    set:
      edge:
        routes: []
    asserts:
      - hasDocuments:
          count: 0
        template: httproute.yaml

  - it: a path with a colon or a hash renders exactly (the path is quoted)
    template: httproute.yaml
    documentIndex: 0
    set:
      edge:
        routes:
          - {path: '/a:', match: Exact, service: backend}
          - {path: '/a#b', match: Exact, service: backend}
    asserts:
      - equal:
          path: spec.rules
          value:
            - matches: [{path: {type: Exact, value: '/a:'}}]
              backendRefs: [{name: svc-your-service-name-backend, port: 8000}]
            - matches: [{path: {type: Exact, value: '/a#b'}}]
              backendRefs: [{name: svc-your-service-name-backend, port: 8000}]
