suite: the deploy-time placeholder guard (guards.rejectPlaceholders)
release:
  name: svc
  namespace: app
templates:
  - validate-values.yaml
set:
  secrets: {dbPassword: not-a-real-password}
tests:
  - it: off by default - the placeholders render
    asserts:
      - notFailedTemplate: {}

  - it: on - the placeholder Gateway is refused in gateway mode
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {root: svc.test}
    asserts:
      - failedTemplate:
          errorPattern: 'edge\.gateway\.parentRefs names the placeholder Gateway "your-gateway"'

  # The placeholder domain is written with an escaped dot ("\x2e"): infra/adapt/adopt.sh stamps the
  # adopter's domain over the literal text, and these inputs must stay the template's placeholder in an
  # adopted copy too.
  - it: on - a placeholder host is refused
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {root: "app.your-domain\x2eexample"}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - failedTemplate:
          errorPattern: 'edge\.hosts\.root is "app\.your-domain[.]example", which still holds the placeholder domain your-domain[.]example'

  - it: on - real values render
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {root: svc.test}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - notFailedTemplate: {}

  - it: on - the placeholder Gateway does not matter outside gateway mode
    set:
      guards: {rejectPlaceholders: true}
      edge:
        mode: tunnel
        hosts: {root: svc.test}
    asserts:
      - notFailedTemplate: {}

  - it: on - a host that only contains the placeholder text is not a placeholder
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.notyour-domain.example.com, root: "your-domain\x2eexample.svc.test"}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - notFailedTemplate: {}

  - it: on - the bare placeholder domain is refused
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {root: "your-domain\x2eexample"}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - failedTemplate:
          errorPattern: 'edge\.hosts\.root is "your-domain[.]example"'

  # Whether each committed values.<env>.yaml still holds the placeholder hosts, and so is refused, is
  # tests/backend/test_chart_production_guard.py's: the answer is yes in the template, no once adopted.
  # The schema refuses these before the guard runs: a host is lower case, without a trailing dot.
  - it: on - a host with upper case is refused by the schema
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.Example.Org, root: svc.test}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - failedTemplate:
          errorPattern: "'/edge/hosts/api': .* does not match pattern"

  - it: on - a host with a trailing dot is refused by the schema
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.example.org., root: svc.test.}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - failedTemplate:
          errorPattern: "'/edge/hosts/root': .* does not match pattern"

  - it: the production rules do not apply elsewhere - values.local.yaml (no digest, in-cluster database, AUTH_MODE none, one replica) renders
    values: [../values.local.yaml]
    asserts:
      - notFailedTemplate: {}
