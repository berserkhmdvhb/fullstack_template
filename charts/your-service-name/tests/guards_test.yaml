suite: the deploy-time placeholder guard (guards.rejectPlaceholders)
release:
  name: svc
  namespace: app
templates:
  - validate-values.yaml
set:
  secrets: {dbPassword: not-a-real-password}
tests:
  - it: off by default - the placeholders render
    asserts:
      - notFailedTemplate: {}

  - it: on - the placeholder Gateway is refused in gateway mode
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.svc.test, app: app.svc.test, root: svc.test}
    asserts:
      - failedTemplate:
          errorPattern: 'edge\.gateway\.parentRefs names the placeholder Gateway "your-gateway"'

  - it: on - a placeholder host is refused
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.svc.test, app: app.your-domain.example, root: svc.test}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - failedTemplate:
          errorPattern: 'edge\.hosts\.app is "app\.your-domain\.example", which still holds the placeholder domain your-domain\.example'

  - it: on - real values render
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.svc.test, app: app.svc.test, root: svc.test}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - notFailedTemplate: {}

  - it: on - the placeholder Gateway does not matter outside gateway mode
    set:
      guards: {rejectPlaceholders: true}
      edge:
        mode: tunnel
        hosts: {api: api.svc.test, app: app.svc.test, root: svc.test}
    asserts:
      - notFailedTemplate: {}

  - it: on - a host that only contains the placeholder text is not a placeholder
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.notyour-domain.example.com, app: app.svc.test, root: your-domain.example.svc.test}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - notFailedTemplate: {}

  - it: on - the bare placeholder domain is refused
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.svc.test, app: app.svc.test, root: your-domain.example}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - failedTemplate:
          errorPattern: 'edge\.hosts\.root is "your-domain\.example"'

  - it: on - values.dev.yaml's placeholder hosts are refused
    values: [../values.dev.yaml]
    set:
      guards: {rejectPlaceholders: true}
      edge: {gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}}
    asserts:
      - failedTemplate:
          errorPattern: 'still holds the placeholder domain your-domain\.example'

  - it: on - values.qa.yaml's placeholder hosts are refused
    values: [../values.qa.yaml]
    set:
      guards: {rejectPlaceholders: true}
      edge: {gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}}
    asserts:
      - failedTemplate:
          errorPattern: 'still holds the placeholder domain your-domain\.example'

  - it: on - values.production.yaml's placeholder hosts are refused
    values: [../values.production.yaml]
    set:
      guards: {rejectPlaceholders: true}
      edge: {gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}}
    asserts:
      - failedTemplate:
          errorPattern: 'still holds the placeholder domain your-domain\.example'

  - it: on - a placeholder host with a trailing dot is refused
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.your-domain.example., app: app.notyour-domain.example.com, root: svc.test}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - failedTemplate:
          errorPattern: 'edge\.hosts\.api is "api\.your-domain\.example\."'

  - it: on - a real host with a trailing dot passes
    set:
      guards: {rejectPlaceholders: true}
      edge:
        hosts: {api: api.notyour-domain.example.com., app: app.svc.test., root: svc.test}
        gateway: {parentRefs: [{name: edge, namespace: gateway-system}]}
    asserts:
      - notFailedTemplate: {}

  - it: the production rules do not apply elsewhere - values.local.yaml (no digest, in-cluster database, AUTH_MODE none, one replica) renders
    values: [../values.local.yaml]
    asserts:
      - notFailedTemplate: {}
