name: Set up the backend
description: >-
  Install Python, the pinned uv (mise.toml) and the backend from uv.lock with the dev group, with the uv
  cache dir keyed on uv.lock. A stale uv.lock fails the job. The environment is .venv (callers use .venv/bin/<tool>, or make, which does).
  Input python-version (default 3.13). No outputs.
inputs:
  python-version:
    description: Python version to install.
    default: "3.13"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true
    # uv is pinned and checksum-verified by scripts/tools.sh, the same way as every other tool.
    - name: Install the pinned uv
      shell: bash
      run: |
        scripts/tools.sh install uv
    # Restored everywhere, saved only from a push to main (never from a pull request or a tag).
    - id: uv-cache
      shell: bash
      run: echo "dir=$(.tools/bin/uv cache dir)" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.uv-cache.outputs.dir }}
        key: uv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
    # The setup-python interpreter is the one uv uses; it never downloads another.
    - name: Check the lock, then install the locked backend
      shell: bash
      env:
        UV_PYTHON_DOWNLOADS: never
      run: |
        python_bin="$(command -v python)"
        .tools/bin/uv lock --check --python "$python_bin"
        .tools/bin/uv sync --locked --python "$python_bin"
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      name: Prune the uv cache
      shell: bash
      run: .tools/bin/uv cache prune --ci
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.uv-cache.outputs.dir }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
