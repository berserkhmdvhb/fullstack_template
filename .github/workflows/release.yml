name: Release

# Image operations run only from here: push to main and v* tags, never on a pull request.
# reusable-build.yml builds, pushes by digest, scans and signs; this workflow plans, then runs the
# licence check, VEX, release assets (v* tags) and deploy.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

# A release is never cancelled mid-push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SEC_OUTPUT_DIR: output/security

jobs:
  plan:
    name: Plan the images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      platform_matrix: ${{ steps.plan.outputs.platform_matrix }}
      arm64: ${{ steps.plan.outputs.arm64 }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
      immutable: ${{ steps.plan.outputs.immutable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The helper imports PyYAML and this job has no setup-python; a hashed venv supplies it.
      - name: Install PyYAML for the matrix helper
        run: |
          python3 -m venv "$RUNNER_TEMP/pyyaml"
          "$RUNNER_TEMP/pyyaml/bin/pip" install --quiet --require-hashes --no-deps -r tools/requirements/pyyaml.txt
      # The helper writes version, channel, image_tag, immutable, platform_matrix and arm64 to GITHUB_OUTPUT; the image matrix JSON is its stdout.
      # The repository variable BUILD_ARM64 turns the native arm64 builds on; unset builds linux/amd64 only.
      - name: Render the matrix and the version
        id: plan
        env:
          BUILD_ARM64: ${{ vars.BUILD_ARM64 }}
        run: |
          matrix="$("$RUNNER_TEMP/pyyaml/bin/python" .github/scripts/container_matrix.py --matrix)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo
            echo "- ref: \`${GITHUB_REF_NAME}\` (${GITHUB_REF_TYPE}), commit \`${GITHUB_SHA::7}\`"
            echo "- images: $(jq -r '[.include[].id] | join(", ")' <<<"${matrix}")"
            # The helper's arm64 output is true only when an arm64 leg is in the platform matrix.
            if [[ "$(sed -n 's/^arm64=//p' "$GITHUB_OUTPUT")" == "true" ]]; then
              echo "- arm64: built natively on arm64 runners and merged into one index per image"
            elif [[ "${BUILD_ARM64}" == "true" ]]; then
              echo "- arm64 skipped: BUILD_ARM64 is 'true' but no image lists linux/arm64 in the manifest (linux/amd64 only)"
            else
              echo "- arm64 skipped: the repository variable BUILD_ARM64 is not 'true' (linux/amd64 only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Build, scan and sign: the reusable workflow holds every image permission, so the grant is the union of its jobs.
  images:
    name: Images
    needs: plan
    permissions:
      contents: read
      packages: write  # reusable-build.yml pushes the images and attaches signatures
      security-events: write  # reusable-build.yml uploads the grype SARIF
      id-token: write  # reusable-build.yml signs keyless
      attestations: write  # reusable-build.yml records the attestations
    uses: ./.github/workflows/reusable-build.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
      platform_matrix: ${{ needs.plan.outputs.platform_matrix }}
      image_tag: ${{ needs.plan.outputs.image_tag }}
      immutable: ${{ needs.plan.outputs.immutable }}

  # A v* tag only, after every image is signed: the chart, packaged, pushed, signed and attested in its own reusable
  # workflow (the union of its job's grants). Only release-assets needs it: the deploys use the checked-out chart, so a
  # failed chart push never holds back the digests, a deploy or the VEX.
  chart:
    name: Chart
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write  # reusable-chart-release.yml pushes the chart and attaches its signature and attestation
      id-token: write  # reusable-chart-release.yml signs keyless
      attestations: write  # reusable-chart-release.yml records the chart's provenance
    uses: ./.github/workflows/reusable-chart-release.yml

  # Merge the per-image digests into image-digests.env and scan.env, as the old verify job did.
  digests:
    name: Image digests
    needs: [plan, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.merge.outputs.digests }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: parts
      - name: Write image-digests.env and scan.env
        id: merge
        run: |
          set -euo pipefail
          cat parts/*.digest.env | LC_ALL=C sort > image-digests.env
          cat parts/*.scan.env | LC_ALL=C sort > scan.env
          # The same digests as one JSON object, for the deploy workflow.
          echo "digests=$(jq -Rn -c '[inputs | split("=") | {(.[0]): .[1]}] | add' image-digests.env)" >> "$GITHUB_OUTPUT"
          {
            echo "### Images and digests (tag \`${IMAGE_TAG}\`)"
            echo
            echo '```'
            cat image-digests.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests
          path: |
            image-digests.env
            scan.env
          retention-days: 90

  # Advisory: findings become a warning and a summary line; only a tool error fails the job.
  grant:
    name: Licences (grant, advisory)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sbom-artifacts
      # Only each artifact's image SBOM, by its exact name, saved as <id>.<platform>.image.sbom.cdx.json.
      - name: Gather the SBOMs
        run: |
          set -euo pipefail
          mkdir -p "${SEC_OUTPUT_DIR}/sbom"
          for dir in sbom-artifacts/*/; do
            name="$(basename "${dir}")"
            name="${name#sbom-}"
            cp "${dir}${name%%.*}.image.sbom.cdx.json" "${SEC_OUTPUT_DIR}/sbom/${name}.image.sbom.cdx.json"
          done
      - name: Install grant
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          bash infra/security/tools-install.sh grant "$(yq -r '.tools.grant' infra/security/config.yaml)" "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Check the licences
        run: |
          rc=0
          bash infra/security/scan-licenses.sh -q -s "${SEC_OUTPUT_DIR}/sbom" -O "${SEC_OUTPUT_DIR}" -c infra/security/grant.yaml || rc=$?
          if [[ ! -f "${SEC_OUTPUT_DIR}/grant/summary.json" ]]; then
            echo "::error::grant failed to produce a report (exit ${rc})"
            echo "- grant: tool error (exit ${rc})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if (( rc != 0 )); then
            echo "::warning::licence findings in the image SBOMs (advisory); see the grant report"
            echo "- grant: licence findings (advisory)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- grant: no licence findings" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grant-report
          path: ${{ env.SEC_OUTPUT_DIR }}/grant/
          retention-days: 90

  # Advisory: an OpenVEX document from the Grype findings (affected, plus the reviewed not_affected list), pinned by image digest.
  vex:
    name: VEX (advisory)
    needs: [digests, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: grype-*
          path: grype-artifacts
      # The statements are pinned by the index digest, so the per-platform findings of an image become one report.
      - name: Merge the per-platform Grype reports
        run: |
          set -euo pipefail
          mkdir -p "${SEC_OUTPUT_DIR}/grype"
          while IFS= read -r report; do
            jq -s '{
              matches: (map(.matches) | add | unique_by([.vulnerability.id, .artifact.name, .artifact.version, .artifact.type])),
              ignoredMatches: (map(.ignoredMatches // []) | add | unique_by([.vulnerability.id, .artifact.name, .artifact.version, .artifact.type]))
            }' grype-artifacts/*/"${report}" > "${SEC_OUTPUT_DIR}/grype/${report}"
          done < <(find grype-artifacts -name '*.image.vuln.grype.json' -printf '%f\n' | LC_ALL=C sort -u)
      - name: Generate the VEX document
        run: |
          bash infra/security/generate-vex.sh "${SEC_OUTPUT_DIR}" scan.env image-digests.env
          n="$(jq '.statements | length' "${SEC_OUTPUT_DIR}/vex/openvex.json")"
          if (( n == 0 )); then
            echo "::warning::VEX has no statements (no findings, or the grype reports are missing)"
          fi
          echo "- VEX: ${n} statement(s) (advisory)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vex
          path: ${{ env.SEC_OUTPUT_DIR }}/vex/
          retention-days: 90

  # Deploys by digest after the images job: the blocking grype gate and the signing, only when vars.DEPLOY_ENABLED is 'true'; the called workflow holds the guards.
  deploy:
    name: Deploy
    needs: [plan, digests, images]
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation (OIDC token for the cloud login)
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      image_tag: ${{ needs.plan.outputs.image_tag }}
      immutable: ${{ needs.plan.outputs.immutable }}
      digests: ${{ needs.digests.outputs.digests }}

  # A v* tag only: the SBOMs, the OpenVEX document, the licence report, the image and chart digests and provenance.md
  # (the signed digests and how to verify them) go to the draft GitHub Release.
  # The digests (image-digests.env, scan.env) outlive the workflow artifact; the weekly re-scan reads them.
  # The release is never published here; immutable releases reject assets added after publication.
  release-assets:
    name: Release assets (draft)
    needs: [images, digests, grant, vex, chart]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.images.result == 'success' && needs.digests.result == 'success' && needs.grant.result == 'success' && needs.vex.result == 'success' && needs.chart.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # create or update the draft release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: assets/sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vex
          path: assets/vex
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grant-report
          path: assets/grant
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digests
          path: assets/digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: assets/chart
      # ATTESTED: the guard of the attestation steps in reusable-build.yml, so the text never claims a skipped one.
      - name: Collect the assets
        env:
          ATTESTED: ${{ github.event.repository.visibility == 'public' || vars.ATTESTATIONS_ENABLED == 'true' }}
        run: |
          mkdir release-assets
          # Only each artifact's image SBOM, by its exact name (image ids hold no dot), named after the artifact, so no two files collide.
          for dir in assets/sbom/*/; do
            name="$(basename "${dir}")"
            name="${name#sbom-}"
            cp "${dir}${name%%.*}.image.sbom.cdx.json" "release-assets/${name}.image.sbom.cdx.json"
          done
          cp assets/vex/openvex.json assets/grant/*.license.grant.json release-assets/
          cp assets/grant/summary.json release-assets/licence-summary.json
          cp assets/digests/image-digests.env assets/digests/scan.env assets/chart/chart.env release-assets/
          # provenance.md: every signed digest (each image's index, the chart) and how to verify it. The images are
          # signed by reusable-build.yml, the chart by reusable-chart-release.yml.
          workflow="${GH_REPO}/.github/workflows/reusable-build.yml"
          chart_workflow="${GH_REPO}/.github/workflows/reusable-chart-release.yml"
          chart_ref="$(sed -n 's/^CHART=//p' assets/chart/chart.env)@$(sed -n 's/^CHART_DIGEST=//p' assets/chart/chart.env)"
          verify() { # reference, signing workflow
            echo '```'
            if [[ "${ATTESTED}" == "true" ]]; then
              echo "gh attestation verify oci://$1 --repo ${GH_REPO} --signer-workflow $2"
            fi
            echo "cosign verify $1 --certificate-identity https://github.com/$2@refs/tags/${TAG} --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository ${GH_REPO}"
            echo '```'
          }
          {
            echo "# Provenance of ${TAG}"
            echo
            if [[ "${ATTESTED}" == "true" ]]; then
              echo "Signed keyless and attested by \`${workflow}@refs/tags/${TAG}\` (the images) and \`${chart_workflow}@refs/tags/${TAG}\` (the chart). All attestations: https://github.com/${GH_REPO}/attestations"
            else
              echo "Signed keyless by \`${workflow}@refs/tags/${TAG}\` (the images) and \`${chart_workflow}@refs/tags/${TAG}\` (the chart). Not attested: the repository is not public and ATTESTATIONS_ENABLED is not true."
            fi
            echo
            while IFS='=' read -r key digest; do
              ref="$(sed -n "s/^${key%_DIGEST}=//p" assets/digests/scan.env)"
              echo "- image \`${ref%:*}@${digest}\`"
            done < assets/digests/image-digests.env
            echo "- chart \`${chart_ref}\` (version $(sed -n 's/^CHART_VERSION=//p' assets/chart/chart.env))"
            echo
            echo "Verify an image (replace REF with an image reference above):"
            echo
            verify REF "${workflow}"
            echo
            echo "Verify the chart:"
            echo
            verify "${chart_ref}" "${chart_workflow}"
          } > release-assets/provenance.md
          echo "- provenance.md lists $(grep -c '^- ' release-assets/provenance.md) signed digest(s)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the draft release
        run: |
          set -euo pipefail
          # Several releases can share a tag (drafts can), so select them all and decide on the set.
          releases="$(gh api "repos/${GH_REPO}/releases" --paginate | jq -s -c --arg tag "${TAG}" '[.[][] | select(.tag_name == $tag)]')"
          published="$(jq '[.[] | select(.draft | not)] | length' <<<"${releases}")"
          drafts="$(jq '[.[] | select(.draft)] | length' <<<"${releases}")"
          if (( published > 0 )); then
            echo "::error::release ${TAG} is already published; assets can no longer be added to it"
            exit 1
          fi
          if (( drafts > 1 )); then
            echo "::error::${drafts} draft releases share the tag ${TAG}; delete the extra ones and re-run"
            exit 1
          fi
          if (( drafts == 0 )); then
            gh release create "${TAG}" --draft --verify-tag --title "${TAG}" --notes "Draft: assets attached by the release workflow."
          fi
          gh release upload "${TAG}" release-assets/* --clobber
          echo "- ${TAG}: $(find release-assets -type f | wc -l) asset(s) on the draft release" >> "$GITHUB_STEP_SUMMARY"
