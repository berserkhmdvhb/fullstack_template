name: Release

# Image operations run only here: push to main and v* tags, never on a pull request.
# Build and push, verify the pushed digest, then SBOM, vulnerability scan, licence check and VEX.
# Signing and attestations arrive in a later change.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

# A release is never cancelled mid-push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SEC_OUTPUT_DIR: output/security

jobs:
  plan:
    name: Plan the images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
      immutable: ${{ steps.plan.outputs.immutable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The helper writes version, channel, image_tag and immutable to GITHUB_OUTPUT; the matrix JSON is its stdout.
      - name: Render the matrix and the version
        id: plan
        run: |
          matrix="$(python3 .github/scripts/container_matrix.py --matrix)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo
            echo "- ref: \`${GITHUB_REF_NAME}\` (${GITHUB_REF_TYPE}), commit \`${GITHUB_SHA::7}\`"
            echo "- images: $(jq -r '[.include[].id] | join(", ")' <<<"${matrix}")"
          } >> "$GITHUB_STEP_SUMMARY"

  # One leg per image: build and push, then verify the pushed digest.
  build:
    name: Build and push (${{ matrix.id }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
      IMAGE_REF: ${{ matrix.repository }}:${{ needs.plan.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the build arguments
        id: args
        env:
          ENTRY: ${{ toJSON(matrix) }}
        run: |
          {
            echo "build_args<<BUILD_ARGS_EOF"
            jq -r '(.build_args // {}) | to_entries[] | "\(.key)=\(.value)"' <<<"${ENTRY}"
            echo "BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"
      # Tags follow the old pipeline: the immutable <version>-<channel>-<sha> tag, plus the mutable :latest on a release tag.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.args.outputs.build_args }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ needs.plan.outputs.immutable == 'true' && format('{0}:latest', matrix.repository) || '' }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}
      - name: Verify the pushed digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          resolved="$(docker buildx imagetools inspect "${IMAGE_REF}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${BUILD_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ || "${resolved}" != "${BUILD_DIGEST}" ]]; then
            echo "::error::digest mismatch for ${IMAGE_REF}: build=${BUILD_DIGEST} registry=${resolved}"
            exit 1
          fi
          key="$(printf '%s' "${IMAGE_ID}" | tr '[:lower:]' '[:upper:]' | sed -E 's/[^A-Z0-9_]+/_/g')"
          mkdir -p parts
          echo "${key}_IMAGE_DIGEST=${resolved}" > "parts/${IMAGE_ID}.digest.env"
          echo "${key}_IMAGE=${IMAGE_REF}" > "parts/${IMAGE_ID}.scan.env"
          echo "- \`${IMAGE_REF}\` pushed, digest \`${resolved}\` verified" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.id }}
          path: parts/
          retention-days: 90

  # Merge the per-image digests into image-digests.env and scan.env, as the old verify job did.
  digests:
    name: Image digests
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.merge.outputs.digests }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: parts
      - name: Write image-digests.env and scan.env
        id: merge
        run: |
          cat parts/*.digest.env | LC_ALL=C sort > image-digests.env
          cat parts/*.scan.env | LC_ALL=C sort > scan.env
          # The same digests as one JSON object, for the deploy workflow.
          echo "digests=$(jq -Rn -c '[inputs | split("=") | {(.[0]): .[1]}] | add' image-digests.env)" >> "$GITHUB_OUTPUT"
          {
            echo "### Images and digests (tag \`${IMAGE_TAG}\`)"
            echo
            echo '```'
            cat image-digests.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests
          path: |
            image-digests.env
            scan.env
          retention-days: 90

  # Read-only: logs in with packages: read and scans the pushed image by its verified digest.
  sbom:
    name: SBOM (${{ matrix.id }})
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read  # pull the image from ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.id }}
          path: parts
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          bash infra/security/tools-install.sh syft "$(yq -r '.tools.syft' infra/security/config.yaml)" "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Generate the CycloneDX SBOM by digest
        run: |
          bash infra/security/sbom-generate.sh -q -O "${SEC_OUTPUT_DIR}" \
            -s "parts/${IMAGE_ID}.scan.env" -d "parts/${IMAGE_ID}.digest.env"
          test -s "${SEC_OUTPUT_DIR}/sbom/${IMAGE_ID}.image.sbom.cdx.json"
          echo "- SBOM: \`${IMAGE_ID}.image.sbom.cdx.json\` (CycloneDX)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.id }}
          path: ${{ env.SEC_OUTPUT_DIR }}/sbom/
          retention-days: 90

  # Blocking: the threshold is infra/security/config.yaml policy.fail_level, read by the script.
  grype:
    name: Grype (${{ matrix.id }})
    needs: [plan, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.id }}
          path: ${{ env.SEC_OUTPUT_DIR }}/sbom
      - name: Install grype
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          bash infra/security/tools-install.sh grype "$(yq -r '.tools.grype' infra/security/config.yaml)" "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Scan the SBOM (blocking gate)
        run: |
          bash infra/security/scan-vulnerabilities.sh -q -c infra/security/grype.yaml \
            -s "${SEC_OUTPUT_DIR}/sbom" -O "${SEC_OUTPUT_DIR}"
      - name: Findings summary
        if: always()
        run: |
          report="${SEC_OUTPUT_DIR}/grype/${IMAGE_ID}.image.vuln.grype.json"
          {
            echo "### Grype: ${IMAGE_ID}"
            if [[ -f "${report}" ]]; then
              jq -r '[.matches[].vulnerability.severity] | group_by(.) | map("- \(.[0]): \(length)") | .[]' "${report}"
              echo "- total: $(jq '.matches | length' "${report}")"
            else
              echo "- no report produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Code scanning may be unavailable (private or fork without it): the upload must not turn the run red.
      - name: Upload SARIF to code scanning
        id: sarif
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.SEC_OUTPUT_DIR }}/grype/${{ matrix.id }}.image.vuln.sarif.json
          category: grype-${{ matrix.id }}
      - name: Warn when code scanning is unavailable
        if: always() && steps.sarif.outcome == 'failure'
        run: |
          echo "::warning::code scanning is not available for ${IMAGE_ID}; the findings are in the grype-${IMAGE_ID} artifact"
          echo "- SARIF upload skipped: code scanning not available; see the grype-${IMAGE_ID} artifact" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the grype reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-${{ matrix.id }}
          path: ${{ env.SEC_OUTPUT_DIR }}/grype/
          retention-days: 90

  # Advisory: findings become a warning and a summary line; only a tool error fails the job.
  grant:
    name: Licences (grant, advisory)
    needs: [sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
          path: ${{ env.SEC_OUTPUT_DIR }}/sbom
      - name: Install grant
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          bash infra/security/tools-install.sh grant "$(yq -r '.tools.grant' infra/security/config.yaml)" "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Check the licences
        run: |
          rc=0
          bash infra/security/scan-licenses.sh -q -s "${SEC_OUTPUT_DIR}/sbom" -O "${SEC_OUTPUT_DIR}" -c infra/security/grant.yaml || rc=$?
          if [[ ! -f "${SEC_OUTPUT_DIR}/grant/summary.json" ]]; then
            echo "::error::grant failed to produce a report (exit ${rc})"
            echo "- grant: tool error (exit ${rc})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if (( rc != 0 )); then
            echo "::warning::licence findings in the image SBOMs (advisory); see the grant report"
            echo "- grant: licence findings (advisory)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- grant: no licence findings" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: grant-report
          path: ${{ env.SEC_OUTPUT_DIR }}/grant/
          retention-days: 90

  # Advisory: an OpenVEX document from the fixed CVEs, pinned by image digest.
  vex:
    name: VEX (advisory)
    needs: [digests, grype]
    if: ${{ !cancelled() && needs.digests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: grype-*
          merge-multiple: true
          path: ${{ env.SEC_OUTPUT_DIR }}/grype
      - name: Generate the VEX document
        run: |
          bash infra/security/generate-vex.sh "${SEC_OUTPUT_DIR}" scan.env image-digests.env
          n="$(jq '.statements | length' "${SEC_OUTPUT_DIR}/vex/openvex.json")"
          if (( n == 0 )); then
            echo "::warning::VEX has no statements (no fixed CVEs, or the grype reports are missing)"
          fi
          echo "- VEX: ${n} statement(s) (advisory)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vex
          path: ${{ env.SEC_OUTPUT_DIR }}/vex/
          retention-days: 90

  # Deploys by digest after the blocking grype gate (and so sbom), only when vars.DEPLOY_ENABLED is 'true'; the called workflow holds the guards.
  deploy:
    name: Deploy
    needs: [plan, digests, grype]
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation (OIDC token for the cloud login)
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      image_tag: ${{ needs.plan.outputs.image_tag }}
      immutable: ${{ needs.plan.outputs.immutable }}
      digests: ${{ needs.digests.outputs.digests }}
