name: Pin drift

# Call-only: ci.yml (pull requests and pushes: only the rows a pull request changed) and pins-drift.yml
# (weekly: every row). mise.lock must hold every version mise.toml names, with a sha256 for linux-x64 and macos-arm64
# (offline), and each github: tool's locked sha256 must equal the one in its vendor's checksum file. The recorded
# sha256 of each tools/pins.tsv pin must equal the vendor's published one for that
# exact version; every entry of every hashed lock must match PyPI's published hashes and be at least 7 days old;
# the security scanners' release checksums must exist; and each pinned CRD source
# (charts/your-service-name/ci/crds/sources.tsv) must hash to its recorded sha256. Fetches retry briefly on timeouts, 429 and 5xx.
# Read-only on purpose: a bump the bot could not lock is refreshed by a maintainer with `make pins-refresh`.
on:
  workflow_call:
    inputs:
      base-sha:
        description: Check only the rows that differ from this commit; empty checks every row
        type: string
        default: ""

permissions: {}

jobs:
  pins:
    name: Pin drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The read-only job token only lifts the GitHub API rate limit (release-asset digests); it is sent nowhere else.
      - name: Check the pinned checksums against the vendors
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--check)
          if [[ -n "$BASE_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            args+=(--base "$BASE_SHA")
          fi
          scripts/pins-refresh.sh "${args[@]}"
