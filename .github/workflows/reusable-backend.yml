name: Backend

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-backend
      # The targets are called one by one: check-all-dry also runs dev-tools-outdated, a PyPI call.
      - name: Ruff format
        run: make ruff-format-check
      - name: Ruff lint
        run: make ruff-lint
      - name: Mypy
        run: make mypy-check
      - name: Environment-variable doc is current
        run: make env-docs-check
      # Blocking: the migrations rendered offline for PostgreSQL, linted by the pinned squawk (.squawk.toml).
      - name: Install the pinned squawk
        run: scripts/tools.sh install squawk
      - name: Migration SQL lint (squawk)
        run: bash scripts/ci/squawk.sh

  unit:
    name: Unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ matrix.python-version }}
      - name: Note the advisory leg
        if: matrix.python-version == '3.14'
        run: echo 'Python 3.14 is an advisory leg, so a failure on it does not block the merge.' >> "$GITHUB_STEP_SUMMARY"
      # tests/backend/test_chart_production_guard.py renders the chart; it uses .tools/bin/helm (the pin).
      - name: Install the pinned Helm
        run: scripts/tools.sh install helm4
      # The coverage floor (85 percent) is set in pyproject.toml, under [tool.coverage.report].
      - name: Unit tests with coverage
        run: make test-unit
      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-unit-py${{ matrix.python-version }}-reports
          path: |
            test-results/junit-unit.xml
            coverage.xml
          retention-days: 7
      - name: Warn that the advisory leg failed
        if: failure() && matrix.python-version == '3.14'
        run: |
          echo '::warning title=Python 3.14 (advisory)::The unit tests failed on Python 3.14. This leg is advisory and does not block the merge.'
          echo 'Python 3.14 advisory leg FAILED (not blocking).' >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # PostgreSQL 16 like the chart's in-cluster database (charts: postgresql.image), pinned by digest: the newest
    # 16.x alpine release that was at least 7 days old when pinned. Renovate updates it (github-actions manager,
    # "service" dependencies); Dependabot does not read workflow service images.
    # The password is a throwaway literal for this ephemeral container, which listens on the runner only; it
    # protects nothing and is not a secret.
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # TEST_DATABASE_URL takes precedence over DATABASE_URL (Settings); tests/conftest.py selects PostgreSQL from it.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-throwaway-not-a-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-backend
      # The suite is hermetic, but the job also boots uvicorn so it exercises the real startup path.
      - name: Integration tests
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          port="${BACKEND_PORT:-8000}"
          # The app does not migrate at startup; readiness stays 503 until the schema is at head.
          python -m your_service_name.backend.db.run_migrations
          uvicorn "${BACKEND_ENTRY:-your_service_name.backend.main:app}" --host 127.0.0.1 --port "$port" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python tests/utils/wait_for_service.py "http://127.0.0.1:$port/api/${API_VERSION:-v1}/health" 45 0.5 Backend
          make test-integration
      # Property tests from the app's OpenAPI document, on the same PostgreSQL (wiki/testing.md).
      - name: Contract tests (Schemathesis)
        run: make test-contract
      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-integration-reports
          path: |
            test-results/junit-integration.xml
          retention-days: 7

  e2e:
    name: End to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # PostgreSQL 16 like the chart's in-cluster database (charts: postgresql.image), pinned by digest: the newest
    # 16.x alpine release that was at least 7 days old when pinned. Renovate updates it (github-actions manager,
    # "service" dependencies); Dependabot does not read workflow service images.
    # The password is a throwaway literal for this ephemeral container, which listens on the runner only; it
    # protects nothing and is not a secret.
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # TEST_DATABASE_URL takes precedence over DATABASE_URL (Settings); tests/conftest.py selects PostgreSQL from it.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-throwaway-not-a-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-backend
      - name: End-to-end tests (ASGI, in process)
        run: make test-e2e
      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-e2e-reports
          path: |
            test-results/junit-e2e.xml
          retention-days: 7
