name: Docs site

# The documentation site (docs-site/, ADR-0041): the strict build and the axe scan. ci.yml calls it on every pull
# request that touches the site's inputs, and on every push to main, v* tag and manual run; docs-site.yml calls it on
# main with upload-pages, then deploys.
on:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the built site as the GitHub Pages artifact (docs-site.yml only).
        type: boolean
        default: false
      site-url:
        description: The Pages site URL (the Pages API's html_url) the site's site and base come from; empty derives them from the repository.
        type: string
        default: ""

permissions: {}

jobs:
  build:
    name: Docs site (build and axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # The repository the site's links and its Pages base path come from (docs-site/src/lib/repo.mjs).
      SITE_REPOSITORY: ${{ github.repository }}
      # A custom domain: the published URL, from docs-site.yml's pages job; empty on a pull request.
      SITE_URL: ${{ inputs.site-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The one Node version: the mise.toml entry, as in the setup-frontend action.
      - id: pin
        run: echo "node-version=$(awk -F'"' '$2=="core:node"{print $4}' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pin.outputs.node-version }}
          package-manager-cache: false
      - name: Install the pinned pnpm
        run: |
          scripts/tools.sh install pnpm
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Check the pnpm version
        working-directory: docs-site
        run: node ../frontend/scripts/check-pnpm-version.mjs
      - name: Install the site dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile
      # Mermaid renders at build time in the Playwright Chromium; the axe scan drives the same browser.
      - name: Install the Playwright system deps
        timeout-minutes: 22
        working-directory: docs-site
        run: bash "$GITHUB_WORKSPACE/scripts/ci/playwright-deps.sh"
      - name: Download the Playwright browser
        timeout-minutes: 5
        working-directory: docs-site
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" 2 10 130 pnpm exec playwright install chromium
      - name: Resolver unit tests
        working-directory: docs-site
        run: pnpm test
      # Strict: a broken link or #anchor, invalid front matter, a missing loaded file or a diagram that does
      # not render fails the build.
      - name: Build the site
        working-directory: docs-site
        run: pnpm run build
      - name: axe accessibility scan
        working-directory: docs-site
        run: pnpm run test:a11y
      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-a11y-reports
          path: |
            docs-site/test-results
            docs-site/playwright-report
          retention-days: 7
      - name: Upload the Pages artifact
        if: inputs.upload-pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  # The site's configuration guards (pins, the loaded files, the version rule on its pages), in every ci.yml call:
  # a pull request that changes the site, and every push to main, v* tag and manual run. The backend job runs them
  # too, but its path filter leaves a docs-only pull request out. Never in the Pages run (upload-pages), so the Pages
  # run restores no cache.
  guards:
    name: Docs site (configuration guards)
    if: ${{ !inputs.upload-pages }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - name: Docs site guards
        run: .venv/bin/python -m pytest -p no:cacheprovider tests/docs_site tests/test_adr_index.py
