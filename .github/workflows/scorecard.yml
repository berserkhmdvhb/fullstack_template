name: Scorecard

# OpenSSF Scorecard: an assurance report on the repository's supply-chain posture, not a merge gate.
# It publishes the result (badge, REST API) and uploads SARIF to code scanning.
# The Scorecard API refuses published results when the workflow breaks the action's restrictions:
# no top-level env or defaults, no workflow-level write permission, and in the analysis job no
# env, container or services, an Ubuntu hosted runner, no run steps, and only the approved actions.
# Meant for public repositories. A scheduled run carries no repository payload, so the guard lets it
# through; a private repository opts out by setting the repository variable SCORECARD_ENABLED to false.
on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]

permissions: {}

# A literal prefix: never ${{ github.workflow }}. A newer run replaces a queued one.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    if: vars.SCORECARD_ENABLED != 'false' && (github.event_name == 'schedule' || github.event.repository.visibility == 'public')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # the action reads the repository files
      actions: read # the action reads workflow runs and settings
      security-events: write # uploads the SARIF results to code scanning
      id-token: write # the OIDC token that authenticates the published results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
