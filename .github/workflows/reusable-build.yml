name: Build, scan, sign

# The only workflow that pushes, signs or attests images (and, on a v* tag, the chart). release.yml calls it on a push to main
# or a v* tag, never on a pull request. Order: build and push each platform by digest on its native
# runner (never under emulation), merge the platform digests into one index per image, SBOM, the
# blocking vulnerability gate and the image checks per platform, then keyless signing and
# attestations of the index, only for what passed the gate.
on:
  workflow_call:
    inputs:
      matrix:
        description: The image matrix (JSON) rendered by the plan job, one entry per image
        type: string
        required: true
      platform_matrix:
        description: The platform matrix (JSON) rendered by the plan job, one entry per image and platform
        type: string
        required: true
      image_tag:
        description: The immutable image tag
        type: string
        required: true
      immutable:
        description: "'true' on a release tag, which also moves the latest tag"
        type: string
        required: true

permissions: {}

env:
  SEC_OUTPUT_DIR: output/security

jobs:
  # One leg per (image, platform), on that platform's native runner: build and push by digest, no tag, then
  # verify the pushed digest. The merge job turns the platform digests into the image's index.
  build:
    name: Build and push (${{ matrix.id }}, ${{ matrix.platform }})
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform_matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
      SLUG: ${{ matrix.slug }}
      REPOSITORY: ${{ matrix.repository }}
      IMAGE_REF: ${{ matrix.repository }}:${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false  # the default (true) would restore the buildx binary from the Actions cache
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the build arguments
        id: args
        env:
          ENTRY: ${{ toJSON(matrix) }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VCS_REF: ${{ github.sha }}
          VCS_BRANCH: ${{ github.ref_name }}
        run: |
          # The image's created label is the commit's committer time (UTC, RFC 3339), so a rebuild of
          # the same commit carries the same label.
          created="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "${VCS_REF}")"
          {
            echo "build_args<<BUILD_ARGS_EOF"
            jq -r '(.build_args // {}) | to_entries[] | "\(.key)=\(.value)"' <<<"${ENTRY}"
            echo "SOURCE_URL=${SOURCE_URL}"
            echo "VCS_REF=${VCS_REF}"
            echo "VCS_BRANCH=${VCS_BRANCH}"
            echo "BUILD_DATE=${created}"
            echo "BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"
      # One platform per build, pushed by digest without a tag. The merge job adds the tags to the index.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.args.outputs.build_args }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ matrix.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - name: Verify the pushed digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${BUILD_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no valid digest from the build of ${REPOSITORY} (${SLUG}): ${BUILD_DIGEST}"
            exit 1
          fi
          resolved="$(docker buildx imagetools inspect "${REPOSITORY}@${BUILD_DIGEST}" --format '{{.Manifest.Digest}}')"
          if [[ "${resolved}" != "${BUILD_DIGEST}" ]]; then
            echo "::error::digest mismatch for ${REPOSITORY} (${SLUG}): build=${BUILD_DIGEST} registry=${resolved}"
            exit 1
          fi
          key="$(printf '%s' "${IMAGE_ID}" | tr '[:lower:]' '[:upper:]' | sed -E 's/[^A-Z0-9_]+/_/g')"
          mkdir -p parts
          echo "${key}_IMAGE_DIGEST=${resolved}" > "parts/${IMAGE_ID}.${SLUG}.digest.env"
          echo "${key}_IMAGE=${IMAGE_REF}" > "parts/${IMAGE_ID}.${SLUG}.scan.env"
          echo "- \`${REPOSITORY}\` ${SLUG} pushed by digest \`${resolved}\` and verified" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-${{ matrix.id }}.${{ matrix.slug }}
          path: parts/
          retention-days: 90

  # One leg per image: creates the index from the platform digests, tags it (the immutable tag, plus latest on a
  # release tag) and resolves the index digest. Everything downstream (signing, deploys) uses that digest.
  merge:
    name: Merge the platforms (${{ matrix.id }})
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write  # create the index and its tags in ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
      REPOSITORY: ${{ matrix.repository }}
      IMAGE_REF: ${{ matrix.repository }}:${{ inputs.image_tag }}
      IMMUTABLE: ${{ inputs.immutable }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-${{ matrix.id }}.*
          merge-multiple: true
          path: platform
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false  # the default (true) would restore the buildx binary from the Actions cache
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the index and tag it
        run: |
          set -euo pipefail
          sources=()
          while IFS= read -r digest; do
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no valid platform digest for ${IMAGE_ID}: ${digest}"
              exit 1
            fi
            sources+=("${REPOSITORY}@${digest}")
          done < <(cat "platform/${IMAGE_ID}".*.digest.env | sed -n 's/^[A-Z0-9_]*_IMAGE_DIGEST=//p' | LC_ALL=C sort)
          if (( ${#sources[@]} == 0 )); then
            echo "::error::no platform digests for ${IMAGE_ID}"
            exit 1
          fi
          tags=(--tag "${IMAGE_REF}")
          if [[ "${IMMUTABLE}" == "true" ]]; then
            tags+=(--tag "${REPOSITORY}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Resolve the index digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE_REF}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no valid index digest for ${IMAGE_REF}: ${digest}"
            exit 1
          fi
          key="$(printf '%s' "${IMAGE_ID}" | tr '[:lower:]' '[:upper:]' | sed -E 's/[^A-Z0-9_]+/_/g')"
          mkdir -p parts
          echo "${key}_IMAGE_DIGEST=${digest}" > "parts/${IMAGE_ID}.digest.env"
          echo "${key}_IMAGE=${IMAGE_REF}" > "parts/${IMAGE_ID}.scan.env"
          echo "- \`${IMAGE_REF}\` index of $(printf '%s\n' "platform/${IMAGE_ID}".*.digest.env | wc -l) platform(s), digest \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.id }}
          path: parts/
          retention-days: 90

  # Read-only: logs in with packages: read and scans each platform's pushed image by its verified digest.
  sbom:
    name: SBOM (${{ matrix.id }}, ${{ matrix.platform }})
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read  # pull the image from ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform_matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-${{ matrix.id }}.${{ matrix.slug }}
          path: parts
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          bash infra/security/tools-install.sh syft "$(yq -r '.tools.syft' infra/security/config.yaml)" "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Generate the CycloneDX SBOM by digest
        run: |
          bash infra/security/sbom-generate.sh -q -O "${SEC_OUTPUT_DIR}" \
            -s "parts/${IMAGE_ID}.${SLUG}.scan.env" -d "parts/${IMAGE_ID}.${SLUG}.digest.env"
          test -s "${SEC_OUTPUT_DIR}/sbom/${IMAGE_ID}.image.sbom.cdx.json"
          echo "- SBOM: \`${IMAGE_ID}.image.sbom.cdx.json\` (CycloneDX, ${SLUG})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.id }}.${{ matrix.slug }}
          path: ${{ env.SEC_OUTPUT_DIR }}/sbom/
          retention-days: 90

  # Blocking: the threshold is infra/security/config.yaml policy.fail_level, read by the script.
  grype:
    name: Grype (${{ matrix.id }}, ${{ matrix.platform }})
    needs: sbom
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform_matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.id }}.${{ matrix.slug }}
          path: ${{ env.SEC_OUTPUT_DIR }}/sbom
      - name: Install grype
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          bash infra/security/tools-install.sh grype "$(yq -r '.tools.grype' infra/security/config.yaml)" "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: Scan the SBOM (blocking gate)
        run: |
          bash infra/security/scan-vulnerabilities.sh -q -c infra/security/grype.yaml \
            -s "${SEC_OUTPUT_DIR}/sbom" -O "${SEC_OUTPUT_DIR}"
      - name: Findings summary
        if: always()
        run: |
          report="${SEC_OUTPUT_DIR}/grype/${IMAGE_ID}.image.vuln.grype.json"
          {
            echo "### Grype: ${IMAGE_ID} (${SLUG})"
            if [[ -f "${report}" ]]; then
              jq -r '[.matches[].vulnerability.severity] | group_by(.) | map("- \(.[0]): \(length)") | .[]' "${report}"
              echo "- total: $(jq '.matches | length' "${report}")"
            else
              echo "- no report produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Code scanning may be unavailable (private or fork without it): the upload must not turn the run red.
      - name: Upload SARIF to code scanning
        id: sarif
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.SEC_OUTPUT_DIR }}/grype/${{ matrix.id }}.image.vuln.sarif.json
          category: grype-${{ matrix.id }}-${{ matrix.slug }}
      - name: Warn when code scanning is unavailable
        if: always() && steps.sarif.outcome == 'failure'
        run: |
          echo "::warning::code scanning is not available for ${IMAGE_ID} (${SLUG}); the findings are in the grype-${IMAGE_ID}.${SLUG} artifact"
          echo "- SARIF upload skipped: code scanning not available; see the grype-${IMAGE_ID}.${SLUG} artifact" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the grype reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-${{ matrix.id }}.${{ matrix.slug }}
          path: ${{ env.SEC_OUTPUT_DIR }}/grype/
          retention-days: 90

  # Blocking: pulls each platform's pushed image by its verified digest (never a tag) and runs the structure checks
  # (scripts/ci/image-checks.sh --strict) on a runner of that platform's architecture, so the container runs
  # natively. sign-attest needs it, so an image that fails on any platform is never signed.
  image-checks:
    name: Image checks (${{ matrix.id }}, ${{ matrix.platform }})
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read  # pull the image from ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform_matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
      SLUG: ${{ matrix.slug }}
      REPOSITORY: ${{ matrix.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-${{ matrix.id }}.${{ matrix.slug }}
          path: parts
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image by digest and check it
        run: |
          set -euo pipefail
          DIGEST="$(sed -n "s/^[A-Z0-9_]*_IMAGE_DIGEST=//p" "parts/${IMAGE_ID}.${SLUG}.digest.env")"
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no valid digest for ${IMAGE_ID} (${SLUG}): ${DIGEST}"
            exit 1
          fi
          docker pull "${REPOSITORY}@${DIGEST}"
          bash scripts/ci/image-checks.sh --strict "${IMAGE_ID}" "${REPOSITORY}@${DIGEST}"
          echo "- image checks passed for \`${REPOSITORY}@${DIGEST}\` (${SLUG}, native)" >> "$GITHUB_STEP_SUMMARY"

  # Signs only what passed the gate: needs the blocking grype scan and the image checks of every image and platform.
  # It signs and attests the index digest, which is what deploys reference and admission verifies. The certificate
  # identity is this workflow, because a keyless certificate issued in a called workflow names it
  # (job_workflow_ref); wiki/security.md has the verify commands.
  sign-attest:
    name: Sign and attest (${{ matrix.id }})
    needs: [build, merge, sbom, grype, image-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # attach the signature and the attestations to the image in ghcr.io
      id-token: write  # the GitHub OIDC token that Sigstore turns into a signing certificate
      attestations: write  # record the build provenance and SBOM attestations
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
      REPOSITORY: ${{ matrix.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.id }}
          path: parts
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the pinned cosign
        run: |
          scripts/tools.sh install cosign
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      # The index digest: signed, verified and the provenance subject.
      - name: Read the index digest
        id: ref
        run: |
          digest="$(sed -n "s/^[A-Z0-9_]*_IMAGE_DIGEST=//p" "parts/${IMAGE_ID}.digest.env" 2>/dev/null || true)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no valid index digest for ${IMAGE_ID}: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign the image digest (keyless)
        env:
          DIGEST: ${{ steps.ref.outputs.digest }}
        run: cosign sign --yes "${REPOSITORY}@${DIGEST}"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.ref.outputs.digest }}
        run: |
          cosign verify "${REPOSITORY}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/reusable-build.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" > /dev/null
          echo "- index \`${REPOSITORY}@${DIGEST}\` signed and verified" >> "$GITHUB_STEP_SUMMARY"
      # Artifact attestations need a public repository (or GitHub Enterprise Cloud); a private one
      # opts in with the variable ATTESTATIONS_ENABLED. Signing above always runs.
      - name: Note skipped attestations
        if: ${{ !(github.event.repository.visibility == 'public' || vars.ATTESTATIONS_ENABLED == 'true') }}
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          echo "::warning::provenance and SBOM attestations skipped: the repository is not public (visibility: ${VISIBILITY}); set the variable ATTESTATIONS_ENABLED to true if its plan supports them"
          echo "- attestations skipped (not public, visibility: ${VISIBILITY}; set ATTESTATIONS_ENABLED=true to enable)" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the build provenance
        if: ${{ github.event.repository.visibility == 'public' || vars.ATTESTATIONS_ENABLED == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ steps.ref.outputs.digest }}
          push-to-registry: true

  # One leg per (image, platform), from the same matrix as the SBOM and the scans: attests that platform's SBOM
  # against its manifest digest. Runs only after the whole gate and the merge, exactly like signing, and the
  # attestations follow the same guard as the provenance. No platform is named here: the matrix decides.
  attest-sbom:
    name: Attest the SBOM (${{ matrix.id }}, ${{ matrix.platform }})
    needs: [build, merge, sbom, grype, image-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write  # attach the SBOM attestation to the image in ghcr.io
      id-token: write  # the GitHub OIDC token that Sigstore turns into a signing certificate
      attestations: write  # record the SBOM attestation
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform_matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
      SLUG: ${{ matrix.slug }}
      REPOSITORY: ${{ matrix.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-${{ matrix.id }}.${{ matrix.slug }}
          path: parts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.id }}.${{ matrix.slug }}
          path: sbom
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The SBOM describes this platform's image, so it is attested against this platform's manifest digest.
      - name: Read the platform digest
        id: ref
        run: |
          digest="$(sed -n "s/^[A-Z0-9_]*_IMAGE_DIGEST=//p" "parts/${IMAGE_ID}.${SLUG}.digest.env" 2>/dev/null || true)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no valid digest for ${IMAGE_ID} (${SLUG}): ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Attest the SBOM
        if: ${{ github.event.repository.visibility == 'public' || vars.ATTESTATIONS_ENABLED == 'true' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          sbom-path: sbom/${{ matrix.id }}.image.sbom.cdx.json
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ steps.ref.outputs.digest }}
          push-to-registry: true
      - name: Summarise
        env:
          DIGEST: ${{ steps.ref.outputs.digest }}
        run: echo "- SBOM of \`${REPOSITORY}@${DIGEST}\` (${SLUG}) attested, or skipped when attestations are off (see sign-attest)" >> "$GITHUB_STEP_SUMMARY"

  # A v* tag only, after every image is signed: the chart as an OCI artifact in ghcr.io/<owner>/charts, its version
  # and appVersion the tag's (never the committed Chart.yaml literals). Signed and attested by digest here, so its
  # certificate names this workflow, like the images. A push to main publishes no chart: deploys use the
  # checked-out chart, so a chart per commit would only fill the registry.
  chart:
    name: Chart (package, push, sign)
    needs: sign-attest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write  # push the chart and attach its signature and attestation in ghcr.io
      id-token: write  # the GitHub OIDC token that Sigstore turns into a signing certificate
      attestations: write  # record the chart's build provenance
    env:
      CHART_DIR: charts/your-service-name
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cosign, the attestation push and helm push (through HELM_REGISTRY_CONFIG) all read this one login.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the pinned Helm and cosign
        run: |
          scripts/tools.sh install helm4 cosign
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Package the chart at the tag's version
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "${RUNNER_TEMP}/chart"
          helm package "${CHART_DIR}" --version "${version}" --app-version "${version}" --destination "${RUNNER_TEMP}/chart"
          pkg="$(find "${RUNNER_TEMP}/chart" -name '*.tgz')"
          name="$(basename "${pkg}" "-${version}.tgz")"
          {
            echo "package=${pkg}"
            echo "version=${version}"
            echo "repository=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts/${name}"
          } >> "$GITHUB_OUTPUT"
          echo "- chart \`${name}\` packaged at version \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Push the chart
        id: push
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          set -euo pipefail
          export HELM_REGISTRY_CONFIG="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          out="$(helm push "${PACKAGE}" "oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/charts" 2>&1)"
          echo "${out}"
          digest="$(sed -n 's/^Digest: //p' <<<"${out}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::helm push reported no valid digest: ${digest}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign the chart digest (keyless)
        env:
          REPOSITORY: ${{ steps.package.outputs.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REPOSITORY}@${DIGEST}"
      - name: Verify the signature
        env:
          REPOSITORY: ${{ steps.package.outputs.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${REPOSITORY}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/reusable-build.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" > /dev/null
      # The same guard as the images' attestations (see sign-attest, which also warns when they are off).
      - name: Attest the chart's build provenance
        if: ${{ github.event.repository.visibility == 'public' || vars.ATTESTATIONS_ENABLED == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.package.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # chart.env goes on the draft release (release.yml, release-assets).
      - name: Record the chart reference
        env:
          REPOSITORY: ${{ steps.package.outputs.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p chart
          printf 'CHART=%s\nCHART_VERSION=%s\nCHART_DIGEST=%s\n' "${REPOSITORY}" "${VERSION}" "${DIGEST}" > chart/chart.env
          echo "- chart \`${REPOSITORY}:${VERSION}\` pushed, signed and verified, digest \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: chart/chart.env
          retention-days: 90
