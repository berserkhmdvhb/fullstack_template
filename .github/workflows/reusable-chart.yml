name: Chart

# Call-only: ci.yml (pull requests and pushes) and deploy.yml (before any deploy) call this one.
on:
  workflow_call:

permissions: {}

env:
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'your-service-name' }}
  CHART_DIR: charts/your-service-name

jobs:
  chart:
    name: Helm lint and template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # kubeconform, promtool (the rule checks), yq (the bootstrap render and the rule extraction) and the
      # pinned Kubernetes OpenAPI spec (k8s-openapi) its schemas come from, each checksum-verified; the CRD
      # sources are fetched by their pinned sha256. The CRD check, kubeconform and the rule checks below
      # then run offline.
      - name: Install the pinned Helm, kubeconform, promtool and the schema sources
        run: |
          scripts/tools.sh install helm4 helm-unittest kubeconform promtool yq k8s-openapi crd-sources
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          echo "HELM_PLUGINS=$PWD/.tools/helm-plugins" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/pyyaml"
          "$RUNNER_TEMP/pyyaml/bin/pip" install --quiet --require-hashes --no-deps -r tools/requirements/pyyaml.txt
      # ct calls yamllint (with the tracked config the pre-commit hook also uses) and yamale (Chart.yaml schema).
      # GitHub runners ship neither and no uv, so each gets a venv from its hashed lock, as PyYAML does in ci.yml.
      - name: Install chart-testing, yamllint and yamale
        run: |
          scripts/tools.sh install ct
          for tool in yamllint yamale; do
            python3 -m venv "$RUNNER_TEMP/${tool}"
            "$RUNNER_TEMP/${tool}/bin/pip" install --quiet --require-hashes --no-deps -r "tools/requirements/${tool}.txt"
          done
      # The ct settings (.github/ct.yaml) are the kind job's too.
      - name: ct lint
        run: |
          : "${CHART_DIR:?CHART_DIR is required}"
          PATH="$RUNNER_TEMP/yamllint/bin:$RUNNER_TEMP/yamale/bin:$PATH" ct lint --config .github/ct.yaml --charts "${CHART_DIR}"
      - name: Chart unit tests and golden renders
        run: |
          : "${CHART_DIR:?CHART_DIR is required}"
          helm unittest "${CHART_DIR}"
      - name: Lint and render every values file
        run: |
          : "${CHART_DIR:?CHART_DIR is required}"
          helm version --short
          helm lint "${CHART_DIR}"
          for f in "${CHART_DIR}"/values.*.yaml "${CHART_DIR}"/ci/*-values.yaml; do
            name="$(basename "${f}" .yaml)"
            echo "== ${name}"
            helm lint "${CHART_DIR}" -f "${f}"
            helm template "${SERVICE_NAME}" "${CHART_DIR}" -f "${f}" > "${RUNNER_TEMP}/rendered-${name}.yaml"
            echo "- \`${name}\`: lint and template ok ($(wc -l < "${RUNNER_TEMP}/rendered-${name}.yaml") lines)" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: The vendored CRD schemas match their pinned sources
        run: '"$RUNNER_TEMP/pyyaml/bin/python" -I scripts/ci/kube_schemas.py crds check'
      - name: kubeconform every render (strict, offline)
        run: |
          scripts/ci/kubeconform.sh | tee "${RUNNER_TEMP}/kubeconform.txt"
          echo "- $(tail -n 1 "${RUNNER_TEMP}/kubeconform.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: promtool checks the rules of both flavours and runs their unit tests (offline)
        run: scripts/ci/rules-test.sh
      # The negative render: a production release whose config.ENV is not production would run the
      # backend with its production checks off, so validate-values.yaml must refuse it. The step fails
      # if that render succeeds, and if it fails for any other reason than the guard.
      - name: A production release with a dev ENV must not render
        run: |
          : "${CHART_DIR:?CHART_DIR is required}"
          err="${RUNNER_TEMP}/production-guard.err"
          if helm template "${SERVICE_NAME}" "${CHART_DIR}" --set environment=production --set config.ENV=dev > /dev/null 2> "${err}"; then
            echo "::error::the production guard did not fire: environment=production rendered with config.ENV=dev"
            exit 1
          fi
          if ! grep -q "environment is production but config.ENV" "${err}"; then
            echo "::error::the render failed, but not with the production guard's message:"
            cat "${err}"
            exit 1
          fi
          echo "- production guard: a dev ENV under environment=production is refused" >> "$GITHUB_STEP_SUMMARY"
