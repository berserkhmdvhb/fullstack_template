name: Chart

# Call-only: ci.yml (pull requests and pushes) and deploy.yml (before any deploy) call this one.
on:
  workflow_call:

permissions: {}

env:
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'your-service-name' }}
  CHART_DIR: charts/your-service-name

jobs:
  chart:
    name: Helm lint and template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Helm
        run: |
          scripts/tools.sh install helm4
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      # ct calls yamllint (with the tracked config the pre-commit hook also uses) and yamale (Chart.yaml schema).
      # GitHub runners ship neither and no uv, so each gets a venv from its hashed lock, as zizmor does in ci.yml.
      - name: Install chart-testing, yamllint and yamale
        run: |
          scripts/tools.sh install ct
          for tool in yamllint yamale; do
            python3 -m venv "$RUNNER_TEMP/${tool}"
            "$RUNNER_TEMP/${tool}/bin/pip" install --quiet --require-hashes --no-deps -r "tools/requirements/${tool}.txt"
          done
      # --check-version-increment needs a target branch (the checkout is shallow). --validate-maintainers would look
      # up the maintainers' GitHub accounts over the network, and the chart's maintainer is a placeholder.
      - name: ct lint
        run: |
          : "${CHART_DIR:?CHART_DIR is required}"
          PATH="$RUNNER_TEMP/yamllint/bin:$RUNNER_TEMP/yamale/bin:$PATH" ct lint --charts "${CHART_DIR}" \
            --lint-conf .github/ct-lintconf.yaml --chart-yaml-schema .github/ct-chart-schema.yaml \
            --validate-maintainers=false --check-version-increment=false
      - name: Lint and render every values file
        run: |
          : "${CHART_DIR:?CHART_DIR is required}"
          helm version --short
          helm lint "${CHART_DIR}"
          for f in "${CHART_DIR}"/values.*.yaml; do
            name="$(basename "${f}" .yaml)"
            echo "== ${name}"
            helm lint "${CHART_DIR}" -f "${f}"
            helm template "${SERVICE_NAME}" "${CHART_DIR}" -f "${f}" > "${RUNNER_TEMP}/rendered-${name}.yaml"
            echo "- \`${name}\`: lint and template ok ($(wc -l < "${RUNNER_TEMP}/rendered-${name}.yaml") lines)" >> "$GITHUB_STEP_SUMMARY"
          done
