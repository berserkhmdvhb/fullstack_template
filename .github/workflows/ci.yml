name: CI

on:
  # labeled and unlabeled re-run the whole workflow (every job runs as on any other pull request event): the
  # api-compat job reads the breaking-change label, and a label change must never leave the test jobs out of
  # `CI OK`. No job's `if:` looks at the event action.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      pins: ${{ steps.filter.outputs.pins }}
      images: ${{ steps.filter.outputs.images }}
      kind: ${{ steps.filter.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Everything runs on main, on tags and on a manual run; only pull requests are filtered.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            printf '%s\n' backend=true frontend=true pins=true images=true kind=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(src/|tests/|alembic|pyproject\.toml|uv\.lock|Makefile|frontend/lib/api/|\.github/|scripts/|infra/|tools/|deploy/|wiki/)' <<<"$changed"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(frontend/|Makefile|\.github/|scripts/|tools/)' <<<"$changed"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(tools/pins\.tsv|tools/requirements/|infra/security/config\.yaml|charts/[^/]+/ci/crds/sources\.tsv|scripts/pins[-_]refresh\.|\.github/workflows/(reusable-pins|pins-drift)\.yml)' <<<"$changed"; then
            echo "pins=true" >> "$GITHUB_OUTPUT"
          else
            echo "pins=false" >> "$GITHUB_OUTPUT"
          fi
          # What the two Dockerfiles copy in, the Dockerfiles themselves and the check script.
          if grep -Eq '^(Dockerfile\.|\.dockerignore|src/|pyproject\.toml|uv\.lock|alembic\.ini|README\.md|LICENSE|VERSION|frontend/|\.github/|scripts/|tools/)' <<<"$changed"; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi
          # What the kind job deploys: the images' inputs, the chart, the bootstrap and the scripts and pins it runs.
          if grep -Eq '^(Dockerfile\.|\.dockerignore|src/|pyproject\.toml|uv\.lock|alembic\.ini|README\.md|LICENSE|VERSION|frontend/|charts/|infra/k8s/|\.github/|scripts/|tools/|Makefile)' <<<"$changed"; then
            echo "kind=true" >> "$GITHUB_OUTPUT"
          else
            echo "kind=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-backend.yml

  # The OpenAPI drift check runs when either side changed, because schema changes come from the backend.
  frontend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-frontend.yml
    with:
      frontend-changed: ${{ needs.changes.outputs.frontend == 'true' }}

  # Blocking. A pull request checks only the pin rows it changed, and only when a pin file or the refresh script
  # changed; main and the weekly pins-drift.yml check every row. Red after a version bump by design: run `make pins-refresh`.
  pins:
    needs: changes
    if: needs.changes.outputs.pins == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-pins.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}

  # Always runs (no paths gate): lints and renders the chart for every values file.
  chart:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-chart.yml

  # The full stack runs when either side changed; it is advisory on pull requests and blocking on main and tags.
  # It waits for the gates above, but a skipped gate does not stop it.
  live:
    needs: [changes, backend, frontend]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-live.yml

  # Always runs (no paths gate). The grants are the union of what security.yml's jobs need.
  security:
    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning
      actions: read  # code scanning reads workflow run metadata
    uses: ./.github/workflows/security.yml

  repo:
    name: Shell, secrets and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One cache per job: the jobs install different tools, so a shared key would let the first save win. Restored everywhere, saved only from a push to main.
      - id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-repo-shellcheck-bats-yq-kyverno-squawk-oasdiff-${{ runner.os }}-${{ hashFiles('tools/pins.tsv') }}
      - name: Install the pinned tools
        run: |
          scripts/tools.sh install shellcheck bats yq kyverno squawk oasdiff
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-repo-shellcheck-bats-yq-kyverno-squawk-oasdiff-${{ runner.os }}-${{ hashFiles('tools/pins.tsv') }}
      - name: Shellcheck
        run: bash scripts/ci/shell-lint.sh
      - name: Secret templates
        run: bash scripts/ci/check-secrets.sh
      - name: Security runner tests
        run: |
          LIB_TS=0 bats infra/security/local/tests/
          bats tests/scripts/
      - name: Admission policy tests
        run: kyverno test deploy/policies --require-tests

  # Blocking, always runs: every tracked Dockerfile through the pinned hadolint (scripts/tools.sh).
  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One cache per job: the jobs install different tools, so a shared key would let the first save win. Restored everywhere, saved only from a push to main.
      - id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-hadolint-${{ runner.os }}-${{ hashFiles('tools/pins.tsv') }}
      - name: Install hadolint
        run: |
          scripts/tools.sh install hadolint
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-hadolint-${{ runner.os }}-${{ hashFiles('tools/pins.tsv') }}
      - name: hadolint
        run: bash scripts/ci/hadolint.sh

  # Blocking. Compares the committed OpenAPI snapshot with the merge commit's first parent, the base (scripts/ci/oasdiff.sh) and fails on a
  # breaking change unless the pull request carries the `breaking-change` label. Only users with triage permission
  # or above can add a label (wiki/api-lifecycle.md). On a push the script skips with a summary line.
  api-compat:
    name: API compatibility (oasdiff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # fetch-depth 2: on a pull request the checkout is the merge commit, and its first parent is the base snapshot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install oasdiff
        run: scripts/tools.sh install oasdiff
      - name: Compare the OpenAPI snapshot with the base branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          BREAKING_CHANGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        run: bash scripts/ci/oasdiff.sh

  # Blocking, always runs (no paths gate): the hardening lint, actionlint and zizmor over .github/.
  workflows:
    name: Workflow hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          scripts/tools.sh install actionlint
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      # PyYAML for the lint comes from a hashed venv; its bin goes on PATH for this one command only (never GITHUB_PATH).
      - name: Install PyYAML for the hardening lint
        run: |
          python3 -m venv "$RUNNER_TEMP/pyyaml"
          "$RUNNER_TEMP/pyyaml/bin/pip" install --quiet --require-hashes --no-deps -r tools/requirements/pyyaml.txt
      - name: CI hardening lint
        run: PATH="$RUNNER_TEMP/pyyaml/bin:$PATH" infra/security/check-ci-hardening.sh
      - name: actionlint
        run: actionlint
      - name: Install zizmor
        run: |
          python -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --no-deps -r tools/requirements/zizmor.txt
      # The read-only token turns on zizmor's online audits (impostor commits, known-vulnerable actions).
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" .github/

  # Blocking on pull requests. Plans the image matrix with the same helper the release uses; the images job below
  # builds each image locally and checks its structure. A push to main and a v* tag skip both: the release build
  # (reusable-build.yml) checks the pushed image by digest instead.
  image-plan:
    name: Plan the image checks
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      platform_matrix: ${{ steps.plan.outputs.platform_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The helper imports PyYAML and this job has no setup-python; a hashed venv supplies it.
      - name: Install PyYAML for the matrix helper
        run: |
          python3 -m venv "$RUNNER_TEMP/pyyaml"
          "$RUNNER_TEMP/pyyaml/bin/pip" install --quiet --require-hashes --no-deps -r tools/requirements/pyyaml.txt
      # A pull request checks linux/amd64 only, whatever vars.BUILD_ARM64 says; the release path checks arm64 natively.
      - name: Render the matrix
        id: plan
        env:
          BUILD_ARM64: "false"
        run: |
          matrix="$("$RUNNER_TEMP/pyyaml/bin/python" .github/scripts/container_matrix.py --matrix | head -n 1)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  # Blocking on pull requests: build each image into the local daemon (no push, no registry login, no secrets, no
  # build cache, so a pull request can never write what a release build reads), then run scripts/ci/image-checks.sh
  # --strict: numeric non-root user, no shell in the distroless images, a passing HEALTHCHECK, real labels.
  images:
    name: Image checks (${{ matrix.id }})
    needs: [changes, image-plan]
    if: github.event_name == 'pull_request' && needs.changes.outputs.images == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.platform_matrix) }}
    env:
      IMAGE_ID: ${{ matrix.id }}
      IMAGE_REF: image-checks-pr/${{ matrix.id }}:pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same build arguments as the release build: the matrix's own, plus the label values. The one local
      # build path, scripts/ci/build-image.sh, is also make image-checks' and the kind job's.
      - name: Build the image locally
        env:
          ENTRY: ${{ toJSON(matrix) }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VCS_REF: ${{ github.sha }}
          VCS_BRANCH: ${{ github.ref_name }}
        run: bash scripts/ci/build-image.sh "${ENTRY}" "${IMAGE_REF}"
      - name: Check the image
        run: bash scripts/ci/image-checks.sh --strict "${IMAGE_ID}" "${IMAGE_REF}"

  # Blocking on pull requests: the chart in a real kind cluster, on the floor and the newest pinned node image
  # (reusable-kind.yml). Pull requests only, behind its path filter; a push to main and a v* tag skip it.
  kind:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.kind == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-kind.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}

  # The one required status check. Path-filtered jobs that are skipped and the matrix legs of the reusable
  # workflows have no stable check names, so the branch ruleset requires this job instead (see
  # wiki/github-repository-settings.md). Only backend, frontend, live and pins may be skipped, and only on a pull
  # request (their path filter); image-plan, images and kind may be skipped on any event (they run on pull
  # requests only, behind their path filters), but never fail; everything else (api-compat included) must succeed, and so must `changes`, or the filter never ran.
  # `live` is advisory on pull requests, so its result is ignored there instead of relying on how
  # continue-on-error surfaces through a called workflow.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, chart, backend, frontend, live, security, repo, hadolint, api-compat, workflows, pins, image-plan, images, kind]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every blocking job
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          bad="$(jq -r --arg ev "$EVENT_NAME" 'to_entries[] | .key as $k | .value.result as $r
            | select(
                if $k == "live" and $ev == "pull_request" then false
                elif ($k == "image-plan" or $k == "images" or $k == "kind") then ($r != "success" and $r != "skipped")
                elif ($k == "backend" or $k == "frontend" or $k == "pins") and $ev == "pull_request" then ($r != "success" and $r != "skipped")
                else $r != "success" end)
            | "\($k)=\($r)"' <<<"$NEEDS")"
          if [[ -n "$bad" ]]; then
            echo "::error::Blocking jobs did not pass: ${bad//$'\n'/, }"
            exit 1
          fi
          echo "All blocking jobs passed (path-filtered ones may be skipped on a pull request)."
