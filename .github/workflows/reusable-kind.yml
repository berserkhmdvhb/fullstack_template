name: Kind

# Call-only: ci.yml calls it on pull requests. The chart in a real cluster, on each pinned node image of
# tools/kind-nodes.tsv (the chart's kubeVersion floor and kind's newest): scripts/kind-up.sh and
# scripts/kind-deploy.sh, the same sequence `make kind-up kind-deploy` runs locally. The images are built
# here, into the runner's daemon only (no push, no registry, no cache), through the images job's build
# path (scripts/ci/build-image.sh); see wiki/infrastructure.md, Local cluster (kind).
on:
  workflow_call:
    inputs:
      base-sha:
        description: The pull request's base commit; its chart is installed first, then upgraded to this one
        type: string
        required: true

permissions: {}

jobs:
  kind:
    name: Kind (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    # The floor leg's steps take about 23 minutes on a workstation (the cluster
    # and the base-to-HEAD deploy 5, the shutdown check 4 with its limit upgrade and rollback, the
    # migration lifecycle 14 to 15), so 60 leaves more than twice that for a slower runner, its cold
    # tool, image and environment installs. The newest leg runs the browser, CSP (1, with its upgrade
    # and rollback), deploy script (5 to 6), pull request previews (2), tracing and Redis (2),
    # admission (1) and ZAP (1) steps instead of the migration lifecycle: about 22 minutes by those
    # steps' own times, plus the frontend and browser installs.
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: kind-${{ github.ref }}-${{ matrix.leg }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # The legs of tools/kind-nodes.tsv (a test keeps the two equal).
        leg: [floor, newest]
    env:
      LEG: ${{ matrix.leg }}
      BASE_SHA: ${{ inputs.base-sha }}
    steps:
      # The full history: the project's environment (uv sync) takes its version from the tags (setuptools_scm).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin "${BASE_SHA}"
      # kind, ct, Helm, yq, Node, both kubectl pins, cosign, the Kyverno chart (the admission test) and the
      # External Secrets Operator chart (the External Secrets test),
      # checksum-verified; the Gateway API CRDs by their pinned sha256 (crd-sources). Node derives the release's deployment id and runs Playwright. ct shells out to yamllint and yamale, and the image matrix helper imports
      # PyYAML: each gets a venv from its hashed lock.
      - name: Install the pinned tools
        run: |
          scripts/tools.sh install helm4 kubectl kubectl-floor kind ct yq node pnpm crd-sources cosign kyverno-chart external-secrets-chart
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          for tool in yamllint yamale pyyaml; do
            python3 -m venv "$RUNNER_TEMP/${tool}"
            "$RUNNER_TEMP/${tool}/bin/pip" install --quiet --require-hashes --no-deps -r "tools/requirements/${tool}.txt"
          done
      - name: Create the cluster
        run: scripts/kind-up.sh --node "${LEG}"
      - name: Deploy and test (images, bootstrap, ct, base to HEAD upgrade, helm test, WAF, deployer rights)
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VCS_REF: ${{ github.sha }}
          VCS_BRANCH: ${{ github.ref_name }}
        run: |
          PATH="$RUNNER_TEMP/yamllint/bin:$RUNNER_TEMP/yamale/bin:$PATH" PYTHON="$RUNNER_TEMP/pyyaml/bin/python" \
            scripts/kind-deploy.sh --base "${BASE_SHA}"
      # The project's environment from uv.lock with the pinned uv and the runner's Python, as setup-backend
      # installs it but without its cache: this job restores no cache.
      - name: Install the project's environment
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          scripts/tools.sh install uv
          .tools/bin/uv sync --locked --python "$(command -v python3)"
      # The suites against the release as deployed (before the shutdown check deletes and scales its Pods),
      # through scripts/ci/kind-forward.sh: port-forwards as the deployer, public = the frontend Service
      # (frontend, WAF, backend). What each proves: wiki/infrastructure.md, "In CI". Live and smoke are the
      # API and the edge on each Kubernetes version (the port-forward path is version behaviour), so both
      # legs run them (under a minute); Playwright and ZAP exercise the app's browser and HTTP surface, which
      # the version does not change, so only the newest leg runs them (about a minute each on a workstation).
      - name: Live suites (backend and public forwards)
        timeout-minutes: 10
        run: make kind-live
      - name: Smoke test (public forward)
        timeout-minutes: 5
        run: make kind-smoke
      - name: Install the frontend dependencies
        if: matrix.leg == 'newest'
        working-directory: frontend
        run: |
          node scripts/check-pnpm-version.mjs
          pnpm install --frozen-lockfile
      # As reusable-live.yml installs it: the version comes from the lockfile because pnpm exec runs the
      # locally installed Playwright.
      - name: Install the Playwright system deps
        if: matrix.leg == 'newest'
        timeout-minutes: 5
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" 2 10 130 pnpm exec playwright install-deps chromium
      - name: Download the Playwright browser
        if: matrix.leg == 'newest'
        timeout-minutes: 5
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" 2 10 130 pnpm exec playwright install chromium
      - name: Frontend live suite (Playwright, public forward)
        if: matrix.leg == 'newest'
        timeout-minutes: 10
        run: make kind-e2e
      # A real browser's CSP violation reaches the backend's log through the frontend and the WAF, and
      # the WAF's report-route exception stays narrow (tests/k8s/test_csp_report.py; wiki/security.md,
      # CSP Violation Reports). It turns cspReporting on with an upgrade and rolls the release back,
      # so the steps after it see the release as deployed. Newest leg, with Playwright.
      - name: CSP reports (a browser violation reaches the backend's log, public forward)
        if: matrix.leg == 'newest'
        timeout-minutes: 5
        run: make kind-csp-report-test
      # What it proves: a Pod deletion under load fails no request, through the Service and through the
      # WAF (reads and writes), on each Kubernetes version (what the legs differ in). Not that the shutdown
      # settings are needed: see wiki/infrastructure.md, "The shutdown check". Every leg runs it, about
      # four minutes each (its rate-limit upgrade and rollback included), so a flaky run has two
      # chances to fail the job.
      - name: Graceful shutdown (backend, frontend and backend-behind-WAF Pods deleted under load, no request fails)
        timeout-minutes: 20
        run: make kind-shutdown-test
      # The migration lifecycle (tests/k8s/test_migrations.py; wiki/database.md, "Proven on kind") on a
      # release and namespaces of its own, created and removed by the test, so it never touches the
      # release the steps above check, and it runs after them. Floor leg only: about 15 minutes, and
      # what it proves is Helm's and the Job controller's behaviour at the chart's oldest supported
      # Kubernetes; the newest leg already carries Playwright and ZAP, so the legs stay about even.
      - name: Migration lifecycle (own release; install, upgrades, rollbacks, failures, slow migration, timeouts, TLS, autogenerate)
        if: matrix.leg == 'floor'
        timeout-minutes: 30
        run: make kind-migration-test
      # scripts/ci/deploy-env.sh itself (tests/k8s/test_deploy_env.py; wiki/ci-cd.md, "Proven on kind"):
      # its test-only DEPLOY_ENV=kind, the main release's images pushed to the throwaway registry, on a
      # release and namespaces of its own, removed by the test, so it runs after the steps that check
      # the main release. Newest leg only (5 to 6 minutes on a workstation): the deploy path is Helm's
      # and the script's, and the floor leg carries the migration lifecycle, which runs it once too.
      - name: Deploy script (own release; install, no-op upgrade, failed upgrade and verify rolled back, failed first install and retry)
        if: matrix.leg == 'newest'
        timeout-minutes: 25
        run: make kind-deploy-env-test
      # The live-drift check (tests/k8s/test_drift.py; wiki/ci-cd.md, "Live drift"): deploy-env.sh deploys
      # and renders a release of its own, scripts/drift.py compares the two as the bootstrap's read-only
      # drift Role (a ServiceAccount token, never printed), after six hand edits and a redeploy. Newest
      # leg only (about 3 minutes on a workstation), after the deploy script test, whose path it shares.
      - name: Live drift (own release; hand edits reported, nothing after a redeploy, read-only identity)
        if: matrix.leg == 'newest'
        timeout-minutes: 15
        run: make kind-drift-test
      # Pull request previews (tests/k8s/test_previews.py; wiki/ci-cd.md, "Pull request previews"):
      # the preview bootstrap, deploy-env.sh with PREVIEW_PR for two pull requests and a redeploy, and
      # preview-cleanup.sh, as the preview deployer, the main release's images from the throwaway
      # registry, in namespaces of their own, removed by the test. Newest leg only (about 2 minutes
      # on a workstation), after the deploy script test, whose path it shares.
      - name: Pull request previews (own namespaces; two deployed, one redeployed, cleanup, the deployer fenced)
        if: matrix.leg == 'newest'
        timeout-minutes: 15
        run: make kind-preview-test
      # The image admission policy (tests/k8s/test_admission.py; wiki/admission-control.md, "Proven on
      # kind"): the pinned Kyverno, ephemeral keys and a throwaway registry, all removed by the test, and
      # a policy that matches only the test's namespace, so the release above is never judged by it;
      # it runs after the steps that need that release. Newest leg only (about half a minute on a
      # workstation once the images are pulled, a minute or two cold): the admission path is
      # Kyverno's, which the Kubernetes version barely changes, and the floor leg carries the
      # migration lifecycle.
      - name: Image admission (pinned Kyverno; signed and attested admitted, unsigned, unattested and other-key denied)
        if: matrix.leg == 'newest'
        timeout-minutes: 10
        run: make kind-admission-test
      # Tracing to a throwaway collector and the rate limit in a throwaway Redis, both through the
      # backend's NetworkPolicy (tests/k8s/test_tracing_redis.py; wiki/backend-architecture.md,
      # Tracing, and wiki/security.md, Backend Rate Limiting), on a release and namespaces of its own, removed by the test, so it runs after the steps
      # that need the main release. Newest leg only (about two minutes): NetworkPolicy is the CNI's and
      # the version does not change it, and the floor leg carries the migration lifecycle.
      - name: Tracing and Redis (own release; spans to a collector, the limit shared in Redis, both through the NetworkPolicy)
        if: matrix.leg == 'newest'
        timeout-minutes: 10
        run: make kind-tracing-redis-test
      # The app Secret from the External Secrets Operator (tests/k8s/test_external_secrets.py;
      # wiki/security.md, OpenBao): the pinned operator chart and OpenBao in dev mode (both by digest),
      # a store per namespace with Kubernetes auth, a release of its own with only the store values
      # switched to OpenBao; all removed by the test, nothing leaves the runner. Newest leg only (about
      # two minutes): the sync is the operator's, which the Kubernetes version barely changes.
      - name: External Secrets (pinned operator, OpenBao store; the app Secret synced, another namespace refused)
        if: matrix.leg == 'newest'
        timeout-minutes: 15
        run: make kind-external-secrets-test
      # Advisory, last: findings and tool errors warn and never fail the job (continue-on-error and a
      # verdict that exits 0), and its spider uses up the per-client rate limit for a minute, so no
      # blocking step runs after it. infra/security/local/scan-dast.sh with dast.yml's pinned image; the
      # ZAP container (host network: it reaches the forward on the runner's loopback) is named fst-zap-*.
      - name: ZAP baseline (advisory, public forward)
        id: zap
        if: matrix.leg == 'newest'
        continue-on-error: true
        timeout-minutes: 15
        run: make kind-zap
      - name: ZAP verdict (advisory)
        if: ${{ !cancelled() && steps.zap.outcome != 'skipped' }}
        run: |
          status="$(jq -r '.status' output/security/dast/report.json 2>/dev/null || echo ERROR)"
          case "${status}" in
            GREEN) echo "- ZAP baseline on kind: no findings" >> "$GITHUB_STEP_SUMMARY" ;;
            RED)
              echo "::warning title=ZAP baseline (advisory)::findings on the kind release; see the kind-dast artifact"
              echo "- ZAP baseline on kind: findings (advisory), see the kind-dast artifact" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "::warning title=ZAP baseline (advisory)::status ${status} (a tool error or a skip, not a finding); see the log"
              echo "- ZAP baseline on kind: ${status} (advisory)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
      - name: Upload the ZAP report
        if: ${{ !cancelled() && steps.zap.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-dast
          path: output/security/dast/
          if-no-files-found: warn
          retention-days: 90
      - name: Show the cluster state
        if: failure()
        run: |
          # The leg's own kubectl pin (tools/kind-nodes.tsv), within one minor of the server.
          kubectl_pin="$(awk -F'\t' -v leg="${LEG}" '!/^#/ && $1 == leg {print $2}' tools/kind-nodes.tsv)"
          "${kubectl_pin}" --kubeconfig .local/kind/kubeconfig get pods,jobs -A -o wide || true
          "${kubectl_pin}" --kubeconfig .local/kind/kubeconfig get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          # The graceful-shutdown test's load Pod, if one outlived it.
          "${kubectl_pin}" --kubeconfig .local/kind/kubeconfig get pods -A --no-headers \
            -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name | grep -- '-shutdown-load-' |
            while read -r ns pod; do "${kubectl_pin}" --kubeconfig .local/kind/kubeconfig logs -n "${ns}" "${pod}" || true; done || true
          # Kyverno's admission controller and the policy status, if the admission test left them (it prints
          # both itself before its cleanup when one of its tests fails).
          "${kubectl_pin}" --kubeconfig .local/kind/kubeconfig logs -n fst-kyverno deploy/kyverno-admission-controller \
            -c kyverno --tail=200 2>/dev/null || true
          "${kubectl_pin}" --kubeconfig .local/kind/kubeconfig get imagevalidatingpolicies -o yaml 2>/dev/null || true
          # The tracing and Redis test's collector and Redis, if it left them (it prints both itself
          # before its cleanup when one of its tests fails).
          for deploy in fst-otel-collector fst-redis; do
            "${kubectl_pin}" --kubeconfig .local/kind/kubeconfig logs -n your-service-name-feat-local "deploy/${deploy}" \
              --tail=200 2>/dev/null || true
          done
          # The port-forwards' logs (scripts/ci/kind-forward.sh), one file per Service and run (<name>-<pid>.log).
          for log in "${RUNNER_TEMP}"/kind-forward/*.log; do
            if [[ -f "${log}" ]]; then echo "--- ${log}"; tail -n 100 "${log}"; fi
          done
      - name: Delete the cluster
        if: always()
        run: scripts/kind-up.sh --delete
