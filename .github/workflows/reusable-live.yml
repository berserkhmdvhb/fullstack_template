name: Live

on:
  workflow_call:

permissions: {}

jobs:
  # One job boots the whole stack once and runs both live suites against it.
  # On a pull request the job is advisory (continue-on-error); on main, tags and manual runs a failure fails the run.
  live:
    name: Live suites (full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    env:
      FRONTEND_ROOT: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      # The standalone server the entrypoint starts comes from this build.
      - name: Build the frontend
        working-directory: frontend
        run: npm run build
      # The version comes from the lockfile because npx runs the locally installed Playwright.
      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # The entrypoint needs nginx and envsubst. Keep the image's copy when present, else install the distro package.
      - name: Ensure nginx and envsubst
        run: |
          declare -A pkg=([nginx]=nginx [envsubst]=gettext-base)
          missing=()
          for cmd in nginx envsubst; do
            if command -v "$cmd" >/dev/null; then
              echo "$cmd: from the image"
              echo "$cmd: from the image" >> "$GITHUB_STEP_SUMMARY"
            else
              missing+=("$cmd")
            fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            for cmd in "${missing[@]}"; do
              sudo apt-get install -y --no-install-recommends "${pkg[$cmd]}"
              echo "$cmd: installed (${pkg[$cmd]})"
              echo "$cmd: installed (${pkg[$cmd]})" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
      - name: Start the stack
        id: stack
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          export BACKEND_URL="http://127.0.0.1:${BACKEND_PORT:-8000}"
          ./infra/runtime/entrypoint.sh --mode all --no-wait > stack.log 2>&1 &
          echo $! > stack.pid
          python tests/utils/wait_for_service.py "http://127.0.0.1:${BACKEND_PORT:-8000}/api/${API_VERSION:-v1}/health" 60 0.5 Backend
          python tests/utils/wait_for_service.py "http://127.0.0.1:${FRONTEND_PORT:-3000}/" 60 0.5 Frontend
          # Fail fast when the client bundles are not served, before the browser run.
          python tests/utils/check_hydration.py "http://127.0.0.1:${FRONTEND_PORT:-3000}" 30 1 Frontend
          python tests/utils/wait_for_service.py "http://127.0.0.1:${NGINX_PORT:-8081}/healthz" 30 0.5 Nginx
      - name: Backend live suite
        run: make test-live
      - name: Frontend live suite (Playwright)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-playwright-reports
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
      - name: Warn that the live suite failed
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo '::warning title=Live suites (advisory)::The live suite failed. It is advisory on pull requests and blocking on main and tags.'
          echo 'live suite failed (advisory on PRs)' >> "$GITHUB_STEP_SUMMARY"
      # Show the stack log on failure; it holds service output only, never secrets.
      - name: Show the stack log
        if: failure()
        run: tail -n 200 stack.log || true
      - name: Stop the stack
        if: always()
        run: |
          if [[ -f stack.pid ]]; then kill "$(cat stack.pid)" 2>/dev/null || true; fi
