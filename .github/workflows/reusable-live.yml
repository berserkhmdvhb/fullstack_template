name: Live

on:
  workflow_call:

permissions: {}

jobs:
  # One job boots the whole stack once and runs both live suites against it.
  # On a pull request the job is advisory (continue-on-error); on main, tags and manual runs a failure fails the run.
  live:
    name: Live suites (full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    env:
      FRONTEND_ROOT: ./frontend
      # Read by the frontend build (Next.js deploymentId) and by the header test that checks it.
      NEXT_DEPLOYMENT_ID: live-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      # The standalone server the entrypoint starts comes from this build.
      - name: Build the frontend
        working-directory: frontend
        run: pnpm run build
      # The version comes from the lockfile because pnpm exec runs the locally installed Playwright.
      - name: Install the Playwright system deps
        timeout-minutes: 22
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/scripts/ci/playwright-deps.sh"
      - name: Download the Playwright browser
        timeout-minutes: 5
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" 2 10 130 pnpm exec playwright install chromium
      - name: Start the stack
        id: stack
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          export BACKEND_URL="http://127.0.0.1:${BACKEND_PORT:-8000}"
          # Its own process group (its PID), so the stop step can signal every server it started.
          setsid ./infra/runtime/entrypoint.sh --mode all --no-wait > stack.log 2>&1 &
          echo $! > stack.pid
          python tests/utils/wait_for_service.py "http://127.0.0.1:${BACKEND_PORT:-8000}/api/${API_VERSION:-v1}/health" 60 0.5 Backend
          python tests/utils/wait_for_service.py "http://127.0.0.1:${FRONTEND_PORT:-3000}/" 60 0.5 Frontend
          # Fail fast when the client bundles are not served, before the browser run.
          python tests/utils/check_hydration.py "http://127.0.0.1:${FRONTEND_PORT:-3000}" 30 1 Frontend
      # The frontend is the one public port of this stack: it serves the pages and proxies /api, /docs and
      # /openapi.json, so test_full_stack.py (which skips without PUBLIC_PORT) targets it.
      - name: Backend live suite
        timeout-minutes: 30
        run: PUBLIC_PORT="${FRONTEND_PORT:-3000}" make test-live
      - name: Frontend live suite (Playwright)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        timeout-minutes: 30
        working-directory: frontend
        run: pnpm run test:e2e
      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-playwright-reports
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
      - name: Warn that the live suite failed
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo '::warning title=Live suites (advisory)::The live suite failed. It is advisory on pull requests and blocking on main and tags.'
          echo 'live suite failed (advisory on PRs)' >> "$GITHUB_STEP_SUMMARY"
      # Show the stack log on failure; it holds service output only, never secrets.
      - name: Show the stack log
        if: failure()
        run: tail -n 200 stack.log || true
      # The entrypoint's exit trap stops the servers it started and waits for them. If the entrypoint outlives
      # its 60 s, the step kills its process group (a warning names the PID); then it fails if a stack port
      # is still taken, so no server from the stack is left listening when the step passes.
      - name: Stop the stack
        if: always()
        run: |
          if [[ -f stack.pid ]]; then
            pid="$(cat stack.pid)"
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            if kill -0 "$pid" 2>/dev/null; then
              echo "::warning title=Stop the stack::the entrypoint (PID $pid) outlived its stop; killing its process group"
              kill -KILL -- "-$pid" 2>/dev/null || true
              sleep 2
            fi
          fi
          busy=""
          for port in "${BACKEND_PORT:-8000}" "${FRONTEND_PORT:-3000}" "${METRICS_PORT:-9102}"; do
            [[ -z "$(ss -Htln "sport = :$port")" ]] || busy+=" $port"
          done
          if [[ -n "$busy" ]]; then
            echo "::error title=Stop the stack::still listening after the stop:$busy"
            exit 1
          fi
