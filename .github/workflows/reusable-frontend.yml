name: Frontend

on:
  workflow_call:
    inputs:
      frontend-changed:
        description: Whether frontend paths changed. The OpenAPI drift check runs either way.
        type: boolean
        default: true

permissions: {}

jobs:
  eslint:
    name: ESLint
    if: inputs.frontend-changed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      # The script runs eslint with --max-warnings=0.
      - name: ESLint
        working-directory: frontend
        run: npm run lint

  prettier:
    name: Prettier
    if: inputs.frontend-changed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Prettier
        working-directory: frontend
        run: npm run format-check

  type-check:
    name: Type check
    if: inputs.frontend-changed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Type check
        working-directory: frontend
        run: npm run typecheck

  # Needs both toolchains: the backend dumps the schema, the frontend regenerates the types.
  openapi-drift:
    name: OpenAPI drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - name: OpenAPI drift
        run: make openapi-drift-check

  # Build runs before the unit tests, as in the original pipeline.
  build:
    name: Build
    if: inputs.frontend-changed
    needs: [eslint, prettier, type-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Next.js build
        working-directory: frontend
        run: npm run build

  # The coverage gates live in the vitest config, not here. The unit job runs the pure-logic files for a fast
  # signal; the integration job then runs the WHOLE suite once, with coverage, so the gate counts every test.
  unit:
    name: Unit tests
    if: inputs.frontend-changed
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-unit-reports
          path: |
            frontend/test-results/junit.xml
          retention-days: 7

  integration:
    name: Integration tests and coverage
    if: inputs.frontend-changed
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Whole suite with the coverage gate
        working-directory: frontend
        run: npm run test:coverage
      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-integration-reports
          path: |
            frontend/test-results/junit-coverage.xml
            frontend/coverage/
          retention-days: 7

  # Lists the Playwright tests only, which validates the config and discovery with no browser install.
  # The real browser run belongs to the live job, which arrives in a later task.
  playwright-list:
    name: Playwright config
    if: inputs.frontend-changed
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Playwright test discovery
        working-directory: frontend
        run: npx playwright test --list

  # Blocking: axe scans the built app (frontend/e2e/a11y.spec.ts) through Playwright's webServer (`next start`),
  # so a pull request is gated, not only main. The backend is not needed: the spec answers the API itself.
  a11y:
    name: Accessibility (axe)
    if: inputs.frontend-changed
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Next.js build
        working-directory: frontend
        run: npm run build
      # The version comes from the lockfile because npx runs the locally installed Playwright.
      - name: Install the Playwright system deps
        timeout-minutes: 5
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" 2 10 130 npx playwright install-deps chromium
      - name: Download the Playwright browser
        timeout-minutes: 5
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" 2 10 130 npx playwright install chromium
      - name: axe accessibility scan
        working-directory: frontend
        run: npm run test:a11y
      - name: Upload the test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-a11y-reports
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  # Advisory, like the Python 3.14 leg of reusable-backend.yml: continue-on-error keeps a red job out of `frontend`,
  # and so out of `CI OK`. Budget findings (frontend/lighthouserc.json) become ::warning annotations and a summary
  # line; the job fails only on a tool error (the build, the browser, collect, or a broken config).
  lighthouse:
    name: Lighthouse CI (advisory)
    if: inputs.frontend-changed
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Note the advisory job
        run: echo 'Lighthouse CI is advisory, so budget findings are warnings and do not block the merge.' >> "$GITHUB_STEP_SUMMARY"
      - name: Next.js build
        working-directory: frontend
        run: npm run build
      - name: Install the Playwright system deps
        timeout-minutes: 5
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" 2 10 130 npx playwright install-deps chromium
      - name: Download the Playwright browser
        timeout-minutes: 5
        working-directory: frontend
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry.sh" 2 10 130 npx playwright install chromium
      # Lighthouse drives the Playwright Chromium (CHROME_PATH), so there is no second browser download.
      - name: Collect the Lighthouse runs
        working-directory: frontend
        run: |
          CHROME_PATH="$(node -p "require('@playwright/test').chromium.executablePath()")"
          export CHROME_PATH
          npx lhci collect --config=lighthouserc.json
      # A budget miss becomes ::warning annotations and a summary line (exit 0); anything else is a tool error.
      - name: Check the budgets
        working-directory: frontend
        run: ../scripts/ci/lighthouse-assert.sh
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
          include-hidden-files: true # the directory name starts with a dot
          retention-days: 7
      - name: Warn that the job failed on a tool error
        if: failure()
        run: |
          echo '::warning title=Lighthouse (advisory)::Lighthouse CI hit a tool error (build, browser, collect or the budget check), so no budgets were checked. This job is advisory and does not block the merge.'
          echo 'Lighthouse CI FAILED on a tool error (not blocking).' >> "$GITHUB_STEP_SUMMARY"
