name: Docs site deploy

# Publishes docs-site/ to GitHub Pages (ADR-0041) on a push to main that changes the site's inputs. Pull requests
# build the site in ci.yml and never deploy; a fork never deploys. When Pages is not enabled, or its source is not
# GitHub Actions, the run is a green no-op with a notice (scripts/github-settings.sh enables it).
on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - wiki/**
      - CONTRIBUTING.md
      - tools/pins.tsv
      - frontend/scripts/check-npm-version.mjs
      - .github/workflows/docs-site.yml
      - .github/workflows/reusable-docs-site.yml
  workflow_dispatch:

permissions: {}

# One deploy at a time; a newer push queues behind the running one instead of cancelling it mid-deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pages:
    name: Check that Pages is enabled
    if: github.event.repository.fork == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read  # read the repository's Pages settings, to skip the deploy when Pages is off
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      url: ${{ steps.check.outputs.url }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if found="$(gh api "repos/${REPO}/pages" --jq '[.build_type, .html_url] | @tsv' 2>"$RUNNER_TEMP/pages.err")"; then
            IFS=$'\t' read -r source url <<<"$found"
            if [[ "$source" == "workflow" ]]; then
              # The published URL (a custom domain included): the build takes the site's site and base from it.
              printf '%s\n' "enabled=true" "url=${url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice title=Docs site not deployed::GitHub Pages builds from a branch here, not from GitHub Actions, and scripts/github-settings.sh leaves such a site as it is. To publish the docs site instead, set Settings > Pages > Source to GitHub Actions."
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages.err"; then
            echo "::notice title=Docs site not deployed::GitHub Pages is not enabled for this repository. Run scripts/github-settings.sh to enable it with Source: GitHub Actions."
          else
            cat "$RUNNER_TEMP/pages.err" >&2
            exit 1
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"

  build:
    needs: pages
    if: needs.pages.outputs.enabled == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-docs-site.yml
    with:
      upload-pages: true
      site-url: ${{ needs.pages.outputs.url }}

  # The only job that holds pages: write and id-token: write, in the github-pages environment.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write  # publish the uploaded artifact to GitHub Pages
      id-token: write  # deploy-pages proves the run's identity to Pages with an OIDC token; no cloud credential
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
