# .github/container-images.yml — the image manifest (SSOT for which images build).
# .github/scripts/container_matrix.py renders it for the workflows, and
# infra/security/local/devsec.sh (local build) reads the same file. Minimal template ships
# a backend and a frontend image; add ids here to build more.
# Per image, scripts/ci/image-checks.sh also reads:
#   distroless: true  the image has no shell, package manager or fetcher (the check fails if one is found)
#   platforms         the platforms the image supports (default: linux/amd64 only); the repository
#                     variable BUILD_ARM64=true builds all of them, anything else builds linux/amd64 only
#   run_env, run_args optional: environment variables and extra `docker run` arguments the throwaway
#                     health-check container needs to start alone (none of the shipped images do)
# Placeholders: ${OWNER} and ${REPO} (lowercased GitHub owner and repository name) and
# ${VERSION} (the computed version).
schema_version: 1

# Metadata only — container_matrix.py implements the policy: the VERSION file is the
# baseline (0.0.0 when absent); a v* Git tag overrides it (channel prod).
version:
  # baseline: the committed VERSION file (0.0.0 when absent) — the human-meaningful
  # baseline, NOT `git describe`.
  baseline: version-file
  # override: a Git tag replaces the baseline for an actual release (CHANNEL=prod).
  override: git-tag
  package_name: your_service_name

# The native runner of each platform. Every platform is built on its own runner, never under
# emulation, and nothing else in the workflows names a runner for a platform.
runners:
  linux/amd64: ubuntu-24.04
  linux/arm64: ubuntu-24.04-arm

images:
  - id: backend
    repository: "ghcr.io/${OWNER}/${REPO}/backend"
    dockerfile: Dockerfile.backend
    distroless: true
    platforms: [linux/amd64, linux/arm64]
    context: .
    dockerfile_context: .
    build_args:
      VERSION: "${VERSION}"
  - id: frontend
    repository: "ghcr.io/${OWNER}/${REPO}/frontend"
    dockerfile: Dockerfile.frontend
    distroless: true
    platforms: [linux/amd64, linux/arm64]
    context: .
    dockerfile_context: .
    build_args:
      VERSION: "${VERSION}"
