services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      # ${VAR:?msg} makes `docker compose` fail fast with a clear message when
      # DB_PASSWORD is unset (e.g. a missing .env), instead of silently starting
      # Postgres with an empty password and a broken DATABASE_URL (K-M6, K-L1).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${DB_NAME:-service_template}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-service_template}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-app}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-service_template}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "${BACKEND_PORT:-8000}"
      DB_USER: app
      DB_NAME: service_template
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${BACKEND_PORT:-8000}/api/${API_VERSION:-v1}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "${BACKEND_PORT:-8000}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env
    environment:
      PORT: "${FRONTEND_PORT:-3000}"
      HOSTNAME: "0.0.0.0"
      # The browser calls same-origin /api/v1; the Next.js server proxies it to
      # the backend at runtime (frontend/middleware.ts). BACKEND_URL is a *runtime*
      # env, so one image serves every environment — unlike NEXT_PUBLIC_*, which
      # Next.js bakes into the browser bundle at build time and cannot vary per env.
      #
      # Crucially, this must target the backend over the compose network by *service
      # name* (`backend`), never `localhost` — inside this container localhost is the
      # frontend itself. Derive the port from BACKEND_PORT so custom ports work, and
      # deliberately do NOT inherit the host-oriented BACKEND_URL from .env (that one
      # points at 127.0.0.1 and is for host-side/direct access, e.g. run_backend.sh).
      BACKEND_URL: "http://backend:${BACKEND_PORT:-8000}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # curl is absent from the distroless Node runtime, so probe with Node's
      # built-in fetch (mirrors the HEALTHCHECK in Dockerfile.frontend). Target
      # FRONTEND_PORT, which is what the standalone server actually binds to inside
      # the container. The distroless base has no shell and /nodejs/bin is not on
      # PATH, so use the absolute node binary in exec form — a bare `node` here
      # would fail with "executable file not found".
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch(`http://localhost:${FRONTEND_PORT:-3000}/`).then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "${FRONTEND_PORT:-3000}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    env_file:
      - .env
    environment:
      NGINX_PORT: "${NGINX_PORT:-8081}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${NGINX_PORT:-8081}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "${NGINX_PORT:-8081}"
    ports:
      - "127.0.0.1:${NGINX_PORT:-8081}:${NGINX_PORT:-8081}"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
