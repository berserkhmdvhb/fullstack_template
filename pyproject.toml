# your-service-name — adaptable service template (see wiki/getting-started.md)

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "your_service_name"
dynamic = ["version"]
description = "Description of your_service_name"
authors = [{ name = "Your Name", email = "you@your-domain.example" }]
keywords = ["cli", "template", "python", "packaging"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115.0",
  "httpx",
  "pyjwt[crypto]>=2.10.1",
  "pydantic>=2.7.1",
  "pydantic-settings>=2.7",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg",
  "aiosqlite",
  "limits>=3.0",
  "prometheus-fastapi-instrumentator>=6.1.0",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# PEP 735 group: `uv sync` installs it, `uv sync --no-dev` and the runtime image leave it out.
[dependency-groups]
dev = [
  "asgi-lifespan>=2.1",
  "mypy>=1.10",
  "pysonar",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-watch",
  "PyYAML>=6",
  "ruff",
  "psycopg2-binary",
]

# The 7-day rule for uv.lock: a locked release must be at least 7 days old. A relative span is stored
# in the lock as `exclude-newer-span` and resolved when `uv lock` runs, so `uv lock --check` gives the
# same answer on any later day (see wiki/getting-started.md).
[tool.uv]
exclude-newer = "7 days"
# The PEP 517 build backend, pinned with hashes (uv records them in uv.lock). Versions are at least 7 days old.
# Refresh with the build requirements of [build-system] when the floor changes (see wiki/getting-started.md).
build-constraint-dependencies = [
  { requirement = "packaging==26.3", hashes = [
    "sha256:94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79",
    "sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
  ] },
  { requirement = "setuptools==84.2.1", hashes = [
    "sha256:3ff8b3b5492a0aa66960f4419365a86b84e013070d4313e4d4a6894f5d64d6bc",
    "sha256:ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2",
  ] },
  { requirement = "setuptools-scm==10.3.4", hashes = [
    "sha256:82f34c3e3084fc2b57d397200637cc13f2338004052d2fee47baa5f0e902464e",
    "sha256:a69f28bfc245608781205e912faae437c2b2165773afa4e7b979d77447a69dd2",
  ] },
  { requirement = "vcs-versioning==2.6.0", hashes = [
    "sha256:22e9159288e2d8bca2fa6f6c31c34c9c66aec157f60e9e526f5d160d2516d60f",
    "sha256:f8bebd1302ebc12e67ceb30fc7dd698ec969414b6fa43b30c3f14ac9b1e72c41",
  ] },
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["your_service_name*"]

[tool.setuptools.package-data]
# py.typed marks the package as typed. Interactive docs are served by FastAPI's
# built-in Swagger page from the jsDelivr CDN, so there are no vendored assets to
# ship inside the package.
your_service_name = ["py.typed"]

[tool.setuptools_scm]
version_file = "src/your_service_name/_version.py"

# ----------------------------
# Sonar Configuration
# ----------------------------
[tool.sonar]
projectKey = "your-service-key"
projectName = "your_service_name"

# roots
sources = "src"
tests = "tests"

# encoding
sourceEncoding = "UTF-8"

# Python versions (string; you can also do "3.10,3.11,3.12,3.13")
python.version = "3.13"

# coverage report path(s) - string; comma-separated if multiple
python.coverage.reportPaths = "coverage.xml"

# exclusions - string; comma-separated if multiple
exclusions = "**/__pycache__/**,**/.venv/**"

# ----------------------------
# Ruff Configuration
# ----------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
show-fixes = true
exclude = [
  "tests/exclude/*",
  "**/_version.py",
]
[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "TD",
  "FIX002",
  "TC003",
  "COM812",
  "CPY001",
  "F821",
  "ASYNC240",
]
per-file-ignores = { "tests/*" = ["S101", "S310", "S603", "SLF001", "T201"], "infra/adapt/*" = ["T201"], "infra/security/*" = ["T201"]}

# ----------------------------
# Mypy Configuration
# ----------------------------
[tool.mypy]
files = ["src", "tests"]
exclude = "\\.ipynb$"
strict = true
show_error_codes = true
pretty = true
mypy_path = "src"
follow_imports = "normal"
ignore_missing_imports = true

# ----------------------------
# Pytest Configuration
# ----------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# No --maxfail: show the FULL failure surface instead of stopping at the first
# failure (a suite that fails 10 ways should report all 10, not hide 9).
addopts = "-v -m 'not integration and not e2e and not live' --ignore=tests/manual"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: hermetic tests wiring multiple internal components (no real external IO)",
  "e2e: end-to-end tests through the public API, with network/LLM edges stubbed",
  "live: tests that require a running external backend server"
]
filterwarnings = [
  # NOTE: PytestUnhandledThreadExceptionWarning is deliberately NOT ignored — an
  # unhandled exception in a background thread is a real defect (e.g. a worker
  # that silently died), and masking it hid failures. Let it surface.
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# ----------------------------
# Coverage Configuration
# ----------------------------
[tool.coverage.run]
# Limit measurement strictly to your backend package
# (use the path form to avoid ambiguity)
source = ["src/your_service_name/backend", "src/your_service_name/utils"]

# Optionally belt-and-suspenders: omit frontend explicitly
omit = ["src/your_service_name/frontend/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError"
]
# Optional, but helpful in terminal output
show_missing = true
skip_covered = false
# Coverage GATE (single source of truth for the threshold): the whole suite
# fails when total coverage drops below this. Sourced here — not restated as
# --cov-fail-under in CI or the Makefile — so the number lives in one place.
# pytest-cov reads coverage.py's config, so this fails `pytest --cov` everywhere.
fail_under = 85

# If you run coverage in different environments and combine reports,
# you can normalize paths here (safe to keep as-is; optional).
[tool.coverage.paths]
source = ["src"]
